.hidden{display:none!important} .quizgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;margin-top:18px} .topline{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px} .pill{background:var(--soft);color:#1d4ed8;padding:7px 10px;border-radius:999px;font-weight:700;font-size:13px}

.navbuttons{display:flex;justify-content:space-between;gap:10px;margin-top:18px} .side h3{margin-top:0} .qnav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px} .qnum{padding:8px 0;border:1px solid var(--border);background:#fff;border-radius:8px;font-weight:700;font-size:13px} .qnum.current{outline:2px solid #2563eb} .qnum.right{background:#dcfce7;color:#166534;border-color:#86efac} .qnum.wrong{background:#fee2e2;color:#991b1b;border-color:#fca5a5}

<script>
const EXAMS=[{"name":"2024-2027 ĐỀ 170","questions":[{"number":1,"answer":"D","question":"Yếu tố nguy cơ nào KHÔNG gây bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"Các chất gây ô nhiễm khí thở ."},{"label":"B","text":"Thuốc lá ."},{"label":"C","text":"Bất thường về di truyền ."},{"label":"D","text":"Nhiễm trùng đường thở cấp ."}],"explanation":"Thuốc lá, ô nhiễm khí thở và bất thường về di truyền (như thiếu hụt Alpha-1 antitrypsin) là các yếu tố nguy cơ chính gây bệnh phổi tắc nghẽn mạn tính (BPTNMT). Nhiễm trùng đường thở cấp tính là yếu tố kích phát đợt cấp BPTNMT chứ không phải là yếu tố nguy cơ trực tiếp gây nên bệnh mạn tính. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài BPTNMT, trang 1)."},{"number":2,"answer":"B","question":"Các rối loạn chủ yếu của bệnh phổi tắc nghẽn mạn tính, NGOẠI TRỪ:","options":[{"label":"A","text":"Sự phơi nhiễm lâu dài với khói thuốc lá ở những người nhạy cảm sẽ thúc đẩy quá trình viêm và huy động các tế bào miễn dịch vào trong đường thở và phế nang. ."},{"label":"B","text":"Các tế bào viêm phóng thích anti-proteases làm tổn thương cấu trúc ngoại bào nâng đỡ đường thở, mao mạch và lớp bề mặt trao đổi khí của phổi. ."},{"label":"C","text":"Sự chết của các tế bào cấu trúc dẫn đến mất tính dãn nở của đường thở nhỏ, cắt xén mạch máu và phá hủy phế nang. ."},{"label":"D","text":"Quá trình sửa chữa bất thường của elastin và các thành phần cấu trúc ngoại bào khác góp phần làm giãn nở khoảng khí và khí phế thũng. ."}],"explanation":"Trong cơ chế bệnh sinh BPTNMT, các tế bào viêm phóng thích proteinases (enzyme thủy phân protein) gây mất cân bằng giữa proteinase và anti-proteinase, dẫn đến tổn thương cấu trúc ngoại bào. Anti-proteinases là các enzyme có tác dụng bảo vệ chứ không phải gây tổn thương. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài BPTNMT, trang 2-3)."},{"number":3,"answer":"B","question":"Vai trò của đại thực bào trong cơ chế bệnh sinh bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"Tiết ra Neutrophil elastase, Neutrophil cathepsin G và Neutrophil proteinase-3 ."},{"label":"B","text":"Giải phóng các chất oxy hoá, oxít nitơ, yếu tố hoại tử u (TNF-a), IL-8, LTB-4 ."},{"label":"C","text":"Giải phóng perforin, granzym B và TNF-a ."},{"label":"D","text":"Tiết ra các anti -proteinase ."}],"explanation":"Đại thực bào bị kích thích bởi khói thuốc lá và các chất ô nhiễm sẽ giải phóng các chất trung gian gây viêm như các chất oxy hóa, NO, TNF-alpha, Interleukin-8 (IL-8), và Leukotriene B4 (LTB-4) để thu hút bạch cầu đa nhân trung tính vào đường thở. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài BPTNMT, trang 3-4)."},{"number":4,"answer":"D","question":"Phát biểu đúng về enzyme ức chế proteinase trong cơ chế bệnh sinh của bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"Giải phóng từ bạch cầu đa nhân ."},{"label":"B","text":"Giải phóng từ đại thực bào ."},{"label":"C","text":"Tác dụng giáng hoá protein của tổ chức gian bào ."},{"label":"D","text":"Có tác dụng bảo vệ đường hô hấp ."}],"explanation":"Enzyme ức chế proteinase (anti-proteinase, điển hình là Alpha-1 antitrypsin) có tác dụng trung hòa các proteinase do tế bào viêm tiết ra, qua đó bảo vệ cấu trúc nhu mô phổi và đường hô hấp khỏi sự phá hủy. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài BPTNMT, trang 3)."},{"number":5,"answer":"C","question":"Tình trạng hẹp lòng đường thở trong COPD do nhiều tác động, NGOẠI TRỪ:","options":[{"label":"A","text":"Xơ hoá đường thở ."},{"label":"B","text":"Tăng ứ đọng đàm ."},{"label":"C","text":"Phá huỷ khoảng trao đổi khí ."},{"label":"D","text":"Thâm nhiễm tế bào ."}],"explanation":"Hẹp lòng đường thở nhỏ trong COPD do xơ hóa, tăng tiết và ứ đọng đờm nhầy, phù nề và thâm nhiễm tế bào viêm. Phá hủy khoảng trao đổi khí (phế nang) là tổn thương gây khí phế thũng, giảm diện tích trao đổi khí chứ không trực tiếp gây hẹp lòng đường thở. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài BPTNMT, trang 5)."},{"number":6,"answer":"D","question":"Hậu quả của việc giảm oxy và tăng CO2 máu trong bệnh phổi tắc nghẽn mạn tính là do, NGOẠI TRỪ:","options":[{"label":"A","text":"Tắc nghẽn đường thở ."},{"label":"B","text":"Phá huỷ nhu mô ."},{"label":"C","text":"Bất thường mạch máu phổi ."},{"label":"D","text":"Giảm kích thích trung tâm hô hấp ."}],"explanation":"Bất thường trao đổi khí (giảm O2 và tăng CO2 máu) trong BPTNMT là hậu quả của tắc nghẽn đường thở, phá hủy nhu mô phổi và bất thường mạch máu phổi. Để bù trừ, trung tâm hô hấp phải tăng hoạt động kích thích hô hấp ở hầu hết bệnh nhân. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài BPTNMT, trang 5-6)."},{"number":7,"answer":"B","question":"Tình trạng tăng áp động mạch phổi ở bệnh phổi tắc nghẽn mạn tính xuất hiện khi giảm oxy máu:","options":[{"label":"A","text":"< 80mmHg ."},{"label":"B","text":"< 60mmHg ."},{"label":"C","text":"< 55mmHg ."},{"label":"D","text":"< 50mmHg ."}],"explanation":"Tăng áp động mạch phổi phát triển ở giai đoạn nặng của BPTNMT khi tình trạng giảm oxy máu nặng (PaO2 < 60 mmHg), dẫn đến co mạch phổi mạn tính và tái cấu trúc thành mạch. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài BPTNMT, trang 5)."},{"number":8,"answer":"A","question":"Bệnh nhân bệnh phổi tắc nghẽn mạn tính, kết quả hô hấp ký sau test hồi phục phế quản FEV1/FVC=0,62 và FEV1 84%. Hãy kết luận giai đoạn bệnh:","options":[{"label":"A","text":"GOLD 1 ."},{"label":"B","text":"GOLD 2 ."},{"label":"C","text":"GOLD 3 ."},{"label":"D","text":"GOLD 4 ."}],"explanation":"Sau test hồi phục phế quản, tỷ số FEV1/FVC < 0,70 xác định có giới hạn luồng khí cố định. Phân độ mức độ tắc nghẽn dựa vào FEV1 (% giá trị dự đoán): FEV1 >= 80% thuộc mức độ nhẹ (GOLD 1). (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài BPTNMT, trang 7, 12)."},{"number":9,"answer":"A","question":"Bệnh nhân nam, 60 tuổi, được chẩn đoán bệnh phổi tắc nghẽn mạn tính FEV1 78%, nhóm A. Đánh giá triệu chứng/nguy cơ đợt kịch phát của bệnh nhân này:","options":[{"label":"A","text":"Ít triệu chứng, nguy cơ thấp ."},{"label":"B","text":"Ít triệu chứng, nguy cơ cao ."},{"label":"C","text":"Nhiều triệu chứng, nguy cơ thấp ."},{"label":"D","text":"Nhiều triệu chứng, nguy cơ cao ."}],"explanation":"Theo phân nhóm GOLD ABE (GOLD 2023), Nhóm A đại diện cho bệnh nhân có ít triệu chứng (mMRC 0-1 hoặc CAT < 10) và nguy cơ đợt cấp thấp (0 hoặc 1 đợt cấp trung bình trong năm qua, không phải nhập viện). BPTNMT, trang 12)."},{"number":10,"answer":"D","question":"Vi khuẩn gây bệnh phổ biến trong đợt cấp bệnh phổi tắc nghẽn mạn tính, NGOẠI TRỪ:","options":[{"label":"A","text":"Streptococcus pneumoniae ."},{"label":"B","text":"Mycoplasma catarrhalis ."},{"label":"C","text":"Haemophilus influenzae ."},{"label":"D","text":"Staphylococcus aureus ."}],"explanation":"Các vi khuẩn gây đợt cấp BPTNMT phổ biến nhất bao gồm Haemophilus influenzae, Streptococcus pneumoniae và Moraxella catarrhalis (Mycoplasma catarrhalis). Staphylococcus aureus ít gặp hơn nhiều trong các đợt cấp thông thường tại cộng đồng. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài BPTNMT, trang 13)."},{"number":11,"answer":"C","question":"Đợt cấp bệnh phổi tắc nghẽn mạn tính, NGOẠI TRỪ:","options":[{"label":"A","text":"Bệnh trở nên xấu đi vượt quá dao động hàng ngày ."},{"label":"B","text":"Virus gây bệnh phổ biến là Coronavirus, Rhinovirus, Paramyxovirus ."},{"label":"C","text":"Khoảng 10% đợt cấp không xác định căn nguyên ."},{"label":"D","text":"Ô nhiễm khí thở cũng là nguyên nhân gây bệnh ."}],"explanation":"Khoảng 20% đến 30% trường hợp đợt cấp BPTNMT không tìm thấy căn nguyên rõ ràng (chứ không phải 10%). Các nguyên nhân đã xác định gồm nhiễm vi khuẩn (khoảng 50%), virus hô hấp (20-30%) và ô nhiễm môi trường. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài BPTNMT, trang 13)."},{"number":12,"answer":"A","question":"Yếu tố nguy cơ nhiễm Pseudomonas spp (GOLD 2007) trong đợt cấp bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"Bệnh phổi tắc nghẽn mạn tính mức độ nặng ."},{"label":"B","text":"Mới nhập viện trong vòng 30 ngày ."},{"label":"C","text":"Điều trị kháng sinh ≥2 đợt/năm ."},{"label":"D","text":"Bệnh nhân có kèm hen phế quản ."}],"explanation":"Các yếu tố nguy cơ nhiễm Pseudomonas aeruginosa trong đợt cấp COPD theo GOLD bao gồm: BPTNMT mức độ nặng (FEV1 < 50% dự đoán), nhập viện gần đây, dùng kháng sinh thường xuyên (>= 4 đợt/năm) hoặc có tiền sử phân lập được P. aeruginosa. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài BPTNMT, trang 17)."},{"number":13,"answer":"D","question":"Chỉ định dùng kháng sinh trong đợt cấp BPTNMT khi có các dấu hiệu sau, NGOẠI TRỪ:","options":[{"label":"A","text":"Khó thở tăng ."},{"label":"B","text":"Thể tích đờm tăng ."},{"label":"C","text":"Đờm mủ tăng ."},{"label":"D","text":"Sốt cao liên tục ."}],"explanation":"Theo tiêu chuẩn Anthonisen, chỉ định kháng sinh trong đợt cấp BPTNMT dựa trên 3 triệu chứng chính: khó thở tăng, thể tích đờm tăng và đờm chuyển thành đờm mủ (hoặc khi cần thông khí nhân tạo). Sốt cao không nằm trong bộ tiêu chuẩn Anthonisen bắt buộc. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài BPTNMT, trang 17-18)."},{"number":14,"answer":"B","question":"Thời gian sử dụng kháng sinh khuyến cáo trong đợt cấp BPTNMT không có biến chứng là:","options":[{"label":"A","text":"3 ngày ."},{"label":"B","text":"5 ngày ."},{"label":"C","text":"10 ngày ."},{"label":"D","text":"14 ngày ."}],"explanation":"Theo hướng dẫn GOLD 2023 và Bộ Y tế, thời gian sử dụng kháng sinh khuyến cáo trong đợt cấp BPTNMT không biến chứng thông thường là 5 ngày. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài BPTNMT, trang 15, 18)."},{"number":15,"answer":"B","question":"Liều khuyến cáo của Corticoid đường uống (Prednisolone) trong điều trị đợt cấp BPTNMT là:","options":[{"label":"A","text":"20 mg/ngày trong 5 ngày ."},{"label":"B","text":"40 mg/ngày trong 5 ngày ."},{"label":"C","text":"60 mg/ngày trong 10 ngày ."},{"label":"D","text":"80 mg/ngày trong 14 ngày ."}],"explanation":"Liệu pháp Systemic Corticosteroid trong đợt cấp BPTNMT được khuyến cáo là Prednisolone 40 mg/ngày uống trong 5 ngày giúp cải thiện chức năng phổi và rút ngắn thời gian hồi phục. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài BPTNMT, trang 15, 18)."},{"number":16,"answer":"C","question":"Thuốc giãn phế quản thuộc nhóm kích thích beta 2 adrenergic trong xử trí đợt cấp bệnh phổi tắc nghẽn mạn tính, NGOẠI TRỪ:","options":[{"label":"A","text":"Salbutamol ."},{"label":"B","text":"Terbutalin ."},{"label":"C","text":"Ipratropium ."},{"label":"D","text":"Bambuterol ."}],"explanation":"Ipratropium (Ipratropium bromide) thuộc nhóm kháng cholinergic tác dụng ngắn (SAMA), không phải nhóm kích thích beta-2 adrenergic (SABA/LABA). Salbutamol, Terbutalin, Bambuterol đều thuộc nhóm đồng vận beta-2. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài BPTNMT, trang 15, 23)."},{"number":17,"answer":"A","question":"Mục tiêu oxy cho bệnh nhân đợt cấp bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"88-92% ."},{"label":"B","text":"92-94% ."},{"label":"C","text":"94-96% ."},{"label":"D","text":"96-98% ."}],"explanation":"Mục tiêu SpO2 trong liệu pháp oxy cho bệnh nhân đợt cấp BPTNMT là 88 - 92% nhằm cải thiện tình trạng giảm O2 máu mà tránh làm gia tăng nguy cơ ứ CO2 máu và toan hô hấp. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài BPTNMT, trang 16)."},{"number":18,"answer":"B","question":"Thông khí NIPPV trong đợt cấp bệnh phổi tắc nghẽn mạn tính nhằm các mục tiêu sau, NGOẠI TRỪ:","options":[{"label":"A","text":"Giảm CO2 ."},{"label":"B","text":"Giảm thông khí phổi ."},{"label":"C","text":"Giảm tử vong trong thời gian nằm viện ."},{"label":"D","text":"Tránh đặt nội khí quản và thở máy can thiệp ."}],"explanation":"Thông khí nhân tạo không xâm nhập (NIPPV) nhằm cải thiện và TĂNG thông khí phế nang, cải thiện toan hô hấp, giảm PaCO2, giảm công thở, giảm tỷ lệ tử vong và tránh đặt nội khí quản xâm lấn. Phát biểu 'giảm thông khí' là sai. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài BPTNMT, trang 16)."},{"number":19,"answer":"D","question":"Tiêu chuẩn ngưng theo dõi điều trị đợt cấp bệnh phổi tắc nghẽn mạn tính nội trú, NGOẠI TRỪ:","options":[{"label":"A","text":"Nhu cầu sử dụng beta 2 hít <6 lần/ngày ."},{"label":"B","text":"Có thể trở lại các sinh hoạt như trước đợt cấp ."},{"label":"C","text":"Lâm sàng ổn định trong 24h ."},{"label":"D","text":"Khí máu động mạch trở về bình thường ."}],"explanation":"Tiêu chuẩn xuất viện/ngưng theo dõi nội trú gồm: nhu cầu thuốc GPQ hít < 6 lần/ngày, lâm sàng và khí máu động mạch ỔN ĐỊNH trong 12-24 giờ, bệnh nhân tự sinh hoạt được. Khí máu động mạch ở bệnh nhân BPTNMT nặng mạn tính có thể có bất thường nền dai dẳng (như tăng CO2 mạn) chứ không bắt buộc trở về hoàn toàn 'bình thường' như người khỏe mạnh. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài BPTNMT, trang 19)."},{"number":20,"answer":"B","question":"Chọn 1 Câu sai: Đánh giá tiến triển bệnh phổi tắc nghẽn mạn tính","options":[{"label":"A","text":"Cần theo dõi kết quả chức năng phổi hàng năm, đánh giá dung tích chức năng bằng nghiệm pháp đi bộ theo thời gian. ."},{"label":"B","text":"Đo độ bão hoà oxy trong khí máu động mạch lúc gắng sức để hỗ trợ oxy liệu pháp. ."},{"label":"C","text":"Sử dụng bộ Câu hỏi trắc nghiệm đánh giá BPTNMT (CAT). ."},{"label":"D","text":"Ghi nhận tần suất, mức độ nặng, nguyên nhân của đợt cấp. ."}],"explanation":"Theo giáo trình, đánh giá tiến triển bệnh BPTNMT cần đo độ bão hòa oxy trong khí máu động mạch LÚC NGHỈ (chứ không phải lúc gắng sức) để xem xét chỉ định liệu pháp oxy dài hạn tại nhà. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài BPTNMT, trang 27-28)."},{"number":21,"answer":"A","question":"Trong viêm phổi thuỳ, theo mô tả của Laennec, giai đoạn sung huyết là:","options":[{"label":"A","text":"Các mao mạch thành phế nang giãn ra, hồng cầu, bạch cầu và fibrin thoát vào trong lòng phế nang ."},{"label":"B","text":"Tổ chức phổi bị thương tổn có màu đỏ sẫm và chắc như gan, trong tổ chức này có thể có xuất huyết ."},{"label":"C","text":"Thương tổn phổi có màu nâu xám chứa hồng cầu, bạch cầu, vi khuẩn và tổ chức hoại tử ."},{"label":"D","text":"Phế nang còn ít dịch loãng, có ít bạch cầu ."}],"explanation":"Trong giải phẫu bệnh viêm phổi thùy của Laennec: Giai đoạn sung huyết đặc trưng bởi các mao mạch phế nang giãn to, sung huyết, dịch tiết cùng ít hồng cầu, bạch cầu và fibrin bắt đầu thoát vào lòng phế nang. (Nguồn tham khảo: Bài giảng Bệnh học Nội khoa, Bài Viêm phổi thùy)."},{"number":22,"answer":"C","question":"Thuật ngữ Viêm phổi cộng đồng, Viêm phổi bệnh viện, Viêm phổi liên quan tới chăm sóc y tế, Viêm phổi thở máy là để:","options":[{"label":"A","text":"Chỉ tình trạng nặng hay nhẹ của viêm phổi ."},{"label":"B","text":"Chỉ điều kiện y tế cần chăm sóc đặc biệt ."},{"label":"C","text":"Để định hướng tác nhân vi sinh gây bệnh ."},{"label":"D","text":"Để phân loại bệnh học viêm phổi ."}],"explanation":"Phân loại viêm phổi theo hoàn cảnh xuất hiện (cộng đồng, bệnh viện, thở máy, chăm sóc y tế) giúp định hướng trực tiếp vi khuẩn gây bệnh dự đoán và nguy cơ đề kháng kháng sinh, từ đó lựa chọn phác đồ điều trị kháng sinh kinh nghiệm thích hợp. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi cộng đồng & VPBV)."},{"number":23,"answer":"A","question":"Chọn 1 Câu sai trong những trả lời sau đây: Chẩn đoán và đánh giá viêm phổi ở cộng đồng","options":[{"label":"A","text":"Cần xét nghiệm công thức máu và Xquang ngực thẳng cho tất cả các trường hợp chẩn đoán viêm phổi ở cộng đồng ."},{"label":"B","text":"Xquang ngực là cần thiết khi chẩn đoán viêm phổi ở cộng đồng ."},{"label":"C","text":"Trên người trẻ tiền sử khỏe mạnh, với bệnh cảnh nhiễm trùng hô hấp cấp tính có triệu chứng thực thể phổi có thể chẩn đoán viêm phổi không cần chụp Xquang ngực nếu điều trị ngoài bệnh viện. ."},{"label":"D","text":"Không cần xét nghiệm ure máu cho tất cả các trường hợp chẩn đoán viêm phổi ở cộng đồng. ."}],"explanation":"Đối với người trẻ khỏe mạnh điều trị ngoại trú tại cộng đồng, không nhất thiết phải làm công thức máu và X-quang cho tất cả mọi trường hợp nhẹ nếu lâm sàng rõ ràng. Do đó câu A khẳng định 'cho tất cả các trường hợp' là sai. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi cộng đồng, trang 103)."},{"number":24,"answer":"B","question":"Tác nhân nào sau đây KHÔNG phải là nguyên nhân gây viêm phổi cộng đồng:","options":[{"label":"A","text":"Streptococcus pneumoniae ."},{"label":"B","text":"Mycobacterium tuberculosis ."},{"label":"C","text":"Haemophilus influenzae ."},{"label":"D","text":"Klebsiella pneumonia ."}],"explanation":"Mycobacterium tuberculosis là tác nhân gây bệnh Lao phổi (nhiễm trùng mạn tính đặc hiệu), không xếp vào nhóm các vi khuẩn gây Viêm phổi cộng đồng cấp tính thông thường. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi cộng đồng)."},{"number":25,"answer":"D","question":"Các yếu tố nguy cơ nhiễm P.aeruginosa đề kháng kháng sinh ở bệnh nhân viêm phổi cộng đồng bao gồm:","options":[{"label":"A","text":"Tiền sử đã nhiễm tụ cầu kháng Methicilline ."},{"label":"B","text":"Tiền sử đã nhiễm phế cầu kháng Penicilline ."},{"label":"C","text":"Nhiễm trùng da tái diễn ."},{"label":"D","text":"Có bệnh cấu trúc phổi ."}],"explanation":"Bệnh cấu trúc phổi (như giãn phế quản, BPTNMT nặng, xơ nang) là yếu tố nguy cơ quan trọng hàng đầu dẫn đến nhiễm và cư trú P. aeruginosa kháng thuốc ở bệnh nhân viêm phổi. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài VPCĐ do vi khuẩn kháng thuốc)."},{"number":26,"answer":"C","question":"Khi sử dụng CRB-65 để phân tầng nguy cơ viêm phổi cộng đồng, bao nhiêu điểm thì phân loại mức độ nguy cơ nặng:","options":[{"label":"A","text":"1 ."},{"label":"B","text":"2 ."},{"label":"C","text":"3 ."},{"label":"D","text":"4 ."}],"explanation":"Thang điểm CRB-65 (Confusion, Respiratory rate >= 30, Blood pressure < 90/60, Age >= 65): 0 điểm: nguy cơ nhẹ (ngoại trú); 1-2 điểm: nguy cơ trung bình (xem xét nhập viện); 3-4 điểm: nguy cơ nặng (nhập viện điều trị tích cực). (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi cộng đồng, trang 106)."},{"number":27,"answer":"D","question":"Về tiêu chuẩn phân loại mức độ viêm phổi cộng đồng (theo ATS). CHỌN CÂU SAI:","options":[{"label":"A","text":"Nhịp thở ≥30 lần/min ."},{"label":"B","text":"Lú lẫn/mất phương hướng ."},{"label":"C","text":"BUN≥20 mg/dL ."},{"label":"D","text":"Tỉ số PaO2/FiO2≤200 ."}],"explanation":"Theo tiêu chuẩn phụ của ATS/IDSA đánh giá VPCĐ nặng: ngưỡng PaO2/FiO2 là <= 250 mmHg (chứ không phải <= 200). Các tiêu chuẩn phụ khác gồm nhịp thở >= 30, lú lẫn, BUN >= 20 mg/dL (7.1 mmol/L). (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi cộng đồng, trang 107-108)."},{"number":28,"answer":"A","question":"Bảng điểm PSI trong phân tầng nguy cơ viêm phổi cộng đồng, yếu tố “suy tim sung huyết” bao nhiêu điểm:","options":[{"label":"A","text":"10 điểm ."},{"label":"B","text":"15 điểm ."},{"label":"C","text":"20 điểm ."},{"label":"D","text":"30 điểm ."}],"explanation":"Trong thang điểm PSI (Pneumonia Severity Index của Fine): yếu tố bệnh đồng mắc Suy tim sung huyết (Congestive heart failure) được cộng 10 điểm. (Ung thư +30, Bệnh gan +20, Bệnh thận +10, Bệnh mạch máu nào +10). (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi cộng đồng, Bảng 5.4, trang 106)."},{"number":29,"answer":"C","question":"Tác nhân vi sinh không điển hình trong bệnh viêm phổi. CHỌN CÂU SAI:","options":[{"label":"A","text":"Mycoplasma pneumoniae ."},{"label":"B","text":"Chlamydia pneumoniae ."},{"label":"C","text":"Haemophilus influenzae ."},{"label":"D","text":"Legionella pneumophila ."}],"explanation":"Haemophilus influenzae là vi khuẩn Gram âm điển hình. Các tác nhân vi khuẩn không điển hình (atypical pathogens) thường gặp nhất gây viêm phổi bao gồm Mycoplasma pneumoniae, Chlamydia pneumoniae, và Legionella pneumophila. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi cộng đồng, trang 97)."},{"number":30,"answer":"D","question":"Các yếu tố nguy cơ nhiễm S. aureus kháng methicillin, chọn Câu sai:","options":[{"label":"A","text":"Viêm phổi nặng, bao gồm sốc nhiễm trùng và đòi hỏi thông khí cơ học ."},{"label":"B","text":"Viêm phổi hoại tử hoặc tạo hang và biến chứng mủ màng phổi ."},{"label":"C","text":"Sống trong môi trường đông đúc ."},{"label":"D","text":"Sau cảm cúm 1 tháng ."}],"explanation":"Yếu tố nguy cơ nhiễm CA-MRSA thường xuất hiện NGAY SAU hoặc trong đợt nhiễm virus cúm (trong vòng vài ngày đến 1-2 tuần, gọi là viêm phổi tụ cầu sau cúm), chứ không phải cách xa sau 1 tháng. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài VPCĐ do vi khuẩn kháng thuốc)."},{"number":31,"answer":"C","question":"Chọn đáp án đúng: “ Viêm phổi là tình trạng ..(1).. của ..(2).. bao gồm viêm phế nang, ống và túi phế nang, tiểu phế quản tận hoặc viêm tổ chức kẽ của phổi.","options":[{"label":"A","text":"(1) viêm, (2) cấu trúc phổi ."},{"label":"B","text":"(1) nhiễm trùng, (2) cấu trúc phổi ."},{"label":"C","text":"(1) viêm, (2) nhu mô phổi ."},{"label":"D","text":"(1) nhiễm trùng, (2) nhu mô phổi ."}],"explanation":"Định nghĩa chuẩn trong giáo trình: 'Viêm phổi là tình trạng (1) viêm của (2) nhu mô phổi bao gồm viêm phế nang, ống và túi phế nang, tiểu phế quản tận hoặc viêm tổ chức kẽ của phổi.' (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi cộng đồng, trang 95, 129)."},{"number":32,"answer":"B","question":"Chọn 1 Câu đúng trong những Câu trả lời sau đây: Thuật ngữ điều trị kháng sinh kinh nghiệm dùng để chỉ:","options":[{"label":"A","text":"Điều trị kháng sinh theo kinh nghiệm của thầy thuốc lâm sàng ."},{"label":"B","text":"Điều trị kháng sinh theo khuyến cáo dựa trên bằng chứng y học ."},{"label":"C","text":"Điều trị kháng sinh không dựa trên xét nghiệm vi sinh ."},{"label":"D","text":"Điều trị kháng sinh dựa trên vi khuẩn gây bệnh phổ biến tại địa phương ."}],"explanation":"Điều trị kháng sinh kinh nghiệm (empirical antibiotic therapy) trong y học hiện đại không phải là cảm tính cá nhân mà là điều trị theo các khuyến cáo hướng dẫn lâm sàng chuẩn dựa trên bằng chứng y học và dịch tễ vi sinh. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài VPCĐ do vi khuẩn kháng thuốc, trang 143)."},{"number":33,"answer":"C","question":"Chọn một Câu sai trong những Câu trả lời sau đây: Phác đồ điều trị kháng sinh kinh nghiệm","options":[{"label":"A","text":"Cần dựa trên mức độ nặng của bệnh ."},{"label":"B","text":"Cần xem xét các yếu tố nguy cơ nhiễm vi khuẩn kháng thuốc ."},{"label":"C","text":"Phải thay đổi ngay khi có kết quả cấy vi khuẩn ."},{"label":"D","text":"Có thể điều chỉnh sau 48-72 giờ đánh giá đáp ứng lâm sàng ."}],"explanation":"Khi có kết quả cấy vi khuẩn, việc thay đổi kháng sinh phải dựa trên sự phù hợp với diễn tiến lâm sàng (nếu lâm sàng đang đáp ứng tốt thì không bắt buộc phải đổi ngay lập tức chỉ vì kháng sinh đồ ngoại trừ trường hợp xuống thang hoặc kháng thuốc rõ rệt). (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi cộng đồng & VPBV)."},{"number":34,"answer":"B","question":"Theo Bộ Y Tế Việt Nam 2024, liều Ertapenem được khuyến cáo sử dụng trong điều trị viêm phổi cộng đồng là:","options":[{"label":"A","text":"2g TMC/8h ."},{"label":"B","text":"1g TTM/ngày ."},{"label":"C","text":"400mg TTM/8h ."},{"label":"D","text":"500mg TM/12h ."}],"explanation":"Ertapenem là Carbapenem có thời gian bán thải kéo dài, liều khuyến cáo điều trị VPCĐ nhóm nguy cơ nhiễm vi khuẩn Gram âm sinh ESBL là 1g truyền tĩnh mạch (TTM) 1 lần mỗi ngày. (Nguồn tham khảo: Hướng dẫn sử dụng kháng sinh - Bộ Y tế & Giáo trình Hô hấp Cần Thơ)."},{"number":35,"answer":"B","question":"Bệnh nhân viêm phổi cộng đồng dị ứng với kháng sinh betalactam, sự lựa chọn kháng sinh thay thế được ATS khuyến cáo là:","options":[{"label":"A","text":"Aztreonam ."},{"label":"B","text":"Fluoroquinolone ."},{"label":"C","text":"Aminoglycosid ."},{"label":"D","text":"Cephalosporin ."}],"explanation":"Đối với bệnh nhân VPCĐ có tiền sử dị ứng severe với Beta-lactam, Fluoroquinolone hô hấp (Levofloxacin 750mg hoặc Moxifloxacin 400mg) là lựa chọn đơn trị liệu hàng đầu được ATS/IDSA khuyến cáo. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi cộng đồng, trang 111-112)."},{"number":36,"answer":"A","question":"Khuyến cáo điều trị viêm phổi cộng đồng ngoại trú đối với bệnh nhân khỏe mạnh và không dùng kháng sinh gần đây (bằng chứng 1):","options":[{"label":"A","text":"Betalactam ."},{"label":"B","text":"Fluoroquinolon ."},{"label":"C","text":"Macrolid ."},{"label":"D","text":"Doxycyclin ."}],"explanation":"Theo hướng dẫn cập nhật của Bộ Y tế và ATS, đối với VPCĐ ngoại trú ở bệnh nhân khỏe mạnh không có yếu tố nguy cơ vi khuẩn kháng thuốc, Amoxicillin liều cao (Betalactam) là ưu tiên lựa chọn hàng đầu (bằng chứng 1) thay vì Macrolide đơn trị liệu do tỷ lệ phế cầu kháng Macrolide cao. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, trang 110)."},{"number":37,"answer":"D","question":"Thời gian điều trị < 7 ngày được khuyến cáo cho các trường hợp. NGOẠI TRỪ:","options":[{"label":"A","text":"Viêm phổi không biến chứng có đáp ứng lâm sàng tốt ."},{"label":"B","text":"Viêm phổi không có bằng chứng do các trực khuẩn Gram (-) không lên men ."},{"label":"C","text":"Viêm phổi do phế cầu ."},{"label":"D","text":"Viêm phổi do Staphylococcus aureus ."}],"explanation":"Viêm phổi do Staphylococcus aureus (đặc biệt là MRSA) hoặc trực khuẩn Gram âm không lên men (P. aeruginosa) cần thời gian điều trị kháng sinh kéo dài hơn (tối thiểu 14 ngày hoặc 14-21 ngày) do nguy cơ hoại tử nhu mô, tạo áp-xe và tái phát cao. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi cộng đồng)."},{"number":38,"answer":"B","question":"Bệnh nhân viêm phổi cộng đồng điều trị ngoại trú, sau bao lâu cần đánh giá lại đáp ứng lâm sàng:","options":[{"label":"A","text":"24 giờ ."},{"label":"B","text":"48-72 giờ ."},{"label":"C","text":"5 ngày ."},{"label":"D","text":"7 ngày ."}],"explanation":"Thời gian chuẩn để đánh giá đáp ứng lâm sàng của liệu pháp kháng sinh kinh nghiệm trong viêm phổi (cả ngoại trú và nội trú) là 48 đến 72 giờ. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi cộng đồng, trang 112)."},{"number":39,"answer":"D","question":"Thời gian điều trị kháng sinh đối với viêm phổi cộng đồng có tràn mủ màng phổi là:","options":[{"label":"A","text":"7-10 ngày ."},{"label":"B","text":"14-21 ngày ."},{"label":"C","text":"2-4 tuần ."},{"label":"D","text":"4-6 tuần ."}],"explanation":"Viêm mủ màng phổi hoặc viêm phổi biến chứng mủ màng phổi đòi hỏi thời gian điều trị kháng sinh kéo dài từ 4 đến 6 tuần kết hợp với dẫn lưu khoang màng phổi triệt để. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn dịch màng phổi, trang 207)."},{"number":40,"answer":"A","question":"Chỉ định sử dụng corticoid trong viêm phổi là:","options":[{"label":"A","text":"Sốc nhiễm trùng ."},{"label":"B","text":"Suy giảm miễn dịch ."},{"label":"C","text":"Nhập viện nhiều lần ."},{"label":"D","text":"Áp xe phổi ."}],"explanation":"Corticoid toàn thân (Hydrocortisone) trong viêm phổi nặng chỉ được cân nhắc chỉ định khi có biến chứng Sốc nhiễm trùng refractory (sốc nhiễm trùng không đáp ứng hoặc bù dịch và thuốc vận mạch liều cao). Viêm phổi cộng đồng)."},{"number":41,"answer":"B","question":"Về dịch tễ học viêm phổi bệnh viện, chọn Câu sai:","options":[{"label":"A","text":"Nhiễm trùng bệnh viện gây tử vong cao nhất và kéo dài thời gian nằm viện ."},{"label":"B","text":"Chiếm tỷ lệ khoảng 15% trong tổng số nhiễm trùng bệnh viện ."},{"label":"C","text":"Tỷ lệ mắc VAP cao hơn HAP ."},{"label":"D","text":"Tỷ lệ tử vong dao động từ 20-50% tùy thuộc tác nhân vi sinh ."}],"explanation":"Viêm phổi bệnh viện (HAP/VAP) là nhiễm trùng bệnh viện phổ biến hàng thứ 2 nhưng là nguyên nhân gây tử vong HÀNG ĐẦU trong các nhiễm trùng bệnh viện (chiếm khoảng 25% các ca nhiễm trùng tại ICU). Viêm phổi bệnh viện, trang 115)."},{"number":42,"answer":"C","question":"Trong viêm phổi nặng có nguy cơ nhiễm Pseudomonas spp thì Fluoroquinolone nào được khuyến cáo sử dụng phối hợp:","options":[{"label":"A","text":"Moxifloxacin ."},{"label":"B","text":"Levofloxacin ."},{"label":"C","text":"Ciprofloxacin ."},{"label":"D","text":"Sparfloxacin ."}],"explanation":"Ciprofloxacin (hoặc Levofloxacin liều cao 750mg) có hoạt tính chống Pseudomonas aeruginosa rất mạnh. Moxifloxacin KHÔNG có hoạt tính trên Pseudomonas aeruginosa. Ciprofloxacin là Antipseudomonal Fluoroquinolone điển hình. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi bệnh viện, trang 124)."},{"number":43,"answer":"D","question":"Các yếu tố nguy cơ viêm phổi bệnh viện, chọn Câu sai:","options":[{"label":"A","text":"Đặt nội khí quản hay ống thông dạ dày. ."},{"label":"B","text":"Suy đa cơ quan. ."},{"label":"C","text":"Suy giảm miễn dịch. ."},{"label":"D","text":"Sử dụng kháng sinh > 7 ngày. ."}],"explanation":"Tiền sử sử dụng kháng sinh trong vòng 90 ngày trước đó (hoặc > 48-72h trong đợt nằm viện) là yếu tố nguy cơ vi khuẩn đa kháng. Mốc 'sử dụng kháng sinh > 7 ngày' nêu riêng lẻ không đúng tiêu chuẩn quy ước yếu tố nguy cơ chung. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi bệnh viện)."},{"number":44,"answer":"D","question":"Đặt nội khí quản thở máy là yếu tố nguy cơ quan trọng nhất của viêm phổi bệnh viện vì gây, ngoại trừ:","options":[{"label":"A","text":"Trở ngại nuốt chất tiết ."},{"label":"B","text":"Nơi chứa vi khuẩn ."},{"label":"C","text":"Máy thở và dụng cụ bị nhiễm ."},{"label":"D","text":"Thay đổi pH dạ dày ."}],"explanation":"Đặt nội khí quản phá vỡ hàng rào bảo vệ tự nhiên đường hô hấp trên, làm đọng chất tiết hầu họng, tạo điều kiện cho vi khuẩn hình thành biofilm trên ống NKQ. Thay đổi pH dạ dày thường là do dùng thuốc kháng H2/PPI làm tăng sinh vi khuẩn dạ dày hít sặc chứ không phải do bản thân việc đặt ống NKQ trực tiếp gây ra. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi bệnh viện, trang 116)."},{"number":45,"answer":"B","question":"Về cơ chế bệnh sinh viêm phổi bệnh viện, chọn Câu sai:","options":[{"label":"A","text":"Bệnh nhân nằm viện có thể nhiễm khuẩn từ các dụng cụ hỗ trợ hô hấp thông qua nhân viên y tế. ."},{"label":"B","text":"Hệ thống làm ẩm và khí dung bị nhiễm khuẩn tạo điều kiện cho nhiễm khuẩn da, mô mềm. ."},{"label":"C","text":"Hệ thống nước bị ô nhiễm được ghi nhận là nguyên nhân gây nhiễm khuẩn bệnh viện do Legionella species. ."},{"label":"D","text":"Nhiễm nấm thường gặp khi sửa chữa bệnh viện, hệ thống cung cấp khí bị ô nhiễm và hệ thống lọc của phòng bệnh kém. ."}],"explanation":"Hệ thống làm ẩm và khí dung bị nhiễm khuẩn tạo điều kiện vi khuẩn đi trực tiếp vào đường hô hấp dưới gây VIÊM PHỔI BỆNH VIỆN, chứ không phải gây 'nhiễm khuẩn da, mô mềm'. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi bệnh viện, trang 116-117)."},{"number":46,"answer":"D","question":"Khi quyết định điều trị kháng sinh kinh nghiệm trong VPBV thì yếu tố nào là quan trọng nhất để đối phó với vi khuẩn kháng thuốc:","options":[{"label":"A","text":"Thời gian nằm trong bệnh viện (hay thở máy) ."},{"label":"B","text":"Kết quả nuôi cấy trước đó ."},{"label":"C","text":"Sử dụng kháng sinh trước đó ."},{"label":"D","text":"Tình trạng suy giảm miễn dịch và đặc điểm kháng thuốc thông thường của vi sinh gây bệnh tại cơ sở điều trị ."}],"explanation":"Đặc điểm dịch tễ vi sinh và biểu đồ kháng kháng sinh (antibiogram) tại chính cơ sở điều trị/khoa ICU kết hợp với yếu tố nguy cơ của bệnh nhân là căn cứ quan trọng nhất để xây dựng phác đồ kháng sinh kinh nghiệm hiệu quả. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi bệnh viện, trang 122-123)."},{"number":47,"answer":"D","question":"Về lâm sàng của viêm phổi bệnh viện, tính phổ biến của tác nhân vi sinh phụ thuộc vào các yếu tố, NGOẠI TRỪ:","options":[{"label":"A","text":"Tình trạng miễn dịch của người bệnh. ."},{"label":"B","text":"Thời gian khởi phát. ."},{"label":"C","text":"Các yếu tố nguy cơ nhiễm vi khuẩn đa kháng. ."},{"label":"D","text":"Các nguy cơ nhiễm khuẩn đặc biệt. ."}],"explanation":"Các yếu tố chính quyết định nhóm vi sinh gây VPBV bao gồm: thời gian khởi phát (sớm < 5 ngày vs muộn >= 5 ngày), tình trạng miễn dịch bệnh nhân, và có/không có các yếu tố nguy cơ vi khuẩn đa kháng (MDR). (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi bệnh viện, trang 117-118)."},{"number":48,"answer":"D","question":"Các yếu tố nguy cơ viêm phổi hít là, NGOẠI TRỪ:","options":[{"label":"A","text":"Đặt nội khí quản. ."},{"label":"B","text":"Dùng thuốc an thần liều cao. ."},{"label":"C","text":"Phẫu thuật ngực - bụng. ."},{"label":"D","text":"Thời gian điều trị nội trú kéo dài. ."}],"explanation":"Viêm phổi hít (aspiration pneumonia) xảy ra khi có rối loạn ý thức (thuốc an thần, hôn mê), can thiệp xâm lấn hầu họng (đặt NKQ, sonde dạ dày), phẫu thuật ngực-bụng. Thời gian nằm viện kéo dài là yếu tố nguy cơ của vi khuẩn đa kháng chứ không phải yếu tố nguy cơ hít sặc trực tiếp. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi bệnh viện & Áp-xe phổi)."},{"number":49,"answer":"D","question":"Vi khuẩn thường gặp trong viêm phổi thở máy xuất hiện muộn và kháng nhiều loại beta-lactam là:","options":[{"label":"A","text":"Staphylococcus aureus. ."},{"label":"B","text":"Streptococcus pneumoniae. ."},{"label":"C","text":"Pseudomonas aeruginosa. ."},{"label":"D","text":"Acinetobacter baumannii. ."}],"explanation":"Acinetobacter baumannii và Pseudomonas aeruginosa là hai tác nhân vi khuẩn Gram âm đa kháng hàng đầu gây VAP khởi phát muộn (>= 5 ngày), đặc biệt Acinetobacter baumannii có tỷ lệ kháng hầu hết các nhóm Beta-lactam bao gồm cả Carbapenem rất cao. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi bệnh viện, trang 118)."},{"number":50,"answer":"A","question":"Phương pháp cấy định lượng chất tiết đường hô hấp dưới qua kỹ thuật nội soi phế quản với chất tiết nội khí quản yêu cầu có ngưỡng vi khuẩn là:","options":[{"label":"A","text":">1×106 CFU/ml ."},{"label":"B","text":">1×105 CFU/ml ."},{"label":"C","text":">1×104 CFU/ml ."},{"label":"D","text":">1×103 CFU/ml ."}],"explanation":"Ngưỡng cấy định lượng chẩn đoán vi khuẩn gây bệnh: Dịch hút qua nội khí quản (ETA) >= 10^6 CFU/ml; Dịch rửa phế quản phế nang (BAL) >= 10^4 CFU/ml; Chải phế quản có bảo vệ (PSB) >= 10^3 CFU/ml. Viêm phổi bệnh viện, trang 121)."},{"number":51,"answer":"C","question":"Trong viêm phổi bệnh viện, nếu không có sẵn nội soi phế quản, có thể lấy mẫu bệnh phẩm không qua nội soi hoặc phân lập vi khuẩn từ:","options":[{"label":"A","text":"Cấy nước tiểu. ."},{"label":"B","text":"Cấy dịch não tủy. ."},{"label":"C","text":"Cấy máu. ."},{"label":"D","text":"Cấy dịch vết thương mô mềm. ."}],"explanation":"Cấy máu là xét nghiệm vi sinh quan trọng bắt buộc thực hiện khi nghi ngờ VPBV/VAP để phát hiện tình trạng nhiễm khuẩn huyết kèm theo và xác định chính xác tác nhân gây bệnh. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi bệnh viện, trang 121)."},{"number":52,"answer":"A","question":"Về hình ảnh học của HAP, hình ảnh tổn thương dạng nốt (kích thước từ vài mm đến vài cm), không đồng nhất, bờ mờ, không đều, có thể lan toả 2 bên kèm tràn dịch màng phổi, thường gặp do:","options":[{"label":"A","text":"Staphylococcus aureus. ."},{"label":"B","text":"Streptococcus pneumoniae. ."},{"label":"C","text":"Pseudomonas aeruginosa. ."},{"label":"D","text":"Acinetobacter baumannii. ."}],"explanation":"Hình ảnh tổn thương dạng nốt đa ổ, dễ hoại tử tạo bóng khí (pneumatoceles), hoại tử tạo hang và tràn dịch/tràn mủ màng phổi đi kèm đặc trưng cho nhiễm Tụ cầu vàng (Staphylococcus aureus). (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi cộng đồng & VPBV)."},{"number":53,"answer":"A","question":"Chẩn đoán Viêm phổi bệnh viện theo CDC, về triệu chứng hô hấp, chọn Câu sai:","options":[{"label":"A","text":"Xuất hiện kéo dài: đàm mủ, thay đổi màu đàm, tăng tiết đàm. ."},{"label":"B","text":"Mới xuất hiện hoặc xấu đi: ho, khó thở, nhịp tim nhanh. ."},{"label":"C","text":"Tiếng ran hoặc tiếng thở phế quản. ."},{"label":"D","text":"Tình trạng oxy máu xấu đi, PaO2/FiO2≤240, cần tăng oxy/cần thở máy. ."}],"explanation":"Theo tiêu chuẩn CDC chẩn đoán HAP, triệu chứng đờm mủ, thay đổi tính chất đờm là triệu chứng 'MỚI XUẤT HIỆN' (New onset) chứ không phải 'xuất hiện kéo dài'. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi bệnh viện, trang 119, 121)."},{"number":54,"answer":"B","question":"Bệnh nhân nam, 72 tuổi, vào viện vì liệt ½ người (T), sau điều trị 5 ngày bệnh nhân có biểu hiện nhiễm trùng hô hấp dưới (nhiệt độ 39C, đàm vàng, bạch cầu máu 14.500/mm3, PaO2/FiO2=300; Xquang ngực có thâm nhiễm lan tỏa 2 phổi) nghi ngờ viêm phổi bệnh viện, điểm CPIS của bệnh nhân là bao nhiêu:","options":[{"label":"A","text":"6 điểm ."},{"label":"B","text":"7 điểm ."},{"label":"C","text":"8 điểm ."},{"label":"D","text":"9 điểm ."}],"explanation":"Tính điểm CPIS (Clinical Pulmonary Infection Score): Nhiệt độ 39C (1 điểm), Bạch cầu 14.500 (1 điểm), Đờm mủ đục (2 điểm), PaO2/FiO2 = 300 (> 240, không có ARDS) (0 điểm), X-quang thâm nhiễm lan tỏa/khu trú (2 điểm), Cấy đờm chưa có (0-1 điểm). Tổng điểm CPIS = 6-7 điểm (>= 6 điểm ủng hộ chẩn đoán HAP/VAP). (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi bệnh viện, Bảng điểm CPIS)."},{"number":55,"answer":"B","question":"Bệnh nhân nam, 60 tuổi, vào viện vì gãy xương đùi sau tai nạn giao thông, được điều trị phẫu thuật. Sau 5 ngày điều trị, bệnh nhân tăng khó thở, thở 28 l/ph, thở khò khè, ho, đàm đục, sốt 38C, mất nước (+), mạch 110 l/ph, Xquang ngực: tổn thương thâm nhiễm 1/3 diện tích một trường phổi (P). Đánh giá mức độ nặng viêm phổi bệnh viện của bệnh nhân:","options":[{"label":"A","text":"Nhẹ ."},{"label":"B","text":"Trung bình ."},{"label":"C","text":"Nặng ."},{"label":"D","text":"Chưa đánh giá được vì thiếu tiêu chuẩn. ."}],"explanation":"Theo bảng phân loại mức độ nặng VPBV (Bảng 6.4): Nhẹ khi có >= 5 tiêu chuẩn nhẹ (thâm nhiễm < 1/3, nhiệt độ < 37.5, mạch < 100, nhịp thở < 20, BC < 10.000). Nặng khi có >= 5 tiêu chuẩn nặng (thâm nhiễm > 2/3, sốt > 38.5, mạch >= 120, thở >= 30, BC >= 20.000). Bệnh nhân này nằm ở khoảng giữa -> xếp mức độ Trung bình. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi bệnh viện, Bảng 6.4, trang 123)."},{"number":56,"answer":"B","question":"Bệnh nhân nữ, 65 tuổi, vào viện vì đau ngực, được chẩn đoán nhồi máu cơ tim cấp. Sau 3 ngày điều trị, bệnh nhân tăng khó thở, thở khò khè, ho, đàm đục. Nên ưu tiên làm cận lâm sàng gì cho bệnh nhân:","options":[{"label":"A","text":"Xét nghiệm lại Troponin Ths ."},{"label":"B","text":"Chụp Xquang ngực thẳng. ."},{"label":"C","text":"Xét nghiệm công thức máu, CRP, PCT. ."},{"label":"D","text":"Chụp CT scan ngực (có cản quang). ."}],"explanation":"Khi bệnh nhân đang nằm viện xuất hiện triệu chứng nhiễm trùng hô hấp mới (ho, đờm đục, khó thở), cận lâm sàng hình ảnh học ban đầu bắt buộc ưu tiên hàng đầu là Chụp X-quang ngực thẳng tại giường để tìm tổn thương thâm nhiễm mới. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi bệnh viện, trang 120)."},{"number":57,"answer":"B","question":"Nguyên tắc điều trị viêm phổi bệnh viện, chọn Câu sai:","options":[{"label":"A","text":"Sử dụng kháng sinh khởi đầu sớm, phổ rộng, theo tình trạng của bệnh nhân. ."},{"label":"B","text":"Sử dụng kháng sinh theo kháng sinh đồ hoặc theo tác nhân nghi ngờ. ."},{"label":"C","text":"Liệu pháp kháng sinh cần được đánh giá mỗi 48-72 giờ điều trị. ."},{"label":"D","text":"Cần xem xét các nguyên nhân khác hoặc biến chứng nếu lâm sàng không cải thiện. ."}],"explanation":"Phát biểu B nêu 'Sử dụng kháng sinh theo kháng sinh đồ' ở giai đoạn khởi đầu là chưa đúng thực tế, vì khi mới chẩn đoán phải dùng kháng sinh KINH NGHIỆM ngay lập tức chứ không thể chờ kết quả cấy và kháng sinh đồ (thường mất 48-72h). (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi bệnh viện, trang 122)."},{"number":58,"answer":"A","question":"Bệnh nhân nam, 67 tuổi, vào viện đợt cấp COPD, sau thở máy 3 ngày bệnh nhân có biểu hiện tăng nhiệt độ 39C, đàm đục, thở 28 l/ph, mạch 110 l/ph, bạch cầu máu 15.000/mm3, CRP=15 mg/dl, SpO2=88% (FiO2: 40%), Xquang ngực có thâm nhiễm khu trú đáy phổi (P). Điều trị kháng sinh kinh nghiệm cho bệnh nhân:","options":[{"label":"A","text":"Ceftazidime 2g IV q8h + Amikacin 15-20 mg/kg IV ."},{"label":"B","text":"Amikacin 15-20 mg/kg IV + Vancomycin 15mg/kg IV q8-12h ."},{"label":"C","text":"Gentamicin 5-7 mg/kg IV + Linezolid 600mg IV q12h ."},{"label":"D","text":"Ceftriaxone 2g IV q24h + Linezolid 600mg IV q12h ."}],"explanation":"Bệnh nhân bị VAP/HAP khởi phát trên nền COPD thở máy có nguy cơ cao nhiễm Pseudomonas aeruginosa và vi khuẩn Gram âm đa kháng. Cần dùng kháng sinh chống Pseudomonas (Ceftazidime 2g q8h) phối hợp với Aminoglycoside (Amikacin) để diệt khuẩn hiệp đồng. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi bệnh viện, Bảng 6.5, trang 124)."},{"number":59,"answer":"D","question":"Khuyến cáo kháng sinh kinh nghiệm cho VAP, chọn Câu sai:","options":[{"label":"A","text":"Kháng sinh bao phủ S. aureus, P. aeruginosa và trực khuẩn gram âm. ."},{"label":"B","text":"Phối hợp 2 kháng sinh diệt P. aeruginosa nếu khoa điều trị có tỷ lệ P. aeruginosa kháng thuốc >10%. ."},{"label":"C","text":"Phối hợp 1 kháng sinh diệt MRSA nếu tỷ lệ MRSA tại khoa >10-20%. ."},{"label":"D","text":"Luôn sử dụng Vancomycin cho tất cả các trường hợp VAP. ."}],"explanation":"Vancomycin hoặc Linezolid chỉ được chỉ định khi bệnh nhân có yếu tố nguy cơ nhiễm MRSA hoặc tại khoa điều trị có tỷ lệ MRSA > 10-20%, chứ không phải 'luôn sử dụng cho tất cả các trường hợp VAP'. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi bệnh viện, trang 124)."},{"number":60,"answer":"C","question":"Về kháng sinh kinh nghiệm trong viêm phổi bệnh viện theo phân nhóm: VP khởi phát muộn hoặc có yếu tố nguy cơ đa kháng, bất kỳ mức độ nặng, kháng sinh khuyến cáo ưu tiên là:","options":[{"label":"A","text":"Ceftazidim + Ciprofloxacin + Linezolid/Vancomycin ."},{"label":"B","text":"Imipenem + Ciprofloxacin + Linezolid/Vancomycin ."},{"label":"C","text":"Meropenem + Ciprofloxacin + Linezolid/Vancomycin ."},{"label":"D","text":"Imipenem + Levofloxacin + Linezolid/Vancomycin ."}],"explanation":"Phác đồ 3 thuốc ưu tiên cho VPBV khởi phát muộn/nguy cơ vi khuẩn đa kháng nặng bao gồm: 1 Antipseudomonal Beta-lactam/Carbapenem (Meropenem hoặc Imipenem) + 1 Antipseudomonal Fluoroquinolone (Ciprofloxacin/Levofloxacin) + 1 thuốc chống MRSA (Linezolid hoặc Vancomycin). (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Viêm phổi bệnh viện, trang 124)."},{"number":61,"answer":"B","question":"Nguy cơ tràn khí màng phổi tăng đáng kể khi:","options":[{"label":"A","text":"Béo phì ."},{"label":"B","text":"Hút thuốc lá ."},{"label":"C","text":"Ăn mặn ."},{"label":"D","text":"Giới tính nữ ."}],"explanation":"Hút thuốc lá làm tăng nguy cơ tràn khí màng phổi tự phát nguyên phát lên gấp khoảng 22 lần ở nam giới và 9 lần ở nữ giới do gây viêm đường thở nhỏ và vỡ bóng khí dưới màng phổi. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn khí màng phổi, trang 214, 218)."},{"number":62,"answer":"B","question":"Bệnh nhân tràn khí màng phổi/COPD thuộc phân loại tràn khí màng phổi nào:","options":[{"label":"A","text":"Tràn khí màng phổi tự phát nguyên phát ."},{"label":"B","text":"Tràn khí màng phổi tự phát thứ phát ."},{"label":"C","text":"Tràn khí màng phổi do cơ học ."},{"label":"D","text":"Tràn khí màng phổi do chấn thương ."}],"explanation":"Tràn khí màng phổi tự phát thứ phát (Secondary spontaneous pneumothorax - SSP) xuất hiện như một biến chứng ở người bệnh đã có sẵn bệnh lý nhu mô phổi tiềm ẩn (như COPD, lao phổi, giãn phế quản, xơ phổi). (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn khí màng phổi, trang 214)."},{"number":63,"answer":"B","question":"Về cơ chế bệnh sinh TKMP, cơ chế đề xuất vỡ phế nang tự phát gây tràn khí màng phổi là:","options":[{"label":"A","text":"Áp suất trong bao phế quản mạch máu liền kề vẫn cao hơn so với trong phế nang căng phồng quá mức. ."},{"label":"B","text":"Áp suất trong bao phế quản mạch máu liền kề vẫn thấp hơn so với trong phế nang căng phồng quá mức. ."},{"label":"C","text":"Áp suất trong bao phế quản mạch máu liền kề bằng với trong phế nang căng phồng quá mức. ."},{"label":"D","text":"Không liên quan về áp suất trong bao phế quản mạch máu và phế nang căng phồng quá mức. ."}],"explanation":"Khi phế nang bị căng phồng quá mức, áp suất trong lòng phế nang cao hơn áp suất trong bao phế quản mạch máu liền kề (vốn thấp hơn), tạo ra sự chênh lệch áp suất làm xé rách phế nang, khí thoát vào tổ chức kẽ và vỡ vào khoang màng phổi (hiệu ứng Macklin). (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn khí màng phổi, trang 217-218)."},{"number":64,"answer":"A","question":"Về lâm sàng tràn khí màng phổi, chọn câu sai:","options":[{"label":"A","text":"Bệnh khởi phát từ từ bằng đau ngực, tăng khi ho, hít sâu, có thể liên quan đến gắng sức ."},{"label":"B","text":"Khó thở thường xuất hiện sau đau ngực tuỳ theo tốc độ thành lập khoang khí. ."},{"label":"C","text":"Biểu hiện suy hô hấp mức độ từ nhẹ đến nặng, tụt huyết áp khi tràn khí màng phổi áp lực. ."},{"label":"D","text":"Tam chứng Galliard gồm giảm hay mất rung thanh, gõ vang, rì rào phế nang giảm hoặc mất. ."}],"explanation":"Triệu chứng đau ngực trong tràn khí màng phổi khởi phát ĐỘT NGỘT và dữ dội (đau xé ngực, như dao đâm) chứ không phải 'khởi phát từ từ'. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn khí màng phổi, trang 220)."},{"number":65,"answer":"A","question":"Khám thực thể bệnh nhân tràn khí màng phổi áp lực, chọn câu sai:","options":[{"label":"A","text":"Không có biểu hiện suy hô hấp mức độ từ nhẹ đến nặng do sự tích tụ dần không khí trong khoang màng phổi. ."},{"label":"B","text":"Ảnh hưởng đến cung lượng tim, gây hạ huyết áp và thiếu oxy đe dọa tính mạng. ."},{"label":"C","text":"Bệnh nhân không có tiếng thở ở vùng bị ảnh hưởng, lệch khí quản sang một bên, nhịp tim nhanh và căng giãn tĩnh mạch. ."},{"label":"D","text":"Bệnh nhân có thể ở tình trạng trụy mạch, ngừng tim, nếu không được cấp cứu kịp thời bệnh nhân có thể tử vong nhanh chóng. ."}],"explanation":"Tràn khí màng phổi áp lực (Tension pneumothorax) gây suy hô hấp và suy tuần hoàn CẤP TÍNH RẤT NẶNG đe dọa tính mạng người bệnh. Phát biểu 'Không có biểu hiện suy hô hấp' là hoàn toàn sai. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn khí màng phổi, trang 221)."},{"number":66,"answer":"A","question":"Thường khám được tam chứng Galliard trong tràn khí màng phổi nếu (...). Điền vào chỗ trống:","options":[{"label":"A","text":"> 15% diện tích ở 1 bên phổi bị xẹp. ."},{"label":"B","text":"> 20% diện tích ở 1 bên phổi bị xẹp. ."},{"label":"C","text":"> 25% diện tích ở 1 bên phổi bị xẹp. ."},{"label":"D","text":"> 30% diện tích ở 1 bên phổi bị xẹp. ."}],"explanation":"Khám lâm sàng phát hiện rõ tam chứng Galliard (gõ vang, rung thanh giảm/mất, rì rào phế nang giảm/mất) khi thể tích khí gây xẹp phổi > 15% diện tích thể tích một bên phổi. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn khí màng phổi, trang 220)."},{"number":67,"answer":"A","question":"Đặc điểm hình ảnh Xquang ngực của tràn khí màng phổi, chọn câu sai:","options":[{"label":"A","text":"Không phụ thuộc mức độ tràn khí màng phổi nhiều hay ít mà trên phim X-quang ngực có thể thấy phổi bên bệnh bị xẹp nhiều hay ít. ."},{"label":"B","text":"Đối với những trường hợp nghi ngờ tràn khí màng phổi nhưng trên phim thẳng không phát hiện được thì tiến hành chụp phim phổi nghiêng. ."},{"label":"C","text":"Trường hợp tràn khí màng phổi nhiều, nhu mô phổi co cụm lại về phía rốn phổi bên tràn khí. ."},{"label":"D","text":"Hình ảnh phổi tăng sáng, không có hình ảnh mạch máu, ở vùng ngoài thành ngực có thể thấy rõ bờ màng phổi tạng. ."}],"explanation":"Mức độ xẹp nhu mô phổi trên X-quang ngực PHỤ THUỘC TRỰC TIẾP vào thể tích/lượng khí tràn trong khoang màng phổi nhiều hay ít. Do đó phát biểu 'Không phụ thuộc...' là sai. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn khí màng phổi, trang 221-222)."},{"number":68,"answer":"A","question":"Đặc điểm hình ảnh Xquang ngực điển hình của tràn khí màng phổi, chọn câu sai:","options":[{"label":"A","text":"Hội chứng khí phế thũng ."},{"label":"B","text":"Không có hình ảnh mạch máu ."},{"label":"C","text":"Thấy rõ bờ màng phổi tạng ."},{"label":"D","text":"Nhu mô phổi thu nhỏ về rốn phổi ."}],"explanation":"Hình ảnh X-quang điển hình của tràn khí màng phổi là khoảng tăng sáng vô mạch ở ngoại vi và đường màng phổi tạng mảnh phân tách nhu mô phổi bị co cụm về rốn phổi. 'Hội chứng khí phế thũng' là tổn thương căng phồng phế nang mạn tính trong nhu mô phổi, không phải hình ảnh tràn khí màng phổi tự do. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn khí màng phổi, trang 221-222)."},{"number":69,"answer":"D","question":"Hình ảnh tràn khí màng phổi khu trú trên Xquang ngực cần phân biệt với:","options":[{"label":"A","text":"Khí phế thũng toàn thể ."},{"label":"B","text":"Áp xe phổi giai đoạn nung mủ hở ."},{"label":"C","text":"Hang lao ."},{"label":"D","text":"Kén phổi ."}],"explanation":"Tràn khí màng phổi khu trú dễ bị chẩn đoán nhầm lẫn trên X-quang với Kén khí phổi (bóng khí phế thũng thành mỏng dưới màng phổi hoặc kén phổi bẩm sinh/mắc phải). (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn khí màng phổi, trang 222)."},{"number":70,"answer":"A","question":"Đặc điểm hình ảnh Xquang ngực của tràn khí màng phổi áp lực, chọn câu sai:","options":[{"label":"A","text":"Khoang gian sườn hẹp ."},{"label":"B","text":"Xương sườn nằm ngang ."},{"label":"C","text":"Trung thất bị đẩy lệch sang bên đối diện ."},{"label":"D","text":"Cơ hoành bị đẩy xuống thấp ."}],"explanation":"Tràn khí màng phổi áp lực làm gia tăng áp lực cực lớn trong nửa lồng ngực bị ảnh hưởng, gây dãn rộng khoang gian sườn (chứ không phải 'hẹp'), xương sườn nằm ngang, cơ hoành bị đẩy xuống thấp và đẩy lệch trung thất sang bên đối diện. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn khí màng phổi, trang 221-223)."},{"number":71,"answer":"B","question":"Nếu nghi ngờ bệnh nhân có bóng khí hoặc u nang, phân biệt với tràn khí màng phổi có dính màng phổi nên làm gì:","options":[{"label":"A","text":"Chụp Xquang ngực nghiêng ."},{"label":"B","text":"Chụp CT scan ngực ."},{"label":"C","text":"Siêu âm màng phổi ."},{"label":"D","text":"Đo chức năng hô hấp ."}],"explanation":"Chụp cắt lớp vi tính (CT scan) lồng ngực là phương tiện chẩn đoán hình ảnh tiêu chuẩn vàng giúp phân biệt chính xác giữa tràn khí màng phổi khu trú với bóng khí (bullae) hoặc kén phổi thành mỏng. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn khí màng phổi, trang 222, 223)."},{"number":72,"answer":"B","question":"Tràn dịch màng phổi có thể xảy ra đồng thời với tràn khí màng phổi (..1... các trường hợp tràn khí màng phổi tự phát). Điền vào chỗ trống (1):","options":[{"label":"A","text":"10% đến 15% ."},{"label":"B","text":"20% đến 25% ."},{"label":"C","text":"30% đến 35% ."},{"label":"D","text":"40% đến 45% ."}],"explanation":"Tràn dịch màng phổi phản ứng phối hợp xuất hiện trong khoảng 20% đến 25% các trường hợp tràn khí màng phổi tự phát. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn khí màng phổi, trang 220, 229)."},{"number":73,"answer":"B","question":"Tràn máu màng phổi có thể xảy ra đồng thời với tràn khí màng phổi (..2... các trường hợp tràn khí màng phổi tự phát). Điền vào chỗ trống (2):","options":[{"label":"A","text":"1% đến 3% ."},{"label":"B","text":"2% đến 3% ."},{"label":"C","text":"2% đến 2.5% ."},{"label":"D","text":"1% đến 1.5% ."}],"explanation":"Tràn máu - tràn khí màng phổi tự phát phối hợp (spontaneous hemopneumothorax) xảy ra ở khoảng 2% đến 3% các trường hợp tràn khí màng phổi tự phát do rách dây dính hoặc đứt mạch máu màng phổi. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn khí màng phổi, trang 220, 229)."},{"number":74,"answer":"B","question":"Theo BTS, trên Xquang ngực, tràn khí màng phổi tự phát lượng ít khi đường kính khoang khí bao nhiêu:","options":[{"label":"A","text":"< 1cm ."},{"label":"B","text":"< 2cm ."},{"label":"C","text":"< 3cm ."},{"label":"D","text":"< 4cm ."}],"explanation":"Theo hướng dẫn của Hiệp hội Lồng ngực Anh (BTS), tràn khí màng phổi được phân loại: Lượng ít khi khoảng cách từ bờ màng phổi tạng đến thành ngực tại ngang mức rốn phổi < 2 cm; Lượng nhiều khi khoảng cách >= 2 cm. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn khí màng phổi, trang 222, 312)."},{"number":75,"answer":"A","question":"Chẩn đoán phân biệt giữa tràn khí màng phổi khu trú và hang trong nhu mô phổi ở vùng tiếp giáp lồng ngực dựa vào: (1) Dấu hiệu J.Rémy (2) Góc Bernou","options":[{"label":"A","text":"(1) đúng, (2) đúng ."},{"label":"B","text":"(1) đúng, (2) sai ."},{"label":"C","text":"(1) sai, (2) đúng ."},{"label":"D","text":"(1) sai, (2) sai ."}],"explanation":"Dấu hiệu J.Rémy và dấu hiệu góc Bernou (góc tiếp xúc giữa khối/nang với thành ngực: góc tù chỉ tổn thương ngoài nhu mô/màng phổi, góc nhọn chỉ tổn thương trong nhu mô) được sử dụng trên chẩn đoán hình ảnh để phân biệt tổn thương thuộc màng phổi vs nhu mô phổi. Cả (1) và (2) đều đúng. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn khí màng phổi)."},{"number":76,"answer":"C","question":"Độ nhạy của siêu âm phổi trong phát hiện tràn khí màng phổi là:","options":[{"label":"A","text":"từ 70% đến 90% ."},{"label":"B","text":"từ 98% đến 99% ."},{"label":"C","text":"từ 79% đến 95% ."},{"label":"D","text":"từ 99% me đến 100% ."}],"explanation":"Nhiều nghiên cứu ghi nhận siêu âm màng phổi tại giường có độ nhạy dao động từ 79% đến 95% (cao hơn hẳn so với X-quang tư thế nằm) và độ đặc hiệu lên đến 98-100% trong phát hiện tràn khí màng phổi cấp. Tràn khí màng phổi, trang 224-225)."},{"number":77,"answer":"A","question":"Ưu điểm của siêu âm màng phổi trong tràn khí màng phổi (TKMP), chọn câu sai:","options":[{"label":"A","text":"Rẻ hơn Xquang ngực ."},{"label":"B","text":"Giúp chẩn đoán TKMP ẩn ."},{"label":"C","text":"Kích thước máy nhỏ, có tính di động ."},{"label":"D","text":"Thực hiện tại giường ."}],"explanation":"Ưu điểm chính của siêu âm phổi là: thực hiện nhanh tại giường, không ăn tia xạ, tính di động cao, độ nhạy cao giúp phát hiện tràn khí màng phổi ẩn (occult pneumothorax). Mệnh đề 'Rẻ hơn X-quang ngực' không phải là ưu điểm chính được nhấn mạnh về mặt y khoa so với phim X-quang thường quy. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn khí màng phổi, trang 224-225)."},{"number":78,"answer":"A","question":"Điều trị bảo tồn nội khoa và theo dõi nội viện, chụp kiểm tra Xquang ngực thẳng mỗi ngày là hướng xử trí ở bệnh nhân tràn khí màng phổi như thế nào, chọn câu sai:","options":[{"label":"A","text":"TKMP lượng nhiều ."},{"label":"B","text":"Bệnh nhân không khó thở ."},{"label":"C","text":"Bệnh nhân huyết động ổn định ."},{"label":"D","text":"Kích thước khoang TKMP không tăng lên sau 6-8 giờ ."}],"explanation":"Điều trị bảo tồn theo dõi chỉ áp dụng cho bệnh nhân tràn khí màng phổi LƯỢNG ÍT, không khó thở, huyết động ổn định. Bệnh nhân tràn khí màng phổi lượng nhiều bắt buộc phải chọc hút hoặc đặt ống dẫn lưu màng phổi chứ không điều trị bảo tồn thuần túy. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn khí màng phổi, trang 228)."},{"number":79,"answer":"B","question":"Với tràn khí màng phổi không biến chứng thì mỗi ngày màng phổi hấp thu được bao nhiêu thể tích khí:","options":[{"label":"A","text":"< 5% ."},{"label":"B","text":"1% ."},{"label":"C","text":"1%-3% ."},{"label":"D","text":"3%-5% ."}],"explanation":"Trong điều trị bảo tồn tràn khí màng phổi không biến chứng, tốc độ tự tái hấp thu khí của khoang màng phổi đạt trung bình khoảng 1% đến 1.25% thể tích khí mỗi ngày (có thể tăng lên khi thở oxy nồng độ cao). (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn khí màng phổi, trang 228)."},{"number":80,"answer":"D","question":"Nếu hết tràn khí màng phổi thì sau bao lâu nên rút kim dẫn lưu khí:","options":[{"label":"A","text":"rút kim ngay ."},{"label":"B","text":"sau 6 giờ ."},{"label":"C","text":"sau 12 giờ ."},{"label":"D","text":"sau 24 giờ ."}],"explanation":"Khi phổi đã nở hoàn toàn và hết thoát bọt khí hoàn toàn, cần kẹp/lưu giữ ống/kim dẫn lưu thêm 24 giờ để theo dõi đánh giá tái phát trước khi rút ống an toàn. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn khí màng phổi, trang 229, 312)."},{"number":81,"answer":"B","question":"Nguyên nhân tràn dịch màng phổi dịch thấm, NGOẠI TRỪ:","options":[{"label":"A","text":"Suy tim sung huyết ."},{"label":"B","text":"Hội chứng tăng ure máu ."},{"label":"C","text":"Hội chứng thận hư ."},{"label":"D","text":"Tắc tĩnh mạch chủ trên ."}],"explanation":"Hội chứng tăng ure máu (Uremia) gây viêm màng phổi do ure huyết (Uremic pleuritis), kết quả phân tích dịch màng phổi là DỊCH TIẾT (Exudate). Suy tim, hội chứng thận hư, tắc tĩnh mạch chủ trên gây tràn dịch màng phổi DỊCH THẤM (Transudate). (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn dịch màng phổi, Bảng 10.1, trang 192-193)."},{"number":82,"answer":"C","question":"Tràn dịch màng phổi dịch tiết do nhiễm trùng chiếm khoảng:","options":[{"label":"A","text":"2-35% ."},{"label":"B","text":"10-50% ."},{"label":"C","text":"36-66% ."},{"label":"D","text":"4-20% ."}],"explanation":"Theo dịch tễ học, trong nhóm tràn dịch màng phổi dịch tiết, các nguyên nhân do nhiễm trùng (viêm phổi cận viêm, mủ màng phổi) chiếm tỷ lệ cao nhất, khoảng 36% đến 66%. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn dịch màng phổi, trang 192)."},{"number":83,"answer":"A","question":"Dịch màng phổi được thành lập từ các thay đổi sau, CHỌN CÂU SAI:","options":[{"label":"A","text":"Giảm dịch kẽ trong phổi: suy thất trái, viêm phổi và thuyên tắc phổi ."},{"label":"B","text":"Tăng áp lực thủy tĩnh mao mạch trong màng phổi: suy thất phải hoặc trái, hội chứng tĩnh mạch chủ trên ."},{"label":"C","text":"Tăng tính thấm của mao mạch màng phổi: viêm màng phổi ."},{"label":"D","text":"Giảm áp lực trong khoang màng phổi: xẹp phổi hoặc tăng độ đàn hồi của phổi ."}],"explanation":"Tràn dịch màng phổi hình thành khi TĂNG dịch kẽ trong phổi (thoát dịch vào khoang màng phổi trong suy thất trái, viêm phổi, thuyên tắc phổi) chứ không phải 'giảm'. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn dịch màng phổi, trang 192)."},{"number":84,"answer":"D","question":"Ung thư màng phổi nguyên phát (Mésotheliome):","options":[{"label":"A","text":"Ít gặp hơn do di căn. ."},{"label":"B","text":"Thường gặp ở dạng mảng, u hơn là dạng tràn dịch. ."},{"label":"C","text":"Liên quan trực tiếp đến Amiante. ."},{"label":"D","text":"A và C đúng. ."}],"explanation":"Ung thư trung biểu mô màng phổi nguyên phát (Mesothelioma) hiếm gặp hơn nhiều so với ung thư di căn màng phổi (A đúng) và có mối liên quan trực tiếp nguyên nhân với tiếp xúc sợi khoáng Asbestos/Amiăng (C đúng). Do đó A và C đúng. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn dịch màng phổi, trang 192, 210)."},{"number":85,"answer":"D","question":"Dịch màng phổi do Lao KHÔNG CÓ đặc điểm sau:","options":[{"label":"A","text":"Thường có màu vàng chanh hơn là mủ. ."},{"label":"B","text":"Tái lập nhanh do liên quan đến phản ứng miễn dịch quá đáng. ."},{"label":"C","text":"Dịch có thể hết cả khi không điều trị. ."},{"label":"D","text":"Rất giàu trực khuẩn lao trong dịch. ."}],"explanation":"Dịch màng phổi do Lao thường có màu vàng chanh, là phản ứng quá mẫn muộn type IV với tạng khuẩn lao nên số lượng vi khuẩn lao trong dịch màng phổi RẤT ÍT (soi AFB trực tiếp dịch màng phổi tỷ lệ dương tính < 10%). (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn dịch màng phổi, trang 202, 204)."},{"number":86,"answer":"D","question":"Để xác định tràn dịch màng phổi thể khu trú cần dựa vào:","options":[{"label":"A","text":"Tiền sử, bệnh sử ."},{"label":"B","text":"Triệu chứng cơ năng là chính ."},{"label":"C","text":"Triệu chứng thực thể là chính ."},{"label":"D","text":"Phim XQuang ngực ."}],"explanation":"Tràn dịch màng phổi khu trú (khu trú rãnh liên thùy, hoành, trung thất) khám thực thể rất khó phát hiện, chẩn đoán xác định bắt buộc dựa vào cận lâm sàng hình ảnh học như Phim X-quang ngực (thẳng, nghiêng), siêu âm hoặc CT scan ngực. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn dịch màng phổi, trang 195)."},{"number":87,"answer":"C","question":"Glucose trong dịch màng phổi rất thấp thường gặp trong:","options":[{"label":"A","text":"Ung thư màng phổi ."},{"label":"B","text":"Lao màng phổi ."},{"label":"C","text":"Viêm mủ màng phổi ."},{"label":"D","text":"Suy tim, suy thận ."}],"explanation":"Glucose dịch màng phổi giảm rất thấp (< 40 mg/dL hoặc < 2.2 mmol/L) phản ánh tình trạng chuyển hóa vi khuẩn và bạch cầu cực mạnh, thường gặp nhất trong Viêm mủ màng phổi (Empyema) và viêm màng phổi do Thấp khớp. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn dịch màng phổi, trang 199, 206)."},{"number":88,"answer":"A","question":"Về đặc điểm Xquang ngực thẳng trong tràn dịch màng phổi, chọn Câu sai:","options":[{"label":"A","text":"Hình ảnh mờ góc sườn hoành, đậm, không đồng nhất, có giới hạn trên là đường cong lõm, cao ở thành ngực và thấp dần khi đi vào trung thất. ."},{"label":"B","text":"Tràn dịch màng phổi lượng nhiều có thể làm di lệch vị trí trung thất sang đối diện. ."},{"label":"C","text":"Với bất kỳ một Xquang ngực bất thường, nên xem xét có tràn dịch màng phổi hay không. ."},{"label":"D","text":"Dịch màng phổi tự do trong khoang màng phổi phân bố theo chiều trọng lực: khi bệnh nhân ở tư thế đứng, thì dịch này đọng ở khe sườn hoành sau. ."}],"explanation":"Hình ảnh tràn dịch màng phổi tự do điển hình trên phim X-quang là hội chứng thế mờ ĐỒNG NHẤT (chứ không phải 'không đồng nhất'), làm tù góc sườn hoành, giới hạn trên là đường cong Damoiseau. Tràn dịch màng phổi, trang 194-195)."},{"number":89,"answer":"D","question":"Về đặc điểm siêu âm màng phổi trong tràn dịch màng phổi, chọn Câu sai:","options":[{"label":"A","text":"Giúp phát hiện tràn dịch khu trú, phân biệt tràn dịch với dày dính màng phổi và hướng dẫn chọc dò màng phổi trong những trường hợp khó. ."},{"label":"B","text":"Đo thể tích dịch màng phổi bằng siêu âm được cho là chính xác hơn phương pháp đo bằng X quang tư thế nằm. ."},{"label":"C","text":"Với siêu âm, thể tích dịch màng phổi được thấy là tương quan với độ tách biệt của 2 lá màng phổi. ."},{"label":"D","text":"Có thể ước tính lượng dịch có thể rút ra được bằng cách lấy khoảng cách lớn nhất giữa lá tạng và lá thành (đo ở mặt cắt ngang) nhân với 10. ."}],"explanation":"Công thức ước tính thể tích dịch màng phổi trên siêu âm (theo Balik): Thể tích dịch (mL) = Khoảng cách tách giữa 2 lá màng phổi (mm) x 20 (chứ không phải nhân 10). (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn dịch màng phổi, trang 195)."},{"number":90,"answer":"A","question":"Trong sơ đồ tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light, sau khi thực hiện chọc dịch màng phổi chẩn đoán thì kết luận dịch tiết khi đáp ứng tiêu chuẩn nào sau đây:","options":[{"label":"A","text":"Protein dịch màng phổi/huyết thanh > 0,5 ."},{"label":"B","text":"LDH dịch màng phổi /huyết thanh > 0,5 ."},{"label":"C","text":"LDH dịch màng phổi > 1/3 giới hạn bình thường trên của LDH huyết thanh ."},{"label":"D","text":"LDH dịch màng phổi > 400 UI/L giá trị bình thường của LDH huyết thanh ."}],"explanation":"Theo tiêu chuẩn Light, dịch màng phổi là DỊCH TIẾT khi thỏa ít nhất 1 trong 3 tiêu chuẩn: (1) Protein DMP/Protein huyết thanh > 0.5; (2) LDH DMP/LDH huyết thanh > 0.6; (3) LDH DMP > 2/3 giới hạn trên bình thường của LDH huyết thanh. Do đó câu A đúng. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn dịch màng phổi, Sơ đồ 10.1, trang 197, 201)."},{"number":91,"answer":"A","question":"Trong sơ đồ tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light, sau khi thực hiện chọc dịch màng phổi chẩn đoán với kết luận dịch tiết thì bác sĩ làm gì tiếp theo:","options":[{"label":"A","text":"Tiến hành các kỹ thuật chẩn đoán sâu hơn ."},{"label":"B","text":"Điều trị suy tim, xơ gan, bệnh thận ."},{"label":"C","text":"Không làm gì thêm để chẩn đoán ."},{"label":"D","text":"Nội soi màng phổi hoặc sinh thiết màng phổi ."}],"explanation":"Theo lưu đồ tiếp cận tiêu chuẩn Light (Sơ đồ 10.1): Sau khi xác định là Dịch tiết (Exudate), bước tiếp theo là tiến hành các xét nghiệm phân tích sâu hơn (định lượng Glucose, Amylase, tế bào học, công thức tế bào, cấy vi trùng, xét nghiệm tìm Lao). (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn dịch màng phổi, Sơ đồ 10.1, trang 201)."},{"number":92,"answer":"D","question":"Trong sơ đồ tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light, sau khi thực hiện chọc dịch màng phổi chẩn đoán với kết luận dịch tiết có tăng amylase thì bác sĩ cần xem xét các khả năng sau, NGOẠI TRỪ","options":[{"label":"A","text":"Rách thực quản ."},{"label":"B","text":"Tràn dịch màng phổi trong viêm tụy ."},{"label":"C","text":"Bệnh lý ác tính ."},{"label":"D","text":"Nhiễm vi khuẩn ."}],"explanation":"Tràn dịch màng phổi dịch tiết có TĂNG AMYLASE dịch màng phổi gợi ý 3 nguyên nhân chính: (1) Vỡ/rách thực quản (Amylase từ nước bọt), (2) Bệnh lý tuyến tụy (viêm tụy cấp/mạn, nang giả tụy), (3) Ung thư/bệnh lý ác tính. Nhiễm vi khuẩn thông thường không làm tăng Amylase. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn dịch màng phổi, Sơ đồ 10.1, trang 200, 201)."},{"number":93,"answer":"C","question":"Trong sơ đồ tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light, sau khi thực hiện chọc dịch màng phổi chẩn đoán với kết luận dịch tiết và tiến hành các kỹ thuật chẩn đoán sâu hơn nhưng bác sĩ vẫn không có chẩn đoán thì bác sĩ cần quyết định sao:","options":[{"label":"A","text":"Tiếp tục tiến hành các kỹ thuật chẩn đoán ."},{"label":"B","text":"Thực hiện chọc dịch màng phổi chẩn đoán lại ."},{"label":"C","text":"Xem xét thuyên tắc phổi ."},{"label":"D","text":"Xét nghiệm dịch màng phổi tìm lao ."}],"explanation":"Theo lưu đồ Light (Sơ đồ 10.1): Nếu dịch tiết đã làm các xét nghiệm chưa rõ nguyên nhân, bước tiếp theo quan trọng cần xem xét loại trừ là Thuyên tắc phổi (Chụp CT scanner mạch máu phổi xoắn ốc hoặc xạ hình tưới máu phổi). (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn dịch màng phổi, Sơ đồ 10.1, trang 201)."},{"number":94,"answer":"B","question":"Trong sơ đồ tiếp cận tràn dịch màng phổi (TDMP) theo tiêu chuẩn Light, sau khi theo dõi người bệnh không cải thiện triệu chứng TDMP thì bác sĩ cần làm gì tiếp theo:","options":[{"label":"A","text":"Tiếp tục tiến hành lại các kỹ thuật chẩn đoán TDMP ."},{"label":"B","text":"Xem xét soi màng phổi hoặc sinh thiết màng phổi ."},{"label":"C","text":"Xét nghiệm dịch màng phổi tìm lao ."},{"label":"D","text":"Điều trị thuyên tắc phổi ."}],"explanation":"Theo lưu đồ Light (Sơ đồ 10.1): Nếu sau các bước theo dõi mà triệu chứng tràn dịch màng phổi không cải thiện, chỉ định tiếp theo là Xem xét Nội soi màng phổi hoặc Sinh thiết màng phổi mở để tìm tổn thương mô bệnh học. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn dịch màng phổi, Sơ đồ 10.1, trang 201)."},{"number":95,"answer":"A","question":"Trong tràn dịch màng phổi, đặc điểm chẩn đoán tế bào học, chọn Câu sai:","options":[{"label":"A","text":"Kỹ thuật khối tế bào (cell block) không làm tăng khả năng chẩn đoán nguyên nhân ác tính. ."},{"label":"B","text":"Đòi hỏi người đọc tiêu bản phải có kinh nghiệm vì tế bào màng phổi có thể chuyển dạng tạo hình ảnh giống ác tính. ."},{"label":"C","text":"Sự hiện diện tế bào bất thường trong dịch màng phổi có khả năng chẩn đoán thấp do phụ thuộc mức độ lan rộng và loại tế bào ung thư. ."},{"label":"D","text":"Mọi bệnh nhân tràn dịch màng phổi dịch tiết nên được xét nghiệm tế bào học dịch màng phổi. ."}],"explanation":"Kỹ thuật khối tế bào (Cell block) đúc nến dịch màng phổi LÀM TĂNG ĐÁNG KỂ tỷ lệ phát hiện tế bào ung thư và cho phép thực hiện nhuộm hóa mô miễn dịch để xác định nguồn gốc khối u. Do đó mệnh đề 'không làm tăng...' là sai. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn dịch màng phổi, trang 202)."},{"number":96,"answer":"C","question":"Đối với tràn dịch màng phổi dịch tiết, trường hợp nghi ngờ lao và ung thư màng phổi, cần chẩn đoán mô bệnh học thông qua kỹ thuật nào:","options":[{"label":"A","text":"Sinh thiết màng phổi mù ."},{"label":"B","text":"Nội soi màng phổi ."},{"label":"C","text":"(A), (B) đúng ."},{"label":"D","text":"(A), (B) sai. ."}],"explanation":"Chẩn đoán mô bệnh học tổn thương màng phổi (Lao, Ung thư) có thể thực hiện qua Sinh thiết màng phổi mù (dùng kim Pleur-evac/Castelain) hoặc Nội soi màng phổi sinh thiết dưới quan sát trực tiếp. Cả A và B đều đúng. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn dịch màng phổi, trang 203)."},{"number":97,"answer":"B","question":"Bệnh nhân xơ gan, đã loại trừ viêm phổi nếu nuôi cấy dịch màng phổi dương tính vi khuẩn và có số lượng bạch cầu trung tính > 250 tế bào/mm³ hoặc nuôi cấy âm tính và số lượng bạch cầu trung tính > 500 tế bào/mm³ thì nghĩ đến vấn đề gì:","options":[{"label":"A","text":"Viêm màng phổi phản ứng. ."},{"label":"B","text":"Viêm màng phổi do vi khuẩn. ."},{"label":"C","text":"Tràn dịch màng phổi cận viêm. ."},{"label":"D","text":"Tràn dịch màng phổi dịch thấm ."}],"explanation":"Ở bệnh nhân xơ gan có tràn dịch màng phổi (hepatic hydrothorax), tiêu chuẩn nuôi cấy cấy (+) và BC đa nhân trung tính > 250/mm3 hoặc cấy (-) và BC đa nhân trung tính > 500/mm3 chẩn đoán Viêm màng phổi do vi khuẩn tự phát (Spontaneous bacterial empyema / Viêm màng phổi do vi khuẩn). (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn dịch màng phổi, trang 204)."},{"number":98,"answer":"C","question":"Tràn dịch màng phổi do lao có cơ chế: (1) trực khuẩn lao xâm nhập vào khoang màng phổi bằng đường máu hoặc đường bạch huyết gây kích thích miễn dịch trung gian tế bào. (2) các ổ hoặc hang có bã đậu nằm dưới màng phổi vỡ vào khoang màng phổi gây ra mủ màng phổi do lao.","options":[{"label":"A","text":"(1) đúng, (2) sai ."},{"label":"B","text":"(1) sai, (2) đúng ."},{"label":"C","text":"(1) đúng, (2) đúng ."},{"label":"D","text":"(1) sai, (2) sai ."}],"explanation":"Cả hai cơ chế trên đều chính xác trong sinh bệnh học tràn dịch màng phổi do lao: (1) Trực khuẩn lao đến màng phổi gây phản ứng quá mẫn muộn trung gian tế bào tiết dịch tiết, (2) Ổ bã đậu hoại tử dưới màng phổi vỡ trực tiếp vào khoang màng phổi gây viêm mủ màng phổi do lao. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn dịch màng phổi, trang 204)."},{"number":99,"answer":"D","question":"Tính chất tràn dịch màng phổi cạnh viêm:","options":[{"label":"A","text":"Số lượng tế bào từ 500 – 100 tế bào/mm³ với lympho > 70%, tế bào biểu mô < 5% ."},{"label":"B","text":"Dịch tiết, ADA ở ngưỡng chẩn đoán từ 40 – 60 UI/L ."},{"label":"C","text":"Xét nghiệm mô bệnh học có giá trị quyết định chẩn đoán ."},{"label":"D","text":"Cấy dịch màng phổi có thể dương tính ."}],"explanation":"Tràn dịch màng phổi cận viêm (parapneumonic effusion) hình thành do phản ứng viêm nhiễm trùng từ nhu mô phổi lan ra màng phổi, khi dịch đục hoặc chuyển sang giai đoạn mủ thanh tơ nuôi cấy dịch màng phổi có thể tìm thấy vi khuẩn dương tính. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn dịch màng phổi, trang 206)."},{"number":100,"answer":"D","question":"Trong sơ đồ tiếp cận điều trị tràn dịch màng phổi do ung thư, sau khi đánh giá bệnh nhân có khả năng sống hơn 1 tuần thì cần làm gì tiếp theo:","options":[{"label":"A","text":"Đặt catheter đường hầm màng phổi ."},{"label":"B","text":"Gây dày dính màng phổi ."},{"label":"C","text":"Tìm nguyên nhân khác gây khó thở ."},{"label":"D","text":"Cân nhắc nguy cơ và lợi ích của đặt catheter đường hầm với dày dính màng phổi với kết hợp cả 2 cách ."}],"explanation":"Theo Sơ đồ 10.3 (Tiếp cận điều trị tràn dịch màng phổi do ung thư): Sau khi đánh giá tiên lượng khả năng sống > 1 tuần và phổi có khả năng tái dãn nở, bước tiếp theo là Cân nhắc nguy cơ và lợi ích giữa Đặt catheter đường hầm màng phổi (IPC) với Gây dính màng phổi (Pleurodesis) hoặc kết hợp cả 2 phương pháp. (Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Sơ đồ 10.3, trang 211)."}]},{"name":"2024-2027 ĐỀ 270","questions":[{"number":1,"answer":"D","question":"Trong viêm phổi thùy, theo mô tả của Laennec, giai đoạn sung huyết là:","options":[{"label":"A","text":"Tổ chức phổi bị thương tổn có màu đỏ sẫm và chắc như gan, trong tổ chức này có thể có xuất huyết ."},{"label":"B","text":"Thương tổn phổi có màu nâu xám chứa hồng cầu, bạch cầu, vi khuẩn và tổ chức hoại tử ."},{"label":"C","text":"Các mao mạch thành phế nang giãn ra, hồng cầu, bạch cầu và fibrin thoát vào trong lòng phế nang ."},{"label":"D","text":"Phế nang còn ít dịch loãng, có ít bạch cầu ."}],"explanation":"Giai đoạn sung huyết mới có giãn mạch và dịch phù loãng trong phế nang, bạch cầu còn ít. Các mô tả phổi chắc như gan và chứa nhiều fibrin/hồng cầu thuộc các giai đoạn gan hóa đỏ và gan hóa xám. (2024), Bài Viêm phổi cộng đồng."},{"number":2,"answer":"B","question":"Thuật ngữ Viêm phổi cộng đồng, Viêm phổi bệnh viện, Viêm phổi liên quan tới chăm sóc y tế, Viêm phổi thở máy là để:","options":[{"label":"A","text":"Chỉ tình trạng nặng hay nhẹ của viêm phổi ."},{"label":"B","text":"Chỉ vị trí không gian xuất hiện viêm phổi và nhóm vi khuẩn gây bệnh ."},{"label":"C","text":"Chỉ vi khuẩn đề kháng hay không đề kháng ."},{"label":"D","text":"Chỉ tình trạng viêm phổi xuất hiện ở người có bệnh nền hay không ."}],"explanation":"Các phân loại theo hoàn cảnh xuất hiện nhằm phản ánh môi trường mắc bệnh, từ đó định hướng nhóm vi sinh vật gây bệnh phổ biến và nguy cơ kháng thuốc. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi cộng đồng & Viêm phổi bệnh viện."},{"number":3,"answer":"B","question":"Tác nhân vi sinh gây viêm phổi cộng đồng hay gặp nhất ở người lớn là:","options":[{"label":"A","text":"Haemophilus influenzae ."},{"label":"B","text":"Streptococcus pneumoniae ."},{"label":"C","text":"Mycoplasma pneumoniae ."},{"label":"D","text":"Klebsiella pneumoniae ."}],"explanation":"Streptococcus pneumoniae (Phế cầu) là vi khuẩn điển hình và phổ biến nhất gây viêm phổi cộng đồng ở người lớn trên toàn thế giới cũng như tại Việt Nam. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi cộng đồng."},{"number":4,"answer":"C","question":"Tác nhân vi sinh gây viêm phổi cộng đồng phân loại theo nhóm tác nhân không thông thường:","options":[{"label":"A","text":"Staphylococcus aureus ."},{"label":"B","text":"Pseudomonas aeruginosa ."},{"label":"C","text":"Mycobacterium tuberculosis ."},{"label":"D","text":"Klebsiella pneumoniae ."}],"explanation":"Mycobacterium tuberculosis (trực khuẩn lao) được xếp vào nhóm tác nhân không thông thường (dịch tễ đặc biệt/lao phổi) cần phân biệt với các vi khuẩn gây viêm phổi cộng đồng cấp tính điển hình. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi cộng đồng do vi khuẩn kháng thuốc."},{"number":5,"answer":"C","question":"Các yếu tố nguy cơ nhiễm P.aeruginosa đề kháng kháng sinh ở bệnh nhân viêm phổi cộng đồng bao gồm:","options":[{"label":"A","text":"Tiền sử đã nhiễm tụ cầu kháng Methicilline ."},{"label":"B","text":"Tiền sử đã nhiễm phế cầu kháng Penicilline ."},{"label":"C","text":"Có bệnh cấu trúc phổi ."},{"label":"D","text":"Nhiễm trùng da tái diễn ."}],"explanation":"Các bệnh lý cấu trúc phổi (đặc biệt là giãn phế quản, COPD nặng, xơ nang) là yếu tố nguy cơ hàng đầu nhiễm Pseudomonas aeruginosa đa kháng. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi cộng đồng do vi khuẩn kháng thuốc."},{"number":6,"answer":"B","question":"Khi sử dụng CRB-65 để phân tầng nguy cơ viêm phổi cộng đồng, bao nhiêu điểm thì phân loại mức độ nguy cơ nặng:","options":[{"label":"A","text":"4 ."},{"label":"B","text":"3 ."},{"label":"C","text":"2 ."},{"label":"D","text":"1 ."}],"explanation":"Thang điểm CRB-65 (Confusion, Respiratory rate >= 30, Blood pressure < 90/60, Age >= 65) có tổng điểm tối đa là 4. Bệnh nhân đạt 3 - 4 điểm được xếp vào nhóm nguy cơ nặng/tử vong cao, cần nhập viện khẩn cấp (xem xét ICU). Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi cộng đồng."},{"number":7,"answer":"C","que
