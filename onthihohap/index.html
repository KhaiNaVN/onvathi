 trị kháng sinh dựa trên vi khuẩn gây bệnh phổ biến tại địa phương ."}],"explanation":"Kháng sinh kinh nghiệm (Empiric antibiotic therapy) là việc chọn phác đồ điều trị dựa trên các khuyến cáo hướng dẫn lâm sàng đã được chứng minh hiệu quả bằng y học bằng chứng và mô hình vi sinh phổ biến trước khi có kết quả nuôi cấy đích."},{"number":42,"answer":"D","question":"Chọn một Câu sai trong những Câu trả lời sau đây: Phác đồ điều trị kháng sinh kinh nghiệm","options":[{"label":"A","text":"Amoxicillin và kháng sinh Macrolide mới là chỉ định cho viêm phổi cộng đồng nhẹ, trung bình không yếu tố nguy cơ nhiễm khuẩn đặc biệt và kháng thuốc. ."},{"label":"B","text":"Kết hợp điều trị kháng sinh được đề xuất từ mức độ trung bình nếu xác định có yếu tố nguy cơ nhiễm khuẩn đặc biệt và kháng thuốc. ."},{"label":"C","text":"Liều Amoxicilline 1g/8 giờ là đã xem xét đến khả năng S.pneumoniae giảm nhạy cảm với penicilline ."},{"label":"D","text":"Kết hợp kháng beta-lactamase với Amoxicilline để làm tăng khả năng diệt khuẩn theo cơ chế hiệp đồng trên S.pneumoniae ."}],"explanation":"Phế cầu (S. pneumoniae) kháng Penicillin qua cơ chế biến đổi các protein gắn penicillin (PBPs), không phải do tiết beta-lactamase. Do đó chất ức chế beta-lactamase không có tác dụng hiệp đồng tăng diệt phế cầu (chất ức chế này dùng để diệt H. influenzae hay M. catarrhalis tiết beta-lactamase)."},{"number":43,"answer":"B","question":"Theo Bộ Y Tế Việt Nam 2024, liều Ertapenem được khuyến cáo sử dụng trong điều trị viêm phổi cộng đồng là:","options":[{"label":"A","text":"2g TMC/8h ."},{"label":"B","text":"1g TTM/ngày ."},{"label":"C","text":"400mg TTM/8h ."},{"label":"D","text":"500mg TM/12h ."}],"explanation":"Liều dùng khuyến cáo của Ertapenem trong điều trị viêm phổi cộng đồng là 1g truyền tĩnh mạch 1 lần duy nhất trong ngày."},{"number":44,"answer":"B","question":"Bệnh nhân viêm phổi cộng đồng dị ứng với kháng sinh betalactam, sự lựa chọn kháng sinh thay thế được ATS khuyến cáo là:","options":[{"label":"A","text":"Aztreonam ."},{"label":"B","text":"Fluoroquinolone ."},{"label":"C","text":"Aminoglycosid ."},{"label":"D","text":"Cephalosporin ."}],"explanation":"Khi bệnh nhân dị ứng với Betalactam, hướng dẫn ATS/IDSA khuyến cáo sử dụng Fluoroquinolone hô hấp (Levofloxacin 750mg hoặc Moxifloxacin 400mg) làm phác đồ thay thế."},{"number":45,"answer":"B","question":"Trong dự phòng bệnh viêm phổi cộng đồng, việc tiêm vaccin phòng phế cầu cho những trường hợp sau, NGOẠI TRỪ:","options":[{"label":"A","text":"Có bệnh phổi mạn ."},{"label":"B","text":"Tăng huyết áp ."},{"label":"C","text":"Tuổi trên 65 ."},{"label":"D","text":"Đã cắt lách ."}],"explanation":"Các đối tượng ưu tiên tiêm vắc-xin phế cầu gồm: Người >= 65 tuổi, người có bệnh mạn tính (phổi, tim, gan, thận, đái tháo đường), người cắt lách hoặc suy giảm miễn dịch. Tăng huyết áp đơn thuần không thuộc nhóm nguy cơ cao ưu tiên."},{"number":46,"answer":"C","question":"Khuyến cáo điều trị viêm phổi cộng đồng ngoại trú đối với bệnh nhân khỏe mạnh và không dùng kháng sinh gần đây (bằng chứng 1):","options":[{"label":"A","text":"Betalactam ."},{"label":"B","text":"Fluoroquinolon ."},{"label":"C","text":"Macrolid ."},{"label":"D","text":"Doxycyclin ."}],"explanation":"Theo hướng dẫn ATS/IDSA, đối với bệnh nhân ngoại trú khỏe mạnh không có yếu tố nguy cơ kháng thuốc, Macrolide (Azithromycin/Clarithromycin) hoặc Amoxicillin liều cao là lựa chọn khuyến cáo mức độ 1."},{"number":47,"answer":"D","question":"Thời gian điều trị < 7 ngày được khuyến cáo cho các trường hợp, NGOẠI TRỪ:","options":[{"label":"A","text":"Viêm phổi không biến chứng có đáp ứng lâm sàng tốt ."},{"label":"B","text":"Viêm phổi không có bằng chứng do các trực khuẩn Gram (-) không lên men ."},{"label":"C","text":"Viêm phổi do phế cầu ."},{"label":"D","text":"Viêm phổi do Staphylococcus aureus ."}],"explanation":"Viêm phổi do Staphylococcus aureus, P. aeruginosa hoặc các vi khuẩn Gram âm không lên men đường đòi hỏi thời gian điều trị kháng sinh kéo dài hơn (tối thiểu 14 - 21 ngày)."},{"number":48,"answer":"A","question":"Sự phối hợp kháng sinh nào được khuyến cáo trong điều trị viêm phổi cộng đồng nguy cơ nặng:","options":[{"label":"A","text":"Macrolide mới + Beta lactam ."},{"label":"B","text":"Beta lactam + fluoroquinolone ."},{"label":"C","text":"Beta lactam + Aminoglycosid ."},{"label":"D","text":"Cephalosporin + fluoroquinolone ."}],"explanation":"Phác đồ ưu tiên hàng đầu cho VPCĐ nặng nhập ICU là kết hợp một Betalactam chống phế cầu (Cefotaxime, Ceftriaxone, Ampicillin-sulbactam) với một Macrolide mới (Azithromycin) hoặc FQ hô hấp."},{"number":49,"answer":"D","question":"Thời gian điều trị kháng sinh đối với viêm phổi cộng đồng có tràn mủ màng phổi là:","options":[{"label":"A","text":"7-10 ngày ."},{"label":"B","text":"14-21 ngày ."},{"label":"C","text":"2-4 tuần ."},{"label":"D","text":"4-6 tuần ."}],"explanation":"Viêm phổi có biến chứng mủ màng phổi hoặc áp-xe phổi đòi hỏi thời gian điều trị kháng sinh kéo dài từ 4 - 6 tuần kết hợp với dẫn lưu mủ tối thiểu."},{"number":50,"answer":"A","question":"Chỉ định sử dụng corticoid trong viêm phổi là:","options":[{"label":"A","text":"Hội chứng nguy ngập hô hấp cấp ."},{"label":"B","text":"Suy giảm miễn dịch ."},{"label":"C","text":"Nhập viện nhiều lần ."},{"label":"D","text":"Áp xe phổi ."}],"explanation":"Corticosteroid toàn thân chỉ được cân nhắc chỉ định trong viêm phổi cộng đồng nặng có biến chứng sốc nhiễm trùng không đáp ứng với vận mạch hoặc có Hội chứng nguy ngập hô hấp cấp (ARDS)."},{"number":51,"answer":"A","question":"Tại Việt Nam, năm 2012, tỷ lệ mắc hen ở người lớn là:","options":[{"label":"A","text":"4.1% ."},{"label":"B","text":"4,2% ."},{"label":"C","text":"4.3% ."},{"label":"D","text":"4.4% ."}],"explanation":"Theo Giáo trình Hô hấp CTUMP: Nghiên cứu cắt ngang năm 2012 tại Việt Nam ghi nhận tỷ lệ mắc hen phế quản ở người lớn là 4,1%."},{"number":52,"answer":"B","question":"Đặc điểm bệnh hen phế quản, NGOẠI TRỪ:","options":[{"label":"A","text":"Viêm mạn tính đường thở ."},{"label":"B","text":"Cơn hen không thể hồi phục tự nhiên ."},{"label":"C","text":"Giới hạn luồng khí thở ra dao động ."},{"label":"D","text":"Các cơn hen xảy ra với mức độ khác nhau ."}],"explanation":"Định nghĩa hen phế quản: Là bệnh viêm mạn tính đường thở, các cơn khó thở khò khè có đặc tính HỒI PHỤC TỰ NHIÊN hoặc sau khi dùng thuốc giãn phế quản."},{"number":53,"answer":"A","question":"Tình trạng viêm đường thở trong hen:","options":[{"label":"A","text":"Tồn tại dai dẳng ngay cả khi không có triệu chứng ."},{"label":"B","text":"Chỉ ảnh hưởng đến các đường thở nhỏ ."},{"label":"C","text":"Hen càng nặng thì mức độ viêm càng nhiều ."},{"label":"D","text":"Chỉ tồn tại trong cơn hen cấp ."}],"explanation":"Theo Giáo trình Hô hấp SĐH: Tình trạng viêm đường thở trong hen tồn tại dai dẳng ngay cả khi bệnh nhân không có triệu chứng lâm sàng."},{"number":54,"answer":"D","question":"Trong hen phế quản, quá trình viêm đường thở thường bắt đầu ở:","options":[{"label":"A","text":"Tế bào đài ."},{"label":"B","text":"Tế bào cơ trơn ."},{"label":"C","text":"Tuyến dưới niêm ."},{"label":"D","text":"Tế bào biểu mô ."}],"explanation":"Lớp tế bào biểu mô phế quản là nơi tiếp xúc đầu tiên với các dị nguyên và chất kích thích từ môi trường, đóng vai trò phát động phản ứng viêm trong sinh bệnh học hen."},{"number":55,"answer":"A","question":"Trong hen phế quản không do dị ứng, việc kích thích các tế bào biểu mô có thể do, NGOẠI TRỪ:","options":[{"label":"A","text":"Dị nguyên ."},{"label":"B","text":"Nhiễm virus ."},{"label":"C","text":"Nhiễm vi khuẩn ."},{"label":"D","text":"Do tiếp xúc với chất độc hại ."}],"explanation":"Dị nguyên là tác nhân kích thích trong thể hen dị ứng (qua trung gian IgE/Th2). Trong hen KHÔNG dị ứng, các yếu tố kích thích tế bào biểu mô là virus, vi khuẩn, ô nhiễm không khí, khói thuốc..."},{"number":56,"answer":"C","question":"Tế bào viêm trong đường thở ở bệnh hen, NGOẠI TRỪ:","options":[{"label":"A","text":"Bạch cầu ái toan ."},{"label":"B","text":"Bạch cầu đa nhân trung tính ."},{"label":"C","text":"Bạch cầu lympho B ."},{"label":"D","text":"Bạch cầu ái kiềm ."}],"explanation":"Các tế bào viêm trực tiếp thâm nhiễm tại đường thở trong hen gồm Eosinophil, Neutrophil, Mast cell, Basophil, Lympho T, Đại thực bào. Lympho B tập trung ở cơ quan bạch huyết để sản xuất kháng thể."},{"number":57,"answer":"B","question":"Vai trò của bạch cầu ái toan trong cơ chế bệnh sinh bệnh hen:","options":[{"label":"A","text":"Phóng thích các chất trung gian gây co thắt phế quản như Histamin, prostaglandin D2 ."},{"label":"B","text":"Phóng thích protein cơ bản gây phá huỷ tế bào biểu mô đường thở ."},{"label":"C","text":"Phóng thích các cytokine đặc hiệu ."},{"label":"D","text":"Trình diện kháng nguyên ."}],"explanation":"Bạch cầu ái toan giải phóng các protein độc tế bào như Protein cơ bản chính (MBP - Major Basic Protein), ECP, EDN gây bong tróc và phá hủy tế bào biểu mô đường thở."},{"number":58,"answer":"C","question":"Các chất trung gian chính gây viêm trong hen, NGOẠI TRỪ:","options":[{"label":"A","text":"Chemokines ."},{"label":"B","text":"Cysteinyl leukotrienes ."},{"label":"C","text":"IgA ."},{"label":"D","text":"Cytokines ."}],"explanation":"IgA là kháng thể bảo vệ niêm mạc, không phải chất trung gian hóa học gây viêm. Các chất trung gian chính gồm Cytokines, Chemokines, Cysteinyl leukotrienes, Histamine, PGD2..."},{"number":59,"answer":"C","question":"Chất quyết định mức độ nặng trong hen:","options":[{"label":"A","text":"Chemokines ."},{"label":"B","text":"Cysteinyl leukotrienes ."},{"label":"C","text":"Cytokines ."},{"label":"D","text":"Histamine ."}],"explanation":"Theo Giáo trình Hô hấp SĐH: Cytokines là các chất tác động trực tiếp làm thay đổi đáp ứng viêm trong hen và nhiều khả năng đây là các chất quyết định mức độ nặng trong hen."},{"number":60,"answer":"C","question":"Lâm sàng bệnh hen phế quản có hơn 1 triệu chứng đặc trưng như ho, khó thở, nặng ngực và:","options":[{"label":"A","text":"Khạc đàm ."},{"label":"B","text":"Sốt ."},{"label":"C","text":"Khò khè ."},{"label":"D","text":"Đánh trống ngực ."}],"explanation":"Bốn triệu chứng hô hấp đặc trưng của hen phế quản là: Khò khè, khó thở, nặng ngực và ho."},{"number":61,"answer":"D","question":"Gợi ý hen phế quản khi dao động PEF trong ngày:","options":[{"label":"A","text":">5% trong 1-2 tuần ."},{"label":"B","text":">10% trong 1-2 tuần ."},{"label":"C","text":">15% trong 1-2 tuần ."},{"label":"D","text":">20% trong 1-2 tuần ."}],"explanation":"Tiêu chuẩn chẩn đoán hen theo GINA: Độ dao động PEF trung bình hàng ngày > 10% (hoặc > 20% khi đo hai lần/ngày trong 1-2 tuần)."},{"number":62,"answer":"D","question":"Gợi ý hen phế quản khi PEF sau 4 tuần điều trị ICS cải thiện:","options":[{"label":"A","text":"5% ."},{"label":"B","text":"10% ."},{"label":"C","text":"15% ."},{"label":"D","text":"20% ."}],"explanation":"Tiêu chuẩn GINA củng cố chẩn đoán hen: PEF cải thiện > 20% (hoặc FEV1 tăng > 12% và > 200 ml) sau 4 tuần điều trị bằng thuốc kiểm soát (ICS)."},{"number":63,"answer":"A","question":"Xét nghiệm dấu ấn viêm đường thở trong hen phế quản giúp:","options":[{"label":"A","text":"Đánh giá kiểm soát ."},{"label":"B","text":"Chẩn đoán xác định ."},{"label":"C","text":"Chẩn đoán bậc ."},{"label":"D","text":"Chẩn đoán phân biệt ."}],"explanation":"Các dấu ấn viêm như FeNO, Eosinophil máu/đờm giúp đánh giá mức độ viêm type 2, định hướng kiểu hình hen và theo dõi mức độ kiểm soát hen cũng như đáp ứng với ICS."},{"number":64,"answer":"D","question":"Nhóm bệnh có tắc nghẽn luồng khí cần chẩn đoán phân biệt với hen, NGOẠI TRỪ:","options":[{"label":"A","text":"Bệnh phổi tắc nghẽn mạn tính ."},{"label":"B","text":"Giãn phế quản ."},{"label":"C","text":"Dị vật đường thở ."},{"label":"D","text":"Bệnh phổi mô kẽ ."}],"explanation":"Bệnh phổi mô kẽ (ILD) thuộc nhóm bệnh hô hấp gây rối loạn thông khí HẠN CHẾ (không có tắc nghẽn luồng khí)."},{"number":65,"answer":"D","question":"Cơn hen phế quản biểu hiện, NGOẠI TRỪ:","options":[{"label":"A","text":"Tăng triệu chứng khó thở, khò khè, đau ngực, ho ."},{"label":"B","text":"Giảm chức năng phổi ."},{"label":"C","text":"Cần thay đổi điều trị so với thường ngày ."},{"label":"D","text":"Cơn hen phế quản sẽ diễn tiến nặng hơn ở những trường hợp chưa được chẩn đoán trước ."}],"explanation":"Cơn hen (đợt cấp) có thể xuất hiện ở bất kỳ bệnh nhân hen nào với mức độ từ nhẹ đến nguy kịch, không nhất thiết lúc nào cũng diễn tiến nặng hơn chỉ vì chưa được chẩn đoán trước."},{"number":66,"answer":"A","question":"Cận lâm sàng thực hiện ở bệnh nhân có cơn hen cấp giúp, NGOẠI TRỪ:","options":[{"label":"A","text":"Chẩn đoán xác định ."},{"label":"B","text":"Đánh giá mức độ cơn hen ."},{"label":"C","text":"Chẩn đoán phân biệt ."},{"label":"D","text":"Xác định biến chứng ."}],"explanation":"Chẩn đoán xác định hen dựa vào tiền sử và hô hấp ký ngoài cơn. Trong cơn hen cấp, các cận lâm sàng (khí máu, SpO2, X-quang) giúp đánh giá mức độ nặng của cơn, phát hiện biến chứng (tràn khí màng phổi) và phân biệt với bệnh cấp cứu khác."},{"number":67,"answer":"B","question":"Bệnh nhân nữ, 50 tuổi, tiền sử hen phế quản, vào viện vì tăng khò khè. Tình trạng nhập viện: Tỉnh táo, nói được câu ngắn, M 100 lần/phút, co kéo cơ hô hấp phụ. Chẩn đoán mức độ cơn hen:","options":[{"label":"A","text":"Nhẹ ."},{"label":"B","text":"Trung bình ."},{"label":"C","text":"Nặng ."},{"label":"D","text":"Nguy kịch ."}],"explanation":"Phân độ cơn hen nhập viện (GINA): Bệnh nhân nói được cụm từ/câu ngắn, thích ngồi, nhịp tim 100-120 l/p, co kéo nhẹ cơ hô hấp phụ -> Cơn hen mức độ TRUNG BÌNH."},{"number":68,"answer":"C","question":"Yếu tố nguy cơ của cơn hen, NGOẠI TRỪ:","options":[{"label":"A","text":"Hen không kiểm soát ."},{"label":"B","text":"Sử dụng nhiều thuốc SABA cắt cơn ."},{"label":"C","text":"Sử dụng ICS theo bậc ."},{"label":"D","text":"Vấn đề tâm lý, xã hội ."}],"explanation":"Sử dụng ICS theo bậc tuân thủ giúp kiểm soát viêm đường thở và phòng ngừa đợt cấp, đây là biện pháp bảo vệ, không phải yếu tố nguy cơ."},{"number":69,"answer":"A","question":"Yếu tố nguy cơ tử vong do cơn hen:","options":[{"label":"A","text":"Nhập viện vì cơn hen trong năm qua ."},{"label":"B","text":"Phơi nhiễm khói thuốc, dị nguyên ."},{"label":"C","text":"Sử dụng ICS không đủ ."},{"label":"D","text":"Có thể liên quan đến kỹ thuật hít thuốc ."}],"explanation":"Tiền sử từng có đợt cấp hen phải nhập viện/cấp cứu hoặc đặt NKQ/ICU trong 12 tháng qua là yếu tố dự đoán nguy cơ tử vong cao do hen."},{"number":70,"answer":"A","question":"Nguyên tắc chung xử trí cơn hen nặng:","options":[{"label":"A","text":"Xử trí thuốc trước, thủ thuật cấp cứu sau ."},{"label":"B","text":"Thủ thuật cấp cứu trước, xử trí thuốc sau ."},{"label":"C","text":"Chỉ xử trí thuốc ."},{"label":"D","text":"Xử trí theo kinh nghiệm của bác sĩ ."}],"explanation":"Quy tắc xử trí cơn hen: Cơn hen phế quản NẶNG -> Xử trí thuốc trước, thủ thuật cấp cứu sau. Cơn hen phế quản NGUY KỊCH -> Tiến hành thủ thuật cấp cứu trước, xử trí thuốc sau."},{"number":71,"answer":"D","question":"Nguyên tắc chung xử trí cơn hen phế quản cấp là:","options":[{"label":"A","text":"Xử trí tại nhà trước rồi nhập viện ."},{"label":"B","text":"Đưa ngay đến bệnh viện tỉnh ."},{"label":"C","text":"Tìm trạm y tế gần nhà để xử trí ."},{"label":"D","text":"Xử trí tại nhà sau đó đánh giá kế hoạch hành động tiếp theo ."}],"explanation":"Khi xuất hiện cơn hen cấp, bệnh nhân cần xử trí ngay tại nhà theo Kế hoạch hành động hen đã viết sẵn (xịt SABA), sau đó đánh giá đáp ứng để quyết định tiếp tục theo dõi hay đến cơ sở y tế."},{"number":72,"answer":"D","question":"Bệnh nhân nữ, 40 tuổi, tiền sử hen phế quản, vào viện vì tăng khò khè. Tình trạng nhập viện: Tỉnh táo, nói được nguyên câu, M 88 lần/phút, không co kéo cơ hô hấp phụ. Xử trí ban đầu cơn hen cấp mức độ nhẹ nào không phù hợp:","options":[{"label":"A","text":"SABA 4-10 nhát MDI qua spacer, lặp lại mỗi 20 phút trong 1h ."},{"label":"B","text":"Prednisolone 1mg/Kg/ngày, uống ."},{"label":"C","text":"Oxy đảm bảo SaO₂ 94% ."},{"label":"D","text":"Xem xét Magnesium tĩnh mạch ."}],"explanation":"Magnesium sulfate tiêm/truyền tĩnh mạch chỉ dành cho cơn hen NẠNG hoặc NGUY KỊCH không đáp ứng với thuốc giãn phế quản ban đầu. Không có chỉ định dùng Magnesium cho cơn hen nhẹ."},{"number":73,"answer":"D","question":"Theophylline trong điều trị cơn hen phế quản cấp:","options":[{"label":"A","text":"Hiệu quả giãn phế quản như thuốc nhóm kích thích Beta 2 ."},{"label":"B","text":"Liều 2g, 1 ống pha trong 100ml dung dịch nước muối đẳng trương truyền trong một giờ ."},{"label":"C","text":"Có thể truyền duy trì nhưng không quá 20mg/kg/ngày ."},{"label":"D","text":"Nên định lượng theophyllin huyết thanh ."}],"explanation":"Aminophylline/Theophylline có khoảng điều trị hẹp, dễ gây ngộ độc tim mạch và thần kinh, do đó cần định lượng nồng độ theophylline trong máu khi sử dụng."},{"number":74,"answer":"B","question":"Sử dụng corticosteroid hít điều trị cơn hen cấp, NGOẠI TRỪ:","options":[{"label":"A","text":"Kết hợp liều cao ICS và salbutamol cho hiệu quả giãn phế quản tốt hơn salbutamol đơn thuần ."},{"label":"B","text":"Hiệu quả phòng ngừa cơn tái phát của ICS là thấp hơn so với corticosteroid uống ."},{"label":"C","text":"Bệnh nhân ra khỏi phòng cấp cứu kết hợp corticosteroid uống với ICS sẽ có tỷ lệ cơn tái phát thấp hơn corticosteroid uống đơn thuần ."},{"label":"D","text":"Liều cao ICS làm giảm được tái phát tương đương với 40mg prednisolone ."}],"explanation":"Các nghiên cứu chứng minh dùng ICS liều cao trong giờ đầu xử trí cơn hen cấp có hiệu quả phòng ngừa đợt cấp và nhập viện tương đương với Corticoid đường uống."},{"number":75,"answer":"B","question":"Đánh giá một trường hợp cơn hen ra viện, NGOẠI TRỪ:","options":[{"label":"A","text":"Các triệu chứng cải thiện với SABA ."},{"label":"B","text":"PEF cải thiện và >20% giá trị dự đoán ."},{"label":"C","text":"SaO₂ >90% (khí phòng) ."},{"label":"D","text":"Bệnh nhân đã được chuyển thuốc đường uống, hít ."}],"explanation":"Tiêu chuẩn cho bệnh nhân cơn hen ra viện là PEF hoặc FEV1 cải thiện > 60 - 80% giá trị dự đoán (hoặc giá trị tốt nhất của bệnh nhân), không phải chỉ > 20%."},{"number":76,"answer":"B","question":"Nguyên nhân tràn dịch màng phổi dịch thấm, NGOẠI TRỪ:","options":[{"label":"A","text":"Suy tim sung huyết ."},{"label":"B","text":"Hội chứng tăng ure máu ."},{"label":"C","text":"Hội chứng thận hư ."},{"label":"D","text":"Tắc tĩnh mạch chủ trên ."}],"explanation":"Tràn dịch màng phổi do tăng ure máu (viêm màng phổi do urê huyết mạn) là tràn dịch dịch tiết. Các nguyên nhân A, C, D gây tràn dịch dịch thấm."},{"number":77,"answer":"C","question":"Tràn dịch màng phổi dịch tiết do nhiễm trùng chiếm khoảng:","options":[{"label":"A","text":"2-35% ."},{"label":"B","text":"10-50% ."},{"label":"C","text":"36-66% ."},{"label":"D","text":"4-20% ."}],"explanation":"Theo thống kê y văn và Giáo trình Hô hấp: Tràn dịch màng phổi dịch tiết do nguyên nhân nhiễm trùng (viêm phổi cận viêm, mủ màng phổi, lao màng phổi) chiếm tỷ lệ cao nhất, khoảng 36% - 66%."},{"number":78,"answer":"A","question":"Dịch màng phổi được thành lập từ các thay đổi sau, CHỌN CÂU SAI:","options":[{"label":"A","text":"Giảm dịch kẽ trong phổi: suy thất trái, viêm phổi và thuyên tắc phổi ."},{"label":"B","text":"Tăng áp lực thủy tĩnh mao mạch trong màng phổi: suy thất phải hoặc trái, hội chứng tĩnh mạch chủ trên ."},{"label":"C","text":"Tăng tính thấm của mao mạch màng phổi: viêm màng phổi ."},{"label":"D","text":"Giảm áp lực trong khoang màng phổi: xẹp phổi hoặc tăng độ đàn hồi của phổi ."}],"explanation":"Cơ chế tạo dịch màng phổi là do TĂNG dịch kẽ trong phổi (thoát dịch kẽ vào khoang màng phổi) trong suy tim trái, viêm phổi, thuyên tắc phổi; không phải giảm dịch kẽ."},{"number":79,"answer":"D","question":"Ung thư màng phổi nguyên phát (Mesotheliome):","options":[{"label":"A","text":"Ít gặp hơn do di căn. ."},{"label":"B","text":"Thường gặp ở dạng mảng, u hơn là dạng tràn dịch. ."},{"label":"C","text":"Liên quan trực tiếp đến Amiante. ."},{"label":"D","text":"A và C đúng. ."}],"explanation":"U trung biểu mô màng phổi (Mesothelioma) nguyên phát rất ít gặp so với ung thư di căn màng phổi và có mối liên quan trực tiếp nguyên nhân với phơi nhiễm Amiăng (Amiante)."},{"number":80,"answer":"D","question":"Dịch màng phổi do Lao KHÔNG CÓ đặc điểm sau:","options":[{"label":"A","text":"Thường có màu vàng chanh hơn là mủ. ."},{"label":"B","text":"Tái lập nhanh do liên quan đến phản ứng miễn dịch quá đáng. ."},{"label":"C","text":"Dịch có thể hết cả khi không điều trị. ."},{"label":"D","text":"Rất giàu trực khuẩn lao trong dịch. ."}],"explanation":"Dịch màng phổi do lao hình thành chủ yếu do đáp ứng quá mẫn muộn với protein của trực khuẩn lao, số lượng vi khuẩn lao trong dịch màng phổi RẤT ÍT (soi trực tiếp tìm BK dương tính < 10%)."},{"number":81,"answer":"D","question":"Đặc điểm hình ảnh XQ ngực của tràn dịch màng phổi, NGOẠI TRỪ:","options":[{"label":"A","text":"Mờ đồng nhất ."},{"label":"B","text":"Mất góc sườn hoành ."},{"label":"C","text":"Đường cong Damoiseau ."},{"label":"D","text":"Phế quản hơi ."}],"explanation":"Hình ảnh \"Phế quản hơi\" (Air bronchogram) là dấu hiệu X-quang của hội chứng đông đặc nhu mô phổi, không phải đặc điểm của tràn dịch màng phổi."},{"number":82,"answer":"C","question":"Triệu chứng cơ năng sau đây có giá trị chẩn đoán tràn dịch màng phổi:","options":[{"label":"A","text":"Đau vùng sau xương ức lan lên vai trái ."},{"label":"B","text":"Ho và khạc nhiều đàm loãng ."},{"label":"C","text":"Ho khi thay đổi tư thế ."},{"label":"D","text":"Khó thở từng cơn khi nghiêng bên tràn dịch ."}],"explanation":"Ho xuất hiện hoặc tăng lên khi thay đổi tư thế là triệu chứng cơ năng gợi ý có dịch di động tự do trong khoang màng phổi gây kích thích màng phổi thành."},{"number":83,"answer":"D","question":"Để xác định tràn dịch màng phổi thể khu trú cần dựa vào:","options":[{"label":"A","text":"Tiền sử, bệnh sử ."},{"label":"B","text":"Triệu chứng cơ năng là chính ."},{"label":"C","text":"Triệu chứng thực thể là chính ."},{"label":"D","text":"Phim XQ ngực ."}],"explanation":"Tràn dịch màng phổi khu trú khó phát hiện bằng thăm khám thực thể, hình ảnh học X-quang ngực (thẳng, nghiêng), Siêu âm ngực hoặc CT scan ngực là phương tiện quyết định để xác định."},{"number":84,"answer":"C","question":"Glucose trong dịch màng phổi rất thấp thường gặp trong:","options":[{"label":"A","text":"Ung thư màng phổi ."},{"label":"B","text":"Lao màng phổi ."},{"label":"C","text":"Viêm mủ màng phổi ."},{"label":"D","text":"Suy tim, suy thận ."}],"explanation":"Nồng độ Glucose dịch màng phổi giảm rất thấp (< 60 mg/dL hoặc gần 0) điển hình nhất trong Viêm mủ màng phổi (do bạch cầu và vi khuẩn tiêu thụ glucose) và Viêm màng phổi do thấp."},{"number":85,"answer":"A","question":"Dịch màng phổi khi quan sát đại thể có màu vàng xanh thường gặp trong:","options":[{"label":"A","text":"Viêm màng phổi do thấp ."},{"label":"B","text":"Vỡ ổ mủ áp xê gan vào màng phổi ."},{"label":"C","text":"Chỉ điểm nấm Aspergillus màng phổi ."},{"label":"D","text":"Tràn mủ màng phổi ."}],"explanation":"Tràn dịch màng phổi trong bệnh Viêm khớp dạng thấp (viêm màng phổi do thấp) đại thể dịch thường có màu vàng xanh đặc trưng, nồng độ glucose rất thấp và yếu tố dạng thấp RF cao."},{"number":86,"answer":"A","question":"Về đặc điểm Xquang ngực thẳng trong tràn dịch màng phổi, chọn Câu sai:","options":[{"label":"A","text":"Hình ảnh mờ góc sườn hoành, đậm, không đồng nhất, có giới hạn trên là đường cong lõm, cao ở thành ngực và thấp dần khi đi vào trung thất. ."},{"label":"B","text":"Tràn dịch màng phổi lượng nhiều có thể làm di lệch vị trí trung thất sang đối diện. ."},{"label":"C","text":"Với bất kỳ một Xquang ngực bất thường, nên xem xét có tràn dịch màng phổi hay không. ."},{"label":"D","text":"Dịch màng phổi tự do trong khoang màng phổi phân bố theo chiều trọng lực: khi bệnh nhân ở tư thế đứng, thì dịch này đọng ở khe sườn hoành sau. ."}],"explanation":"Đặc điểm X-quang ngực thẳng của tràn dịch màng phổi tự do là đám mờ ĐỒNG NHẤT, giới hạn trên là đường cong Damoiseau. Mô tả \"không đồng nhất\" ở đáp án A là SAI."},{"number":87,"answer":"D","question":"Về đặc điểm siêu âm màng phổi trong tràn dịch màng phổi, chọn Câu sai:","options":[{"label":"A","text":"Giúp phát hiện tràn dịch khu trú, phân biệt tràn dịch với dày dính màng phổi và hướng dẫn chọc dò màng phổi trong những trường hợp khó. ."},{"label":"B","text":"Đo thể tích dịch màng phổi bằng siêu âm được cho là chính xác hơn phương pháp đo bằng X quang tư thế nằm. ."},{"label":"C","text":"Với siêu âm, thể tích dịch màng phổi được thấy là tương quan với độ tách biệt của 2 lá màng phổi. ."},{"label":"D","text":"Có thể ước tính lượng dịch có thể rút ra được bằng cách lấy khoảng cách lớn nhất giữa lá tạng và lá thành (do ở mặt cắt ngang) nhân với 10. ."}],"explanation":"Công thức ước tính thể tích dịch màng phổi trên siêu âm theo Goecke: Thể tích (mL) = Khoảng cách tách biệt lớn nhất giữa lá thành và lá tạng (mm) x 20 (hoặc công thức Erecsei: mm x 15), không phải nhân với 10."},{"number":88,"answer":"A","question":"Có thể chẩn đoán nhầm dịch thấm thành dịch tiết trong tràn dịch màng phổi trong khoảng bao nhiêu phần trăm trường hợp:","options":[{"label":"A","text":"15% ."},{"label":"B","text":"25% ."},{"label":"C","text":"35% ."},{"label":"D","text":"45% ."}],"explanation":"Tiêu chuẩn Light có độ nhạy rất cao nhưng có thể chẩn đoán nhầm dịch thấm (đặc biệt ở bệnh nhân suy tim đang điều trị bằng thuốc lợi tiểu) thành dịch tiết trong khoảng 15% các trường hợp."},{"number":89,"answer":"A","question":"Trong sơ đồ tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light, sau khi thực hiện chọc dịch màng phổi chẩn đoán thì kết luận dịch tiết khi đáp ứng tiêu chuẩn nào sau đây:","options":[{"label":"A","text":"Protein dịch màng phổi /huyết thanh > 0,5 ."},{"label":"B","text":"LDH dịch màng phổi /huyết thanh > 0,5 ."},{"label":"C","text":"LDH dịch màng phổi > 1/3 giới hạn bình thường trên của LDH huyết thanh ."},{"label":"D","text":"LDH dịch màng phổi > 400 UI/L giá trị bình thường của LDH huyết thanh ."}],"explanation":"Tiêu chuẩn Light xác định dịch tiết khi có ít nhất 1 trong 3 tiêu chuẩn: 1) Protein DMP / Protein HT > 0,5; 2) LDH DMP / LDH HT > 0,6; 3) LDH DMP > 2/3 giới hạn trên bình thường của LDH máu."},{"number":90,"answer":"B","question":"Trong sơ đồ tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light, sau khi thực hiện chọc dịch màng phổi chẩn đoán với kết luận dịch thấm thì bác sĩ cần làm gì tiếp theo:","options":[{"label":"A","text":"Tiến hành các kỹ thuật chẩn đoán sâu hơn ."},{"label":"B","text":"Điều trị suy tim, xơ gan, bệnh thận ."},{"label":"C","text":"Định lượng glucose, amylase dịch màng phổi ."},{"label":"D","text":"Xét nghiệm dịch màng phổi tìm lao ."}],"explanation":"Theo Sơ đồ 10.1 (Tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light): Khi kết luận là Dịch thấm -> Điều trị nguyên nhân toàn thân nền như suy tim, xơ gan, bệnh thận (hội chứng thận hư)."},{"number":91,"answer":"A","question":"Trong sơ đồ tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light, sau khi thực hiện chọc dịch màng phổi chẩn đoán với kết luận dịch tiết thì bác sĩ cần làm gì tiếp theo:","options":[{"label":"A","text":"Tiến hành các kỹ thuật chẩn đoán sâu hơn ."},{"label":"B","text":"Điều trị suy tim, xơ gan, bệnh thận ."},{"label":"C","text":"Không làm gì thêm để chẩn đoán ."},{"label":"D","text":"Nội soi màng phổi hoặc sinh thiết màng phổi ."}],"explanation":"Theo Sơ đồ 10.1 (Tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light): Khi kết luận là Dịch tiết -> Bước tiếp theo là \"Tiến hành các kỹ thuật chẩn đoán sâu hơn\" (định lượng glucose, amylase, công thức tế bào, tế bào học, cấy/nhuộm vi khuẩn, tìm lao...)."},{"number":92,"answer":"D","question":"Trong sơ đồ tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light, sau khi thực hiện chọc dịch màng phổi chẩn đoán với kết luận dịch tiết có tăng amylase thì bác sĩ cần xem xét các khả năng sau, NGOẠI TRỪ","options":[{"label":"A","text":"Rách thực quản ."},{"label":"B","text":"Tràn dịch màng phổi trong viêm tụy ."},{"label":"C","text":"Bệnh lý ác tính ."},{"label":"D","text":"Nhiễm vi khuẩn ."}],"explanation":"Tăng Amylase trong dịch màng phổi gợi ý 3 nhóm nguyên nhân chính: 1) Thủng/rách thực quản; 2) Bệnh lý tuyến tụy (viêm tụy mạn/cấp, nang giả tụy); 3) Bệnh lý ác tính (ung thư). Nhiễm vi khuẩn thông thường không gây tăng amylase dịch màng phổi."},{"number":93,"answer":"C","question":"Trong sơ đồ tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light, sau khi thực hiện chọc dịch màng phổi chẩn đoán với kết luận dịch tiết và tiến hành các kỹ thuật chẩn đoán sâu hơn nhưng bác sĩ vẫn không có chẩn đoán thì bác sĩ cần quyết định sao:","options":[{"label":"A","text":"Tiếp tục tiến hành các kỹ thuật chẩn đoán ."},{"label":"B","text":"Thực hiện chọc dịch màng phổi chẩn đoán lại ."},{"label":"C","text":"Xem xét thuyên tắc phổi ."},{"label":"D","text":"Xét nghiệm dịch màng phổi tìm lao ."}],"explanation":"Theo Sơ đồ 10.1 (Tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light): Nếu đã tiến hành các xét nghiệm chuyên sâu mà vẫn \"Không có chẩn đoán\" -> Xem xét thuyên tắc phổi (chụp CT xoắn ốc hoặc xạ hình phổi)."},{"number":94,"answer":"B","question":"Trong sơ đồ tiếp cận tràn dịch màng phổi (TDMP) theo tiêu chuẩn Light, sau khi theo dõi người bệnh không cải thiện triệu chứng TDMP thì bác sĩ cần làm gì tiếp theo:","options":[{"label":"A","text":"Tiếp tục tiến hành lại các kỹ thuật chẩn đoán TDMP ."},{"label":"B","text":"Xem xét soi màng phổi hoặc sinh thiết màng phổi ."},{"label":"C","text":"Xét nghiệm dịch màng phổi tìm lao ."},{"label":"D","text":"Điều trị thuyên tắc phổi ."}],"explanation":"Theo Sơ đồ 10.1 (Tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light): Khi người bệnh không có cải thiện triệu chứng sau thời gian theo dõi/điều trị -> Bước tiếp theo là \"Xem xét soi màng phổi hoặc sinh thiết màng phổi mở\"."},{"number":95,"answer":"A","question":"Trong tràn dịch màng phổi, đặc điểm chẩn đoán tế bào học, chọn Câu sai:","options":[{"label":"A","text":"Kỹ thuật khối tế bào (cell-block) không làm tăng khả năng chẩn đoán nguyên nhân ác tính. ."},{"label":"B","text":"Đòi hỏi người đọc tiêu bản phải có kinh nghiệm vì tế bào màng phổi có thể chuyển dạng tạo hình ảnh giống ác tính. ."},{"label":"C","text":"Sự hiện diện tế bào bất thường trong dịch màng phổi có khả năng chẩn đoán thấp do phụ thuộc mức độ lan rộng và loại tế bào ung thư. ."},{"label":"D","text":"Mọi bệnh nhân tràn dịch màng phổi dịch tiết nên được xét nghiệm tế bào học dịch màng phổi. ."}],"explanation":"Kỹ thuật khối tế bào (Cell-block) kết hợp với nhuộm hóa mô miễn dịch làm TĂNG ĐÁNG KỂ tỷ lệ chẩn đoán xác định và phân loại chính xác bản chất ung thư trong tràn dịch màng phổi ác tính so với phết tế bào thông thường."},{"number":96,"answer":"C","question":"Đối với tràn dịch màng phổi dịch tiết, trường hợp nghi ngờ lao và ung thư màng phổi, cần chẩn đoán mô bệnh học thông qua kỹ thuật nào:","options":[{"label":"A","text":"Sinh thiết màng phổi mù ."},{"label":"B","text":"Nội soi màng phổi ."},{"label":"C","text":"(A), (B) đúng ."},{"label":"D","text":"(A), (B) sai. ."}],"explanation":"Cả hai kỹ thuật Sinh thiết màng phổi mù qua thành ngực (bằng kim Ramel/Veen-Silverman) và Nội soi màng phổi (ống cứng/ống mềm) sinh thiết đều giúp lấy bệnh phẩm mô màng phổi làm xét nghiệm mô bệnh học chẩn đoán lao và ung thư màng phổi."},{"number":97,"answer":"B","question":"Bệnh nhân xơ gan, đã loại trừ viêm phổi nếu nuôi cấy dịch màng phổi dương tính vi khuẩn và có số lượng bạch cầu trung tính > 250 tế bào/mm³ hoặc nuôi cấy âm tính và số lượng bạch cầu trung tính > 500 tế bào/mm³ thì nghĩ đến vấn đề gì:","options":[{"label":"A","text":"Viêm màng phổi phản ứng. ."},{"label":"B","text":"Viêm màng phổi do vi khuẩn. ."},{"label":"C","text":"Tràn dịch màng phổi cận viêm. ."},{"label":"D","text":"Tràn dịch màng phổi dịch thấm ."}],"explanation":"Tiêu chuẩn chẩn đoán Viêm màng phổi tự phát do vi khuẩn (Spontaneous Bacterial Empyema) ở bệnh nhân xơ gan có tràn dịch màng phổi: Cấy dịch màng phổi dương tính VÀ bạch cầu đa nhân trung tính (PMN) > 250 tế bào/mm3; HOẶC cấy âm tính nhưng PMN > 500 tế bào/mm3 (sau khi đã loại trừ viêm phổi thứ phát)."},{"number":98,"answer":"C","question":"Tràn dịch màng phổi do lao có cơ chế: (1) trực khuẩn lao xâm nhập vào khoang màng phổi bằng đường máu hoặc đường bạch huyết gây kích thích miễn dịch trung gian tế bào. (2) các ổ hoặc hang có bã đậu nằm dưới màng phổi vỡ vào khoang màng phổi gây ra mủ màng phổi do lao.","options":[{"label":"A","text":"(1) đúng, (2) sai ."},{"label":"B","text":"(1) sai, (2) đúng ."},{"label":"C","text":"(1) đúng, (2) đúng ."},{"label":"D","text":"(1) sai, (2) sai ."}],"explanation":"Cả hai cơ chế trên đều đúng. Cơ chế (1) giải thích cho thể lao màng phổi dịch tiết thanh tơ (vàng chanh) phổ biến do phản ứng quá mẫn muộn; Cơ chế (2) giải thích cho thể tràn mủ màng phổi do lao do vỡ trực tiếp ổ bã đậu vào khoang màng phổi."},{"number":99,"answer":"D","question":"Tính chất tràn dịch màng phổi cận viêm:","options":[{"label":"A","text":"Số lượng tế bào từ 500 – 100 tế bào/mm³ với lympho > 70%, tế bào biểu mô < 5% ."},{"label":"B","text":"Dịch tiết, ADA ở ngưỡng chẩn đoán từ 40 – 60 UI/L ."},{"label":"C","text":"Xét nghiệm mô bệnh học có giá trị quyết định chẩn đoán ."},{"label":"D","text":"Cấy dịch màng phổi có thể dương tính ."}],"explanation":"Tràn dịch màng phổi cận viêm (phát triển từ viêm phổi do vi khuẩn) là dịch tiết, giàu bạch cầu đa nhân trung tính, và nuôi cấy dịch màng phổi có thể tìm thấy vi khuẩn gây bệnh dương tính. (A, B, C là đặc điểm điển hình của lao màng phổi)."},{"number":100,"answer":"B","question":"Trong sơ đồ tiếp cận điều trị tràn dịch màng phổi do ung thư, sau khi đánh giá bệnh nhân có khả năng sống hơn 1 tuần thì cần làm gì tiếp theo:","options":[{"label":"A","text":"Đặt catheter đường hầm màng phổi ."},{"label":"B","text":"Gây dày dính màng phổi ."},{"label":"C","text":"Tìm nguyên nhân khác gây khó thở ."},{"label":"D","text":"Điều trị giảm nhẹ ."}],"explanation":"Theo sơ đồ tiếp cận điều trị tràn dịch màng phổi do ung thư: Sau khi đánh giá tiên lượng sống của bệnh nhân (nếu khả năng sống > 1 tháng / vài tuần và phổi còn giãn nở tốt) -> Chỉ định Gây dính màng phổi (bằng bột talc/bleomycin) hoặc đặt ống catheter đường hầm màng phổi IPC để kiểm soát tái lập dịch."}]},{"name":"Đề gom 80 câu","questions":[{"number":1,"question":"Phát biểu đúng về enzyme ức chế proteinase trong cơ chế bệnh sinh của bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"Giải phóng từ bạch cầu đa nhân"},{"label":"B","text":"Giải phóng từ đại thực bào"},{"label":"C","text":"Tác dụng giáng hoá protein của tổ chức gian bào"},{"label":"D","text":"Có tác dụng bảo vệ đường hô hấp"}],"answer":"D"},{"number":2,"question":"Hậu quả của việc giảm oxy và tăng CO2 máu trong bệnh phổi tắc nghẽn mạn tính là do, NGOẠI TRỪ:","options":[{"label":"A","text":"Tắc nghẽn đường hô hấp dưới"},{"label":"B","text":"Phá huỷ cấu trúc nhu mô phổi"},{"label":"C","text":"Bất thường cấu trúc mạch máu phổi"},{"label":"D","text":"Giảm kích thích trung tâm hô hấp"}],"answer":"D"},{"number":3,"question":"Tình trạng tăng áp động mạch phổi ở bệnh phổi tắc nghẽn mạn tính xuất hiện khi giảm oxy máu:","options":[{"label":"A","text":"< 80mmHg"},{"label":"B","text":"< 60mmHg"},{"label":"C","text":"< 55mmHg"},{"label":"D","text":"< 50mmHg"}],"answer":"B"},{"number":4,"question":"Bệnh nhân bệnh phổi tắc nghẽn mạn tính, kết quả hô hấp ký sau test hồi phục phế quản FEV1/FVC = 0,62 và FEV1 84%. Hãy kết luận giai đoạn bệnh:","options":[{"label":"A","text":"GOLD 1"},{"label":"B","text":"GOLD 2"},{"label":"C","text":"GOLD 3"},{"label":"D","text":"GOLD 4"}],"answer":"A"},{"number":5,"question":"Liệu pháp thuốc nào có vai trò chính trong kiểm soát triệu chứng COPD giai đoạn ổn định?","options":[{"label":"A","text":"Thuốc giảm đau."},{"label":"B","text":"Thuốc giãn phế quản."},{"label":"C","text":"Thuốc tăng huyết áp."},{"label":"D","text":"Thuốc chống trầm cảm."}],"answer":"B"},{"number":6,"question":"Chọn lựa kháng sinh đầu tiên điều trị đợt cấp bệnh phổi tắc nghẽn mạn tính mức độ nhẹ:","options":[{"label":"A","text":"Betalactam"},{"label":"B","text":"Betalactam/kháng betalactamase"},{"label":"C","text":"Fluoroquinolon"},{"label":"D","text":"Phối hợp fluoroquinolon + Cephalosporin"}],"answer":"A"},{"number":7,"question":"Chỉ định tiêm ngừa nào là ưu tiên cho bệnh nhân COPD?","options":[{"label":"A","text":"Vắc xin viêm gan."},{"label":"B","text":"Vắc xin thủy đậu."},{"label":"C","text":"Vắc xin cúm."},{"label":"D","text":"Vắc xin sốt rét."}],"answer":"C"},{"number":8,"question":"Tiêu chuẩn ngưng theo dõi điều trị đợt cấp bệnh phổi tắc nghẽn mạn tính nội trú, NGOẠI TRỪ:","options":[{"label":"A","text":"Nhu cầu sử dụng beta 2 hít <6 lần/ngày"},{"label":"B","text":"Có thể trở lại các sinh hoạt như trước đợt cấp"},{"label":"C","text":"Lâm sàng ổn định trong 24h"},{"label":"D","text":"Khí máu động mạch trở về bình thường"}],"answer":"D"},{"number":9,"question":"Dựa vào pK/pD, người ta chia kháng sinh thành bao nhiêu nhóm:","options":[{"label":"A","text":"1 nhóm"},{"label":"B","text":"2 nhóm"},{"label":"C","text":"3 nhóm"},{"label":"D","text":"4 nhóm"}],"answer":"C"},{"number":10,"question":"Thuật ngữ Viêm phổi cộng đồng, Viêm phổi bệnh viện, Viêm phổi liên quan tới chăm sóc y tế, Viêm phổi thở máy là để:","options":[{"label":"A","text":"Chỉ tình trạng nặng hay nhẹ của viêm phổi"},{"label":"B","text":"Chỉ điều kiện y tế cần chăm sóc đặc biệt"},{"label":"C","text":"Để định hướng tác nhân vi sinh gây bệnh"},{"label":"D","text":"Để phân loại bệnh học viêm phổi"}],"answer":"C"},{"number":11,"question":"Các yếu tố nguy cơ nhiễm P.aeruginosa đề kháng kháng sinh ở bệnh nhân viêm phổi cộng đồng bao gồm:","options":[{"label":"A","text":"Tiền sử đã nhiễm tụ cầu kháng Methicilline"},{"label":"B","text":"Tiền sử đã nhiễm phế cầu kháng Penicilline"},{"label":"C","text":"Nhiễm trùng da tái diễn"},{"label":"D","text":"Có bệnh cấu trúc phổi"}],"answer":"D"},{"number":12,"question":"Tác nhân vi sinh không điển hình trong bệnh viêm phổi. CHỌN CÂU SAI:","options":[{"label":"A","text":"Mycoplasma pneumoniae"},{"label":"B","text":"Chlamydia pneumoniae"},{"label":"C","text":"Haemophilus influenzae"},{"label":"D","text":"Legionella pneumophila"}],"answer":"C"},{"number":13,"question":"Chọn đáp án đúng: “ Viêm phổi là tình trạng ..(1).. của ..(2).. bao gồm viêm phế nang, ống và túi phế nang, tiểu phế quản tận hoặc viêm tổ chức kẽ của phổi.","options":[{"label":"A","text":"(1) viêm, (2) cấu trúc phổi"},{"label":"B","text":"(1) nhiễm trùng, (2) cấu trúc phổi"},{"label":"C","text":"(1) viêm, (2) nhu mô phổi"},{"label":"D","text":"(1) nhiễm trùng, (2) nhu mô phổi"}],"answer":"C"},{"number":14,"question":"Chọn 1 Câu đúng trong những Câu trả lời sau đây: Thuật ngữ điều trị kháng sinh kinh nghiệm dùng để chỉ:","options":[{"label":"A","text":"Điều trị kháng sinh theo kinh nghiệm của thầy thuốc lâm sàng"},{"label":"B","text":"Điều trị kháng sinh theo khuyến cáo dựa trên bằng chứng y học"},{"label":"C","text":"Điều trị kháng sinh không dựa trên xét nghiệm vi sinh"},{"label":"D","text":"Điều trị kháng sinh dựa trên vi khuẩn gây bệnh phổ biến tại địa phương"}],"answer":"C"},{"number":15,"question":"Theo Bộ Y Tế Việt Nam 2026, liều Ertapenem được khuyến cáo sử dụng trong điều trị viêm phổi cộng đồng là:","options":[{"label":"A","text":"2g TMC/8h"},{"label":"B","text":"1g TTM/ngày"},{"label":"C","text":"400mg TTM/8h"},{"label":"D","text":"500mg TM/12h"}],"answer":"B"},{"number":16,"question":"Bệnh nhân viêm phổi cộng đồng dị ứng với kháng sinh betalactam, sự lựa chọn kháng sinh thay thế được khuyến cáo là:","options":[{"label":"A","text":"Macrolide"},{"label":"B","text":"Fluoroquinolone"},{"label":"C","text":"Aminoglycosid"},{"label":"D","text":"Cephalosporin"}],"answer":"B"},{"number":17,"question":"Về dịch tể học viêm phổi bệnh viện, chọn Câu sai:","options":[{"label":"A","text":"Nhiễm trùng bệnh viện gây tử vong cao nhất và kéo dài thời gian nằm viện"},{"label":"B","text":"Sự đề kháng kháng sinh của các vi khuẩn gây viêm phổi bệnh viện là một vấn đề nghiêm trọng"},{"label":"C","text":"Các vi khuẩn họ Enterobacteriacae sinh ESBL và Carbapenemase gây đề kháng nhiều kháng sinh carbapenem"},{"label":"D","text":"MRSA cũng có khả năng kháng với betalactam và carbapenem chiếm tỉ lệ 50 – 60%"}],"answer":"C"},{"number":18,"question":"Trong điều trị viêm phổi bệnh viện, liều Colistimethate cho 1 người 60 kg được tính như sau: (1) Liều tải Colistin = 4 x 60 kg = 240 mg CBA(colistin base activity) = 7.200.000 IU colistimethate (2) Liều duy trì = 2,5 mg CBA/kg = 30.000 x 2,5 x 60 kg = 4.500.000 IU colistimethate","options":[{"label":"A","text":"(1) đúng, (2) sai"},{"label":"B","text":"(2) đúng, (1) sai"},{"label":"C","text":"(1) đúng, (2) đúng"},{"label":"D","text":"(1) sai, (2) sai"}],"answer":"C"},{"number":19,"question":"Các yếu tố nguy cơ viêm phổi hít là, NGOẠI TRỪ:","options":[{"label":"A","text":"Đặt nội khí quản."},{"label":"B","text":"Dùng thuốc an thần liều cao."},{"label":"C","text":"Phẫu thuật ngực – bụng."},{"label":"D","text":"Thời gian điều trị nội trú kéo dài."}],"answer":"D"},{"number":20,"question":"Phương pháp cấy định lượng chất tiết đường hô hấp dưới qua kỹ thuật nội soi phế quản với chất tiết nội khí quản yêu cầu có ngưỡng vi khuẩn là:","options":[{"label":"A","text":"> 1 x 106 CFU/ml"},{"label":"B","text":"> 1 x 105 CFU/ml"},{"label":"C","text":"> 1 x 104 CFU/ml"},{"label":"D","text":"> 1 x 103 CFU/ml"}],"answer":"A"},{"number":21,"question":"Về hình ảnh học của HAP, hình ảnh tổn thương dạng nốt (kích thước từ vài mm đến vài cm), không đồng nhất, bờ mờ, không đều, có thể lan toả 2 bên kèm tràn dịch màng phổi, thường gặp do:","options":[{"label":"A","text":"Staphylococcus aureus."},{"label":"B","text":"Streptococcus pneumoniae."},{"label":"C","text":"Pseudomonas aeruginosA."},{"label":"D","text":"Acinetobacter baumannii."}],"answer":"A"},{"number":22,"question":"Chẩn đoán Viêm phổi bệnh viện theo CDC, về triệu chứng hô hấp, chọn Câu sai:","options":[{"label":"A","text":"Xuất hiện kéo dài: đàm mủ, thay đổi màu đàm, tăng tiết đàm."},{"label":"B","text":"Mới xuất hiện hoặc xấu đi: ho, khó thở, nhịp tim nhanh."},{"label":"C","text":"Tiếng ran hoặc tiếng thở phế quản."},{"label":"D","text":"Tình trạng oxy máu xấu đi, PaO2/FiO2 ≤ 240/cần tăng oxy/cần thở máy."}],"answer":"A"},{"number":23,"question":"Bệnh nhân nữ, 65 tuổi, vào viện vì đau ngực, được chẩn đoán nhồi máu cơ tim cấp. Sau 3 ngày điều trị, bệnh nhân tăng khó thở, thở khò khè, ho, đàm đục. Nên ưu tiên làm cận lâm sàng gì cho bệnh nhân:","options":[{"label":"A","text":"Xét nghiệm lại Troponin Ths"},{"label":"B","text":"Chụp Xquang ngực thẳng."},{"label":"C","text":"Xét nghiệm công thức máu, CRP, PCT."},{"label":"D","text":"Chụp CT scan ngực (có cản quang)."}],"answer":"B"},{"number":24,"question":"Bệnh nhân nam, 67 tuổi, vào viện đợt cấp COPD, sau thở máy 3 ngày bệnh nhân có biểu hiện tăng nhiệt độ 390C, đàm đục, thở 28 l/ph, mạch 110 l/ph, bạch cầu máu 15.000/mm3 , CRP = 15 mg/dl, SpO2 = 88% (FiO2: 40%), Xquang ngực có thâm nhiễm khu trú đáy phổi (P). Điều trị kháng sinh kinh nghiệm cho bệnh nhân:","options":[{"label":"A","text":"Ceftazidime 2g IV q8h + Amikacin 15-20 mg/kg IV"},{"label":"B","text":"Amikacin 15-20 mg/kg IV + Vancomycin 15mg/kg IV q8-12h"},{"label":"C","text":"Gentamicin 5-7 mg/kg IV + Linezolid 600mg IV q12h"},{"label":"D","text":"Ceftriaxone 2g IV q24h + Linezolid 600mg IV q12h"}],"answer":"A"},{"number":25,"question":"Bệnh nhân tràn khí màng phổi/COPD thuộc phân loại tràn khí màng phổi nào:","options":[{"label":"A","text":"Tràn khí màng phổi tự phát nguyên phát"},{"label":"B","text":"Tràn khí màng phổi tự phát thứ phát"},{"label":"C","text":"Tràn khí màng phổi do cơ học"},{"label":"D","text":"Tràn khí màng phổi do chấn thương"}],"answer":"B"},{"number":26,"question":"Khám thực thể bệnh nhân tràn khí màng phổi áp lực, chọn câu sai:","options":[{"label":"A","text":"Không có biểu hiện suy hô hấp mức độ từ nhẹ đến nặng do sự tích tụ dần không khí trong khoang màng phổi."},{"label":"B","text":"Ảnh hưởng đến cung lượng tim, gây hạ huyết áp và thiếu oxy đe dọa tính mạng."},{"label":"C","text":"Bệnh nhân không có tiếng thở ở vùng bị ảnh hưởng, lệch khí quản sang một bên, nhịp tim nhanh và căng giãn tĩnh mạch."},{"label":"D","text":"Bệnh nhân có thể ở tình trạng trụy mạch, ngừng tim, nếu không được cấp cứu kịp thời bệnh nhân có thể tử vong nhanh chóng."}],"answer":"A"},{"number":27,"question":"Đặc điểm hình ảnh Xquang ngực điển hình của tràn khí màng phổi, chọn câu sai:","options":[{"label":"A","text":"Hội chứng khí phế thủng"},{"label":"B","text":"Không có hình ảnh mạch máu"},{"label":"C","text":"Thấy rõ bờ màng phổi tạng"},{"label":"D","text":"Nhu mô phổi thu nhỏ về rốn phổi"}],"answer":"A"},{"number":28,"question":"Nếu nghi ngờ bệnh nhân có bóng khí hoặc u nang, phân biệt với tràn khí màng phổi có dính màng phổi nên làm gì:","options":[{"label":"A","text":"Chụp Xquang ngực nghiêng"},{"label":"B","text":"Chụp CT scan ngực"},{"label":"C","text":"Siêu âm màng phổi"},{"label":"D","text":"Đo chức năng hô hấp"}],"answer":"B"},{"number":29,"question":"Dùng bột Talc y tế tinh khiết phun vào khoang màng phổi giúp giảm tỷ lệ tái phát tràn khí màng phổi:","options":[{"label":"A","text":"20%"},{"label":"B","text":"30%"},{"label":"C","text":"40%"},{"label":"D","text":"50%"}],"answer":"D"},{"number":30,"question":"Chỉ định đặt ống dẫn lưu khoang màng phổi trong trường hợp tràn khí màng phổi nào, chọn Câu sai:","options":[{"label":"A","text":"tràn khí màng phổi tự phát lượng nhiều"},{"label":"B","text":"tràn khí màng phổi tự phát nguyên phát"},{"label":"C","text":"tràn khí màng phổi do chấn thương"},{"label":"D","text":"tràn khí màng phổi 2 bên"}],"answer":"B"},{"number":31,"question":"Điều trị bảo tồn nội khoa và theo dõi nội viện, chụp kiểm tra Xquang ngực thẳng mỗi ngày là hướng xử trí ở bệnh nhân tràn khí màng phổi như thế nào, chọn câu sai:","options":[{"label":"A","text":"TKMP lượng nhiều"},{"label":"B","text":"Bệnh nhân không khó thở"},{"label":"C","text":"Bệnh nhân huyết động ổn định"},{"label":"D","text":"Kích thước khoang TKMP không tăng lên sau 6 – 8 giờ"}],"answer":"A"},{"number":32,"question":"Nếu hết tràn khí màng phổi thì sau bao lâu nên rút kim dẫn lưu khí:","options":[{"label":"A","text":"rút kim ngay"},{"label":"B","text":"sau 6 giờ"},{"label":"C","text":"sau 12 giờ"},{"label":"D","text":"sau 24 giờ"}],"answer":"D"},{"number":33,"question":"Trong sơ đồ tiếp cận điều trị tràn dịch màng phổi cận viêm, khi xác định chọc dịch màng phổi không loại bỏ được hết dịch thì cần làm gì tiếp theo:","options":[{"label":"A","text":"Xác định yếu tố tiên lượng xấu có không"},{"label":"B","text":"Hội chẩn bác sĩ phẩu thuật phổi và lồng ngực"},{"label":"C","text":"Đặt ống dẫn lưu lồng ngực"},{"label":"D","text":"Đánh giá dịch màng phổi tái lập như thế nào"}],"answer":"A"},{"number":34,"question":"Dịch màng phổi được thành lập từ các thay đổi sau, CHỌN CÂU SAI:","options":[{"label":"A","text":"Giảm dịch kẽ trong phổi: suy thất trái, viêm phổi và thuyên tắc phổi"},{"label":"B","text":"Tăng áp lực thủy tĩnh mao mạch trong màng phổi: suy thất phải hoặc trái, hội chứng tĩnh mạch chủ trên"},{"label":"C","text":"Tăng tính thấm của mao mạch màng phổi: viêm màng phổi"},{"label":"D","text":"Giảm áp lực trong khoang màng phổi: xẹp phổi hoặc tăng độ đàn hồi của phổi"}],"answer":"A"},{"number":35,"question":"Dịch màng phổi do Lao KHÔNG CÓ đặc điểm sau:","options":[{"label":"A","text":"Thường có màu vàng chanh hơn là mủ."},{"label":"B","text":"Tái lập nhanh do liên quan đến phản ứng miễn dịch quá đáng."},{"label":"C","text":"Dịch có thể hết cả khi không điều trị."},{"label":"D","text":"Rất giàu trực khuẩn lao trong dịch."}],"answer":"D"},{"number":36,"question":"Trong sơ đồ tiếp cận điều trị tràn dịch màng phổi cận viêm, khi xác định bệnh nhân có khả năng phẩu thuật màng phổi tốt thì cần làm gì tiếp theo:","options":[{"label":"A","text":"Xem xét VATS sớm"},{"label":"B","text":"Siêu âm lồng ngực lại"},{"label":"C","text":"Đặt ống dẫn lưu lồng ngực 14-F"},{"label":"D","text":"Xem xét t-PA-Dnase"}],"answer":"A"},{"number":37,"question":"Về đặc điểm siêu âm màng phổi trong tràn dịch màng phổi, chọn Câu sai:","options":[{"label":"A","text":"Giúp phát hiện tràn dịch khu trú, phân biệt tràn dịch với dày dính màng phổi và hướng dẫn chọc dò màng phổi trong những trường hợp khó."},{"label":"B","text":"Đo thể tích dịch màng phổi bằng siêu âm được cho là chính xác hơn phương pháp đo bằng X quang tư thế nằm."},{"label":"C","text":"Với siêu âm, thể tích dịch màng phổi được thấy là tương quan với độ tách biệt của 2 lá màng phổi."},{"label":"D","text":"Có thể ước tính lượng dịch có thể rút ra được bằng cách lấy khoảng cách lớn nhất giữa lá tạng và lá thành (đo ở mặt cắt ngang) nhân với 10."}],"answer":"D"},{"number":38,"question":"Chỉ định điều trị kháng sinh trong viêm mủ màng phổi:","options":[{"label":"A","text":"Phải chỉ định sớm ngay khi phát hiện mủ màng phổi"},{"label":"B","text":"Phải chờ kết quả cấy vi trùng và kháng sinh đồ"},{"label":"C","text":"Có thể dùng tạm kháng sinh đường uống để chờ kết quả cấy vi trùng"},{"label":"D","text":"Chỉ đưa kháng sinh điều trị tại chỗ màng phổi"}],"answer":"A"},{"number":39,"question":"Trong sơ đồ tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light, sau khi thực hiện chọc dịch màng phổi chẩn đoán với kết luận dịch tiết thì bác sĩ làm gì tiếp theo:","options":[{"label":"A","text":"Tiến hành các kỹ thuật chẩn đoán sâu hơn"},{"label":"B","text":"Điều trị suy tim, xơ gan, bệnh thận"},{"label":"C","text":"Không làm gì thêm để chẩn đoán"},{"label":"D","text":"Nội soi màng phổi hoặc sinh thiết màng phổi"}],"answer":"A"},{"number":40,"question":"Trong sơ đồ tiếp cận tràn dịch màng phổi (TDMP) theo tiêu chuẩn Light, sau khi theo dõi người bệnh không cải thiện triệu chứng TDMP thì bác sĩ cần làm gì tiếp theo:","options":[{"label":"A","text":"Tiếp tục tiến hành lại các kỹ thuật chẩn đoán TDMP"},{"label":"B","text":"Xem xét soi màng phổi hoặc sinh thiết màng phổi"},{"label":"C","text":"Xét nghiệm dịch màng phổi tìm lao"},{"label":"D","text":"Điều trị thuyên tắc phổi"}],"answer":"B"},{"number":41,"question":"Trong viêm phổi thuỳ, theo mô tả của Laennec, giai đoạn sung huyết là:","options":[{"label":"A","text":"Tổ chức phổi bị thương tổn có màu đỏ sẫm và chắc như gan, trong tổ chức này có thể có xuất huyết"},{"label":"B","text":"Thương tổn phổi có màu nâu xám chứa hồng cầu, bạch cầu, vi khuẩn và tổ chức hoại tử"},{"label":"C","text":"Các mao mạch thành phế nang giãn ra, hồng cầu, bạch cầu và fibrin thoát vào trong lòng phế nang"},{"label":"D","text":"Phế nang còn ít dịch loãng, có ít bạch cầu"}],"answer":"C"},{"number":42,"question":"Thuật ngữ Viêm phổi cộng đồng, Viêm phổi bệnh viện, Viêm phổi liên quan tới chăm sóc y tế, Viêm phổi thở máy là để:","options":[{"label":"A","text":"Chỉ tình trạng nặng hay nhẹ của viêm phổi"},{"label":"B","text":"Để định hướng tác nhân vi sinh gây bệnh"},{"label":"C","text":"Chỉ điều kiện y tế cần chăm sóc đặc biệt"},{"label":"D","text":"Để phân loại bệnh học viêm phổi"}],"answer":"B"},{"number":43,"question":"Chọn 1 Câu sai trong những trả lời sau đây: Chẩn đoán và đánh giá viêm phổi ở cộng đồng","options":[{"label":"A","text":"Xquang ngực là cần thiết khi chẩn đoán viêm phổi ở cộng đồng"},{"label":"B","text":"Trên người trẻ tiền sử khỏe mạnh, với bệnh cảnh nhiễm trùng hô hấp cấp tính có triệu chứng thực thể phổi có thể chẩn đoán viêm phổi không cần chụp Xquang ngực nếu điều trị ngoài bệnh viện."},{"label":"C","text":"Cần xét nghiệm công thức máu và Xquang ngực thẳng cho tất cả các trường hợp chẩn đoán viêm phổi ở cộng đồng"},{"label":"D","text":"Không cần xét nghiệm ure máu cho tất cả các trường hợp chẩn đoán viêm phổi ở cộng đồng."}],"answer":"C"},{"number":44,"question":"Tác nhân nào sau đây KHÔNG phải là nguyên nhân gây viêm phổi cộng đồng:","options":[{"label":"A","text":"Streptococcus pneumoniae"},{"label":"B","text":"Haemophilus influenzae"},{"label":"C","text":"Mycobacterium tuberculosis"},{"label":"D","text":"Klebsiella pneumonia"}],"answer":"C"},{"number":45,"question":"Các yếu tố nguy cơ nhiễm P.aeruginosa đề kháng kháng sinh ở bệnh nhân viêm phổi cộng đồng bao gồm:","options":[{"label":"A","text":"Tiền sử đã nhiễm tụ cầu kháng Methicilline"},{"label":"B","text":"Tiền sử đã nhiễm phế cầu kháng Penicilline"},{"label":"C","text":"Có bệnh cấu trúc phổi"},{"label":"D","text":"Nhiễm trùng da tái diễn"}],"answer":"C"},{"number":46,"question":"Chọn 1 Câu đúng trong những Câu trả lời sau đây: Thuật ngữ điều trị kháng sinh kinh nghiệm dùng để chỉ:","options":[{"label":"A","text":"Điều trị kháng sinh theo kinh nghiệm của thầy thuốc lâm sàng"},{"label":"B","text":"Điều trị kháng sinh theo khuyến cáo dựa trên bằng chứng y học"},{"label":"C","text":"Điều trị kháng sinh dựa trên vi khuẩn gây bệnh phổ biến tại địa phương"},{"label":"D","text":"Điều trị kháng sinh không dựa trên xét nghiệm vi sinh"}],"answer":"D"},{"number":47,"question":"Hình ảnh Xquang ngực sau phù hợp thể viêm phổi nào ” đám mờ hình tam giác hoặc hình thang có đáy hướng ra ngoài thành ngực, thường khu trú ở thuỳ giữa và dưới, bên phải nhiều hơn bên trái, bên trong có hình ảnh phế quản hơi, không phì đại hạch rốn phổi”:","options":[{"label":"A","text":"Viêm phổi thùy"},{"label":"B","text":"Phế quản phế viêm"},{"label":"C","text":"Viêm phổi mô kẽ"},{"label":"D","text":"Viêm phổi không điển hình"}],"answer":"A"},{"number":48,"question":"Sự phối hợp kháng sinh nào được khuyến cáo trong điều trị viêm phổi cộng đồng nguy cơ nặng:","options":[{"label":"A","text":"Macrolide mới + Beta lactam"},{"label":"B","text":"Beta lactam + Aminoglycosid"},{"label":"C","text":"Beta lactam + fluoroquinolone"},{"label":"D","text":"Cephalosporin + fluoroquinolone"}],"answer":"C"},{"number":49,"question":"Về dịch tể học viêm phổi bệnh viện, chọn Câu sai:","options":[{"label":"A","text":"Nhiễm trùng bệnh viện gây tử vong cao nhất và kéo dài thời gian nằm viện"},{"label":"B","text":"Các vi khuẩn họ Enterobacteriacae sinh ESBL gây đề kháng nhiều kháng sinh carbapenem"},{"label":"C","text":"Sự đề kháng kháng sinh của các vi khuẩn gây viêm phổi bệnh viện là một vấn đề nghiêm trọng"},{"label":"D","text":"MRSA cũng có khả năng kháng với betalactam và Carbapenem chiếm tỉ lệ 50 – 60%"}],"answer":"B"},{"number":50,"question":"Đặt nội khí quản thở máy là yếu tố nguy cơ quan trọng nhất của viêm phổi bệnh viện vì gây, ngoại trừ:","options":[{"label":"A","text":"Thay đổi pH dạ dày"},{"label":"B","text":"Trở ngại nuốt chất tiết"},{"label":"C","text":"Nơi chứa vi khuẩn"},{"label":"D","text":"Máy thở và dụng cụ bị nhiễm"}],"answer":"A"},{"number":51,"question":"Khi quyết định điều trị kháng sinh kinh nghiệm trong VPBV thì yếu tố nào là quan trọng nhất để đối phó với vi khuẩn kháng thuốc:","options":[{"label":"A","text":"Kết quả nuôi cấy trước đó"},{"label":"B","text":"Sử dụng kháng sinh trước đó"},{"label":"C","text":"Thời gian nằm trong bệnh viện (hay thở máy)"},{"label":"D","text":"Tình trạng suy giảm miễn dịch và đặc điểm kháng thuốc thông thường của vi sinh gây bệnh tại cơ sở điều trị"}],"answer":"C"},{"number":52,"question":"Về lâm sàng của viêm phổi bệnh viện, tính phổ biến của tác nhân vi sinh phụ thuộc vào các yếu tố, NGOẠI TRỪ:","options":[{"label":"A","text":"Tình trạng miễn dịch của người bệnh."},{"label":"B","text":"Thời gian khởi phát."},{"label":"C","text":"Các nguy cơ nhiễm khuẩn đặc biệt."},{"label":"D","text":"Các yếu tố nguy cơ nhiễm vi khuẩn đa kháng."}],"answer":"C"},{"number":53,"question":"Bệnh nhân nam, 67 tuổi, vào viện đợt cấp COPD, sau thở máy 3 ngày bệnh nhân có biểu hiện tăng nhiệt độ 390C, đàm đục, thở 28 l/ph, mạch 110 l/ph, bạch cầu máu 15.000/mm3 , CRP = 15 mg/dl, SpO2 = 88% (FiO2: 40%), Xquang ngực có thâm nhiễm khu trú đáy phổi (P). Điều trị kháng sinh kinh nghiệm cho bệnh nhân:","options":[{"label":"A","text":"Ceftazidime 2g IV q8h + Ciprofloxacin 400mg IV q8h"},{"label":"B","text":"Amikacin 15-20 mg/kg IV + Vancomycin 15mg/kg IV q8-12h"},{"label":"C","text":"Gentamicin 5-7 mg/kg IV + Linezolid 600mg IV q12h"},{"label":"D","text":"Ceftriaxone 2g IV q24h + Linezolid 600mg IV q12h"}],"answer":"A"},{"number":54,"question":"Chẩn đoán Viêm phổi bệnh viện theo CDC, về triệu chứng hô hấp, chọn Câu sai:","options":[{"label":"A","text":"Mới xuất hiện hoặc xấu đi: ho, khó thở, nhịp tim nhanh."},{"label":"B","text":"Tiếng ran hoặc tiếng thở phế quản."},{"label":"C","text":"Xuất hiện kéo dài: đàm mủ, thay đổi màu đàm, tăng tiết đàm."},{"label":"D","text":"Tình trạng oxy máu xấu đi, PaO2/FiO2 ≤ 240/cần tăng oxy/cần thở máy."}],"answer":"C"},{"number":55,"question":"Bệnh nhân nữ, 65 tuổi, vào viện vì đau ngực, được chẩn đoán nhồi máu cơ tim cấp. Sau 3 ngày điều trị, bệnh nhân tăng khó thở, thở khò khè, ho, đàm đục. Nên ưu tiên làm cận lâm sàng gì cho bệnh nhân:","options":[{"label":"A","text":"Xét nghiệm lại Troponin Ths"},{"label":"B","text":"Xét nghiệm công thức máu, CRP, PCT."},{"label":"C","text":"Chụp Xquang ngực thẳng."},{"label":"D","text":"Chụp CT scan ngực (có cản quang)."}],"answer":"C"},{"number":56,"question":"Vi khuẩn thường gặp trong viêm phổi thở máy xuất hiện muộn và kháng nhiều loại -lactam là:","options":[{"label":"A","text":"Staphylococcus aureus."},{"label":"B","text":"Streptococcus pneumoniae."},{"label":"C","text":"Acinetobacter baumannii."},{"label":"D","text":"Pseudomonas aeruginosa."}],"answer":"D"},{"number":57,"question":"Vai trò của đại thực bào trong cơ chế bệnh sinh bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"Tiết ra Neutrophil elastase, Neutrophil cathepsin G và Neutrophil proteinase-3"},{"label":"B","text":"Giải phóng perforin, granzym B và TNF-α"},{"label":"C","text":"Giải phóng các chất oxy hoá, oxit nitơ, yếu tố hoại tử u (TNF- α), IL-8, LTB-4"},{"label":"D","text":"Tiết ra các anti -proteinase"}],"answer":"C"},{"number":58,"question":"Tình trạng tăng áp động mạch phổi ở bệnh phổi tắc nghẽn mạn tính xuất hiện khi giảm oxy máu:","options":[{"label":"A","text":"< 65mmHg"},{"label":"B","text":"< 60mmHg"},{"label":"C","text":"< 55mmHg"},{"label":"D","text":"< 50mmHg"}],"answer":"B"},{"number":59,"question":"Bệnh nhân nam, 60 tuổi, được chẩn đoán bệnh phổi tắc nghẽn mạn tính FEV1 78%, nhóm B. Đánh giá triệu chứng/nguy cơ đợt kịch phát của bệnh nhân này:","options":[{"label":"A","text":"Ít triệu chứng, nguy cơ thấp"},{"label":"B","text":"Ít triệu chứng, nguy cơ cao"},{"label":"C","text":"Nhiều triệu chứng, nguy cơ thấp"},{"label":"D","text":"Nhiều triệu chứng, nguy cơ cao"}],"answer":"C"},{"number":60,"question":"Vi khuẩn gây bệnh phổ biến trong đợt cấp bệnh phổi tắc nghẽn mạn tính ngoại trú, NGOẠI TRỪ:","options":[{"label":"A","text":"Streptococcus pneumoniae"},{"label":"B","text":"Mycoplasma catarrhalis"},{"label":"C","text":"Haemophilus influenzae"},{"label":"D","text":"Speudomonas.aeruginosa"}],"answer":"D"},{"number":61,"question":"Liệu pháp thuốc nào có vai trò chính trong kiểm soát triệu chứng COPD giai đoạn ổn định?","options":[{"label":"A","text":"Thuốc kháng viêm."},{"label":"B","text":"Thuốc giãn phế quản."},{"label":"C","text":"Thuốc tăng huyết áp."},{"label":"D","text":"Thuốc chống trầm cảm"}],"answer":"B"},{"number":62,"question":"Thuốc giãn phế quản thuộc nhóm kích thích beta 2 adrenergic trong xử trí đợt cấp bệnh phổi tắc nghẽn mạn tính, NGOẠI TRỪ:","options":[{"label":"A","text":"Salbutamol"},{"label":"B","text":"Terbutalin"},{"label":"C","text":"Bambuterol"},{"label":"D","text":"Ipratropium"}],"answer":"D"},{"number":63,"question":"Chỉ định tiêm ngừa nào là ưu tiên cho bệnh nhân COPD?","options":[{"label":"A","text":"Vắc xin ho gà."},{"label":"B","text":"Vắc xin phế cầu."},{"label":"C","text":"Vắc xin cúm."},{"label":"D","text":"Vắc xin sốt rét."}],"answer":"C"},{"number":64,"question":"Thông khí NIPPV trong đợt cấp bệnh phổi tắc nghẽn mạn tính nhằm các mục tiêu sau, NGOẠI TRỪ:","options":[{"label":"A","text":"Giảm CO2"},{"label":"B","text":"Giảm tử vong trong thời gian nằm viện"},{"label":"C","text":"Giảm thông khí phổi"},{"label":"D","text":"Tránh đặt nội khí quản và thở máy can thiệp"}],"answer":"C"},{"number":65,"question":"Bệnh nhân tràn khí màng phổi/COPD thuộc phân loại tràn khí màng phổi nào:","options":[{"label":"A","text":"Tràn khí màng phổi do cơ học"},{"label":"B","text":"Tràn khí màng phổi do chấn thương"},{"label":"C","text":"Tràn khí màng phổi tự phát nguyên phát"},{"label":"D","text":"Tràn khí màng phổi tự phát thứ phát"}],"answer":"D"},{"number":66,"question":"Về cơ chế bệnh sinh TKMP, cơ chế đề xuất vỡ phế nang tự phát gây tràn khí màng phổi là:","options":[{"label":"A","text":"Áp suất trong bao phế quản mạch máu liền kề vẫn thấp hơn so với trong phế nang căng phồng quá mức."},{"label":"B","text":"Áp suất trong bao phế quản mạch máu liền kề vẫn cao hơn so với trong phế nang căng phồng quá mức."},{"label":"C","text":"Áp suất trong bao phế quản mạch máu liền kề bằng với trong phế nang căng phồng quá mức."},{"label":"D","text":"Không liên quan về áp suất trong bao phế quản mạch máu và phế nang căng phồng quá mức."}],"answer":"A"},{"number":67,"question":"Đặc điểm hình ảnh Xquang ngực của tràn khí màng phổi, chọn câu sai:","options":[{"label":"A","text":"Đối với những trường hợp nghi ngờ tràn khí màng phổi nhưng trên phim thẳng không phát hiện được thì tiến hành chụp phim phổi nghiêng."},{"label":"B","text":"Không phụ thuộc mức độ tràn khí màng phổi nhiều hay ít mà trên phim X-quang có thể thấy phổi bên bệnh bị xẹp nhiều hay ít."},{"label":"C","text":"Trường hợp tràn khí màng phổi nhiều, nhu mô phổi co cụm lại về phía rốn phổi bên tràn khí."},{"label":"D","text":"Hình ảnh phổi tăng sáng, không có hình ảnh mạch máu, ở vùng ngoài thành ngực có thể thấy rõ bờ màng phổi tạng."}],"answer":"B"},{"number":68,"question":"Hình ảnh tràn khí màng phổi khu trú trên Xquang ngực cần phân biệt với:","options":[{"label":"A","text":"Khí phế thủng toàn thể"},{"label":"B","text":"Áp xe phổi giai đoạn nung mủ hở"},{"label":"C","text":"Kén phổi"},{"label":"D","text":"Hang lao"}],"answer":"C"},{"number":69,"question":"Về nội soi màng phổi trong tràn khí màng phổi, chọn Câu sai:","options":[{"label":"A","text":"Chỉ định trong tràn khí màng phổi lượng nhiều thất bại với các biện pháp dẫn lưu khoang màng phổi, tràn khí màng phổi lần đầu."},{"label":"B","text":"Các thủ thuật ngoại khoa có thể tiến hành qua nội soi màng phổi có video trợ giúp như gây dính, cắt các bóng khí, khâu lỗ thủng màng phổi."},{"label":"C","text":"Nội soi màng phổi mang lại kết quả tương đương với phẫu thuật kinh điển, nhưng nhẹ nhàng hơn gấp nhiều lần."},{"label":"D","text":"Mục tiêu nội soi màng phổi là đóng kín lại chỗ dò khí từ phổi, dùng kim chỉ may thông thường, dùng stapler."}],"answer":"A"},{"number":70,"question":"Nếu nghi ngờ bệnh nhân có bóng khí hoặc u nang, phân biệt với tràn khí màng phổi có dính màng phổi nên làm gì:","options":[{"label":"A","text":"Chụp Xquang ngực nghiêng"},{"label":"B","text":"Siêu âm màng phổi"},{"label":"C","text":"Đo chức năng hô hấp"},{"label":"D","text":"Chụp CT scan ngực"}],"answer":"D"},{"number":71,"question":"Tốc độ tái hấp thu khí trong tràn khí màng phổi phụ thuộc vào các yếu tố, ngoại trừ:","options":[{"label":"A","text":"chênh lệch áp suất đối với khí giữa khoang màng phổi và máu tĩnh mạch"},{"label":"B","text":"đặc tính khuếch tán của các khí có mặt trong khoang màng phổi"},{"label":"C","text":"vùng tiếp xúc giữa khí màng phổi và màng phổi"},{"label":"D","text":"tính thấm của bề mặt động mạch phổi"}],"answer":"D"},{"number":72,"question":"Khi hết tràn khí màng phổi cần lưu kim dẫn lưu khí 24 giờ để làm gì:","options":[{"label":"A","text":"để theo dõi tràn khí màng phổi có tái phát không"},{"label":"B","text":"để theo dõi có tràn dịch màng phổi kèm theo không"},{"label":"C","text":"để theo dõi có tràn khí dưới da tăng lên không"},{"label":"D","text":"để kích thích gây dính màng phổi"}],"answer":"D"},{"number":73,"question":"Trong sơ đồ tiếp cận điều trị tràn dịch màng phổi cận viêm, khi xác định có dịch màng phổi tái lập thì cần làm gì tiếp theo:","options":[{"label":"A","text":"Xem xét VATS sớm"},{"label":"B","text":"Siêu âm lồng ngực lại"},{"label":"C","text":"Đặt ống dẫn lưu lồng ngực"},{"label":"D","text":"Tiếp tục kháng sinh"}],"answer":"D"},{"number":74,"question":"Dịch màng phổi được thành lập từ các thay đổi sau, CHỌN CÂU SAI:","options":[{"label":"A","text":"Tăng áp lực thủy tĩnh mao mạch trong màng phổi: suy thất phải hoặc trái, hội chứng tĩnh mạch chủ trên"},{"label":"B","text":"Tăng tính thấm của mao mạch màng phổi: viêm màng phổi"},{"label":"C","text":"Giảm áp lực trong khoang màng phổi: xẹp phổi hoặc tăng độ đàn hồi của phổi"},{"label":"D","text":"Giảm dịch kẽ trong phổi: suy thất trái, viêm phổi và thuyên tắc phổi"}],"answer":"D"},{"number":75,"question":"Dịch màng phổi do Lao KHÔNG CÓ đặc điểm sau:","options":[{"label":"A","text":"Thường có màu vàng chanh hơn là mủ."},{"label":"B","text":"Tái lập nhanh do liên quan đến phản ứng miễn dịch quá đáng."},{"label":"C","text":"Rất giàu trực khuẩn lao trong dịch."},{"label":"D","text":"Dịch có thể hết cả khi không điều trị."}],"answer":"C"},{"number":76,"question":"Glucose trong dịch màng phổi rất thấp thường gặp trong:","options":[{"label":"A","text":"Ung thư màng phổi"},{"label":"B","text":"Viêm mủ màng phổi"},{"label":"C","text":"Lao màng phổi"},{"label":"D","text":"Suy tim, suy thận"}],"answer":"B"},{"number":77,"question":"Về đặc điểm siêu âm màng phổi trong tràn dịch màng phổi, chọn Câu sai:","options":[{"label":"A","text":"Giúp phát hiện tràn dịch khu trú, phân biệt tràn dịch với dày dính màng phổi và hướng dẫn chọc dò màng phổi trong những trường hợp khó."},{"label":"B","text":"Có thể ước tính lượng dịch có thể rút ra được bằng cách lấy khoảng cách lớn nhất giữa lá tạng và lá thành (đo ở mặt cắt ngang) nhân với 10."},{"label":"C","text":"Đo thể tích dịch màng phổi bằng siêu âm được cho là chính xác hơn phương pháp đo bằng X quang tư thế nằm."},{"label":"D","text":"Với siêu âm, thể tích dịch màng phổi được thấy là tương quan với độ tách biệt của 2 lá màng phổi."}],"answer":"B"},{"number":78,"question":"Trong sơ đồ tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light, sau khi thực hiện chọc dịch màng phổi chẩn đoán với kết luận dịch tiết và tiến hành các kỹ thuật chẩn đoán sâu hơn nhưng bác sĩ vẫn không có chẩn đoán thì bác sĩ cần quyết định sao:","options":[{"label":"A","text":"Tiếp tục tiến hành các kỹ thuật chẩn đoán"},{"label":"B","text":"Thực hiện chọc dịch màng phổi chẩn đoán lại"},{"label":"C","text":"Xét nghiệm dịch màng phổi tìm lao"},{"label":"D","text":"Xem xét thuyên tắc phổi"}],"answer":"D"},{"number":79,"question":"Trong tràn dịch màng phổi, đặc điểm chẩn đoán tế bào học, chọn Câu sai:","options":[{"label":"A","text":"Đòi hỏi người đọc tiêu bản phải có kinh nghiệm vì tế bào màng phổi có thể chuyển dạng tạo hình ảnh giống ác tính."},{"label":"B","text":"Sự hiện diện tế bào bất thường trong dịch màng phổi có khả năng chẩn đoán thấp do phụ thuộc mức độ lan rộng và loại tế bào ung thư."},{"label":"C","text":"Kỹ thuật khối tế bào (cell block) không làm tăng khả năng chẩn đoán nguyên nhân ác tính."},{"label":"D","text":"Mọi bệnh nhân tràn dịch màng phổi dịch tiết nên được xét nghiệm tế bào học dịch màng phổi."}],"answer":"C"},{"number":80,"question":"Bệnh nhân xơ gan, đã loại trừ viêm phổi nếu nuôi cấy dịch màng phổi dương tính vi khuẩn và có số lượng bạch cầu trung tính > 250 tế bào/mm3 hoặc nuôi cấy âm tính và số lượng bạch cầu trung tính >500 tế bào/mm3 thì nghĩ đến vấn đề gì:","options":[{"label":"A","text":"Viêm màng phổi do vi khuẩn."},{"label":"B","text":"Viêm màng phổi phản ứng."},{"label":"C","text":"Tràn dịch màng phổi cận viêm."},{"label":"D","text":"Tràn dịch màng phổi dịch thấm"}],"answer":"A"}]}];
const $=s=>document.querySelector(s); let questions=[],answers={},idx=0,currentExam=null;
function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function clone(o){return JSON.parse(JSON.stringify(o))}
function init(){EXAMS.forEach((e,i)=>{let op=document.createElement('option');op.value=i;op.textContent=`${e.name} (${e.questions.length} câu)`;$('#exam').appendChild(op)})}
function start(){currentExam=EXAMS[+$('#exam').value];questions=clone(currentExam.questions);if($('#shuffleQ').checked)questions=shuffle(questions); if($('#shuffleA').checked)questions.forEach(q=>q.options=shuffle(q.options)); answers={};idx=0;$('#setup').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');renderNav();render()}
function renderNav(){let n=$('#qnav');n.innerHTML='';questions.forEach((q,i)=>{let b=document.createElement('button');b.className='qnum';b.textContent=i+1;b.onclick=()=>{idx=i;render()};n.appendChild(b)})}
function render(){let q=questions[idx];$('#examName').textContent=currentExam.name;$('#counter').textContent=`Câu ${idx+1} / ${questions.length}`;$('#question').textContent=q.question;let box=$('#options');box.innerHTML='';let state=answers[idx];q.options.forEach(opt=>{let b=document.createElement('button');b.className='option';b.innerHTML=`<strong>${opt.label}.</strong><span>${escapeHtml(opt.text)}</span>`;if(state){b.disabled=true;if(opt.label===q.answer)b.classList.add('correct');if(opt.label===state.choice && state.choice!==q.answer)b.classList.add('wrong')}else b.onclick=()=>answer(opt.label);box.appendChild(b)});let f=$('#feedback');f.innerHTML='';if(state){let ok=state.choice===q.answer;f.className='feedback '+(ok?'ok':'bad');f.innerHTML=(ok?'✅ Chính xác':'❌ Chưa đúng')+`<div class="explain">Đáp án đúng: <b>${q.answer}</b>${q.explanation?'<br>'+escapeHtml(q.explanation):''}</div>`}else f.className='';updateNav();$('#prev').disabled=idx===0;$('#next').disabled=idx===questions.length-1}
function answer(label){let q=questions[idx];if(answers[idx])return;answers[idx]={choice:label,correct:label===q.answer};render()}
function updateNav(){let bs=[...document.querySelectorAll('.qnum')];bs.forEach((b,i)=>{b.className='qnum'+(i===idx?' current':'');if(answers[i])b.classList.add(answers[i].correct?'right':'wrong')});let done=Object.keys(answers).length;let right=Object.values(answers).filter(x=>x.correct).length;$('#bar').style.width=(done/questions.length*100)+'%';$('#stats').textContent=`Đã làm ${done}/${questions.length} • Đúng ${right}`}
function finish(){let total=questions.length,done=Object.keys(answers).length,right=Object.values(answers).filter(x=>x.correct).length;let pct=total?Math.round(right/total*10000)/100:0;let wrongCount=total-right;window._retryQuestions=questions.filter((q,i)=>!answers[i]||!answers[i].correct).map(q=>clone(q));$('#quiz').classList.add('hidden');let r=$('#result');r.classList.remove('hidden');let extra=right===total?'<div class="love">Vợ yêu 🧡</div>':`<div class="feedback bad" style="display:block;margin:18px auto;max-width:620px">Chưa đạt 100%. Hãy làm lại những câu sai (${wrongCount} câu).</div><button class="primary" onclick="retryWrong()">Làm lại những câu sai</button>`;r.innerHTML=`<h2>${escapeHtml(currentExam.name)}</h2><div class="score">${pct}%</div><p>Đúng <b>${right}</b> / ${total} câu • Đã trả lời ${done}/${total}</p>${extra}<button class="secondary" style="margin-left:8px" onclick="backHome()">Làm đề khác</button>`;window.scrollTo({top:0,behavior:'smooth'})}
function retryWrong(){if(!window._retryQuestions||!window._retryQuestions.length)return;questions=clone(window._retryQuestions);if($('#shuffleQ').checked)questions=shuffle(questions);if($('#shuffleA').checked)questions.forEach(q=>q.options=shuffle(q.options));answers={};idx=0;$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');renderNav();render();window.scrollTo({top:0,behavior:'smooth'})}
function backHome(){$('#result').classList.add('hidden');$('#setup').classList.remove('hidden')}
function escapeHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
$('#start').onclick=start;$('#prev').onclick=()=>{if(idx>0){idx--;render()}};$('#next').onclick=()=>{if(idx<questions.length-1){idx++;render()}};$('#finish').onclick=()=>{if(confirm('Kết thúc và xem kết quả?'))finish()};init();
</script></body></html>
