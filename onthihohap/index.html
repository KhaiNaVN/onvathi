stion":"Về tiêu chuẩn phân loại mức độ viêm phổi cộng đồng (theo ATS). CHỌN CÂU SAI:","options":[{"label":"A","text":"Nhịp thở ≥ 30 lần/min ."},{"label":"B","text":"Lú lẫn/mất phương hướng ."},{"label":"C","text":"Tỉ số PaO₂/FiO₂ ≤ 200 ."},{"label":"D","text":"BUN ≥ 20 mg/dL ."}],"explanation":"Theo tiêu chuẩn phụ của ATS/IDSA, tỉ số PaO₂/FiO₂ là ≤ 250 mmHg (không phải ≤ 200). Các tiêu chuẩn phụ khác gồm nhịp thở ≥ 30 lần/phút, lú lẫn/mất phương hướng, BUN ≥ 20 mg/dL (7.1 mmol/L). Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi cộng đồng."},{"number":8,"answer":"D","question":"Bảng điểm PSI trong phân tầng nguy cơ viêm phổi cộng đồng, yếu tố “suy tim sung huyết” mấy điểm:","options":[{"label":"A","text":"30 điểm ."},{"label":"B","text":"20 điểm ."},{"label":"C","text":"15 điểm ."},{"label":"D","text":"10 điểm ."}],"explanation":"Trong bảng điểm PSI (Pneumonia Severity Index - Fine), tiền sử suy tim sung huyết được cộng 10 điểm. Ung thư +30, bệnh gan +20, bệnh mạch máu não +10, bệnh thận +10. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi cộng đồng."},{"number":9,"answer":"D","question":"Tác nhân vi sinh không điển hình trong bệnh viêm phổi. CHỌN CÂU SAI:","options":[{"label":"A","text":"Mycoplasma pneumoniae ."},{"label":"B","text":"Chlamydia pneumoniae ."},{"label":"C","text":"Legionella pneumophilia ."},{"label":"D","text":"Haemophilus influenzae ."}],"explanation":"Mycoplasma pneumoniae, Chlamydia pneumoniae và Legionella pneumophila là 3 tác nhân không điển hình kinh điển. Haemophilus influenzae là vi khuẩn Gram âm điển hình. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi cộng đồng."},{"number":10,"answer":"D","question":"Các yếu tố nguy cơ nhiễm S. aureus kháng methicilline, chọn Câu sai:","options":[{"label":"A","text":"Sau cảm cúm 1 tháng ."},{"label":"B","text":"Viêm phổi nặng, bao gồm sốc nhiễm trùng và đòi hỏi thông khí cơ học ."},{"label":"C","text":"Viêm phổi hoại tử hoặc tạo hang và biến chứng mủ màng phổi ."},{"label":"D","text":"Sống trong môi trường đông đúc ."}],"explanation":"Yếu tố nguy cơ gợi ý MRSA gồm viêm phổi nặng sau cúm, viêm phổi hoại tử/tạo hang, mủ màng phổi, tiền sử nhiễm MRSA. Sống môi trường đông đúc không phải yếu tố nguy cơ đặc hiệu của MRSA lâm sàng hô hấp. (2024), Bài Viêm phổi cộng đồng do vi khuẩn kháng thuốc."},{"number":11,"answer":"C","question":"Chọn đáp án đúng: “Viêm phổi là tình trạng ...(1).. của ..(2).. bao gồm viêm phế nang, ống và túi phế nang, tiểu phế quản tận hoặc viêm tổ chức kẽ của phổi.","options":[{"label":"A","text":"(1) viêm, (2) cấu trúc phổi ."},{"label":"B","text":"(1) nhiễm trùng, (2) cấu trúc phổi ."},{"label":"C","text":"(1) viêm, (2) nhu mô phổi ."},{"label":"D","text":"(1) nhiễm trùng, (2) nhu mô phổi ."}],"explanation":"Định nghĩa chuẩn: Viêm phổi là tình trạng \"viêm\" cấp tính của \"nhu mô phổi\" do nhiễm trùng, bao gồm phế nang, ống phế nang, túi phế nang, tiểu phế quản tận hoặc tổ chức kẽ. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi cộng đồng."},{"number":12,"answer":"C","question":"Chọn 1 Câu đúng trong những Câu trả lời sau đây: Thuật ngữ điều trị kháng sinh kinh nghiệm dùng để chỉ:","options":[{"label":"A","text":"Điều trị kháng sinh theo kinh nghiệm của thầy thuốc lâm sàng ."},{"label":"B","text":"Điều trị kháng sinh theo khuyến cáo dựa trên bằng chứng y học ."},{"label":"C","text":"Điều trị kháng sinh dựa trên vi khuẩn gây bệnh phổ biến tại địa phương ."},{"label":"D","text":"Điều trị kháng sinh không dựa trên xét nghiệm vi sinh ."}],"explanation":"Điều trị kháng sinh kinh nghiệm (empirical therapy) là chỉ định kháng sinh trước khi có kết quả vi sinh, dựa trên mô hình vi khuẩn gây bệnh phổ biến và mức độ đề kháng tại địa phương/cơ sở điều trị kết hợp với mức độ nặng của bệnh nhân. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi cộng đồng do vi khuẩn kháng thuốc."},{"number":13,"answer":"B","question":"Chọn phát biểu SAI khi nói về Vai trò của chất chế Betalactamase phối hợp với Betalactam:","options":[{"label":"A","text":"Mở rộng phổ tác dụng với các chủng vi khuẩn tiết Betalactamase ."},{"label":"B","text":"Hiệp đồng làm tăng tác dụng diệt Streptococcus pneumoniae ."},{"label":"C","text":"Kết hợp điều trị kháng sinh được đề xuất từ mức độ trung bình nếu xác định có yếu tố nguy cơ nhiễm khuẩn đặc biệt và kháng thuốc ."},{"label":"D","text":"Liều Amoxicilline 1g/8 giờ là đã xem xét đến khả năng S.pneumoniae giảm nhạy cảm với penicilline ."}],"explanation":"Chất chế beta-lactamase (acid clavulanic, sulbactam, tazobactam) giúp khôi phục hoạt tính kháng sinh đối với vi khuẩn tiết beta-lactamase. Phế cầu (S. pneumoniae) kháng penicillin qua cơ chế biến đổi PBP (Protein gắn Penicillin), không phải do tiết beta-lactamase, do đó chất ức chế beta-lactamase không làm tăng tác dụng diệt S. pneumoniae. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi cộng đồng do vi khuẩn kháng thuốc."},{"number":14,"answer":"B","question":"Theo Bộ Y Tế Việt Nam 2024, liều Ertapenem được khuyến cáo sử dụng trong điều trị viêm phổi cộng đồng là:","options":[{"label":"A","text":"2g TMC/8h ."},{"label":"B","text":"1g TTM/ngày ."},{"label":"C","text":"400mg TTM/8h ."},{"label":"D","text":"500mg TM/12h ."}],"explanation":"Liều Ertapenem chuẩn khuyến cáo trong điều trị viêm phổi cộng đồng là 1g truyền tĩnh mạch 1 lần/ngày. Nguồn tham khảo: Hướng dẫn chẩn đoán và điều trị Viêm phổi cộng đồng - Bộ Y tế & Giáo trình Hô hấp Sau đại học."},{"number":15,"answer":"A","question":"Bệnh nhân viêm phổi cộng đồng dị ứng với kháng sinh betalactam, sự lựa chọn kháng sinh thay thế được ATS khuyến cáo là:","options":[{"label":"A","text":"Fluoroquinolone ."},{"label":"B","text":"Aztreonam ."},{"label":"C","text":"Aminoglycosid ."},{"label":"D","text":"Cephalosporin ."}],"explanation":"Ở bệnh nhân VPCĐ dị ứng beta-lactam, Fluoroquinolone hô hấp (Levofloxacin hoặc Moxifloxacin) là lựa chọn thay thế ưu tiên hàng đầu theo hướng dẫn ATS/IDSA. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi cộng đồng."},{"number":16,"answer":"D","question":"Khuyến cáo điều trị viêm phổi cộng đồng ngoại trú đối với bệnh nhân khỏe mạnh và không dùng kháng sinh gần đây (bằng chứng 1):","options":[{"label":"A","text":"Betalactam ."},{"label":"B","text":"Fluoroquinolon ."},{"label":"C","text":"Doxycyclin ."},{"label":"D","text":"Macrolid ."}],"explanation":"Hướng dẫn ATS/IDSA kinh điển khuyến cáo đơn trị liệu bằng Macrolide (Azithromycin hoặc Clarithromycin) cho bệnh nhân ngoại trú khỏe mạnh, không có yếu tố nguy cơ kháng thuốc và không dùng kháng sinh trong vòng 3 tháng trước. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi cộng đồng."},{"number":17,"answer":"A","question":"Thời gian điều trị < 7 ngày được khuyến cáo cho các trường hợp, NGOẠI TRỪ:","options":[{"label":"A","text":"Viêm phổi do Pseudomonas aeruginosa ."},{"label":"B","text":"Viêm phổi cộng đồng mức độ nhẹ - trung bình đáp ứng tốt sau 48-72h ."},{"label":"C","text":"Viêm phổi không có biến chứng hoại tử/áp xe ."},{"label":"D","text":"Viêm phổi do phế cầu nhạy cảm ."}],"explanation":"Viêm phổi do Pseudomonas aeruginosa, Staphylococcus aureus (MRSA), hoặc có biến chứng hoại tử/áp xe/mủ màng phổi đòi hỏi thời gian điều trị kháng sinh kéo dài (thường 14-21 ngày), không được dùng liệu trình ngắn < 7 ngày. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi cộng đồng & Viêm phổi bệnh viện."},{"number":18,"answer":"A","question":"Tác nhân vi sinh thường gây viêm phổi cộng đồng đáp ứng kém với điều trị ban đầu:","options":[{"label":"A","text":"Legionella pneumophila ."},{"label":"B","text":"Streptococcus pneumoniae ."},{"label":"C","text":"Haemophilus influenzae ."},{"label":"D","text":"Mycoplasma pneumoniae ."}],"explanation":"Legionella pneumophila là tác nhân vi khuẩn không điển hình gây viêm phổi nặng, kháng tự nhiên với beta-lactam, nếu điều trị ban đầu chỉ dùng đơn trị beta-lactam sẽ dẫn đến đáp ứng kém hoặc thất bại điều trị. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi cộng đồng."},{"number":19,"answer":"D","question":"Nguyên nhân dẫn tới thất bại điều trị viêm phổi cộng đồng ban đầu:","options":[{"label":"A","text":"Chọn sai kháng sinh ban đầu ."},{"label":"B","text":"Vi khuẩn kháng thuốc ."},{"label":"C","text":"Xuất hiện biến chứng hoặc chẩn đoán nhầm ."},{"label":"D","text":"Tất cả đều đúng ."}],"explanation":"Thất bại điều trị ban đầu bao gồm các nguyên nhân từ vi sinh (vi khuẩn kháng thuốc, tác nhân không bao phủ), từ vật chủ (biến chứng áp xe, mủ màng phổi, suy giảm miễn dịch) hoặc chẩn đoán ban đầu sai (thuyên tắc phổi, ung thư, xẹp phổi). Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi cộng đồng."},{"number":20,"answer":"C","question":"Chỉ định sử dụng corticoid trong viêm phổi là:","options":[{"label":"A","text":"Suy giảm miễn dịch ."},{"label":"B","text":"Nhập viện nhiều lần ."},{"label":"C","text":"Sốc nhiễm trùng ."},{"label":"D","text":"Áp xe phổi ."}],"explanation":"Corticosteroid toàn thân không dùng thường quy cho mọi bệnh nhân viêm phổi cộng đồng; chỉ cân nhắc trong các trường hợp viêm phổi cộng đồng nặng có sốc nhiễm trùng không đáp ứng với bù dịch và thuốc vận mạch. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi cộng đồng."},{"number":21,"answer":"B","question":"Về dịch tễ học viêm phổi bệnh viện, chọn Câu sai:","options":[{"label":"A","text":"Nhiễm trùng bệnh viện gây tử vong cao nhất và kéo dài thời gian nằm viện ."},{"label":"B","text":"Các vi khuẩn họ Enterobacteriacae sinh ESBL gây đề kháng nhiều kháng sinh carbapenem ."},{"label":"C","text":"Sự đề kháng kháng sinh của các vi khuẩn gây viêm phổi bệnh viện là một vấn đề nghiêm trọng ."},{"label":"D","text":"MRSA cũng có khả năng kháng với betalactam và Carbapenem chiếm tỉ lệ 50 – 60% ."}],"explanation":"Vi khuẩn Enterobacteriaceae sinh ESBL (men beta-lactamase phổ mở rộng) đề kháng penicillin, cephalosporin và aztreonam nhưng vẫn còn nhạy cảm với Carbapenem (Carbapenem là lựa chọn hàng đầu). Chỉ khi vi khuẩn sinh Carbapenemase mới đề kháng Carbapenem. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi bệnh viện."},{"number":22,"answer":"B","question":"Trong viêm phổi nặng có nguy cơ nhiễm Pseudomonas spp thì Fluoroquinolone hô hấp nào được khuyến cáo sử dụng phối hợp:","options":[{"label":"A","text":"Moxifloxacin ."},{"label":"B","text":"Levofloxacin ."},{"label":"C","text":"Sparfloxacin ."},{"label":"D","text":"Ofloxacin ."}],"explanation":"Levofloxacin (liều cao 750mg/ngày) và Ciprofloxacin là hai fluoroquinolone có hoạt tính chống Pseudomonas aeruginosa. Moxifloxacin không có hoạt tính chống P. aeruginosa. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi bệnh viện."},{"number":23,"answer":"C","question":"Các yếu tố nguy cơ viêm phổi bệnh viện, chọn Câu sai:","options":[{"label":"A","text":"Đặt nội khí quản hay ống thông dạ dày ."},{"label":"B","text":"Sử dụng kháng sinh > 7 ngày ."},{"label":"C","text":"Suy đa cơ quan ."},{"label":"D","text":"Suy giảm miễn dịch ."}],"explanation":"Đặt nội khí quản, ống thông dạ dày, sử dụng kháng sinh kéo dài, bệnh nền nặng/suy giảm miễn dịch là các yếu tố nguy cơ dẫn đến VPBV. Suy đa cơ quan là hậu quả/biến chứng nặng của VPBV, không phải yếu tố nguy cơ tiền phát. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi bệnh viện."},{"number":24,"answer":"A","question":"Đặt nội khí quản thở máy là yếu tố nguy cơ quan trọng nhất của viêm phổi bệnh viện vì gây, ngoại trừ:","options":[{"label":"A","text":"Thay đổi pH dạ dày ."},{"label":"B","text":"Trở ngại nuốt chất tiết ."},{"label":"C","text":"Nơi chứa vi khuẩn ."},{"label":"D","text":"Máy thở và dụng cụ bị nhiễm ."}],"explanation":"Đặt ống nội khí quản làm mất hàng rào bảo vệ tự nhiên, cản trở phản xạ ho/nuốt chất tiết hầu họng, tạo điều kiện cho vi khuẩn bám dính hình thành biofilm. Sự thay đổi pH dạ dày chủ yếu do dùng thuốc kháng H2/PPI phòng ngừa loét stress. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi bệnh viện."},{"number":25,"answer":"C","question":"Về cơ chế bệnh sinh viêm phổi bệnh viện, chọn Câu sai:","options":[{"label":"A","text":"Bệnh nhân nằm viện có thể nhiễm khuẩn từ các dụng cụ hỗ trợ hô hấp thông qua nhân viên y tế ."},{"label":"B","text":"Hệ thống nước bị ô nhiễm được ghi nhận là nguyên nhân gây nhiễm khuẩn bệnh viện do Legionella species ."},{"label":"C","text":"Hệ thống làm ẩm và khí dung bị nhiễm khuẩn tạo điều kiện cho nhiễm khuẩn da, mô mềm ."},{"label":"D","text":"Nhiễm nấm thường gặp khi sửa chữa bệnh viện, hệ thống cung cấp khí bị ô nhiễm và hệ thống lọc của phòng bệnh kém ."}],"explanation":"Hệ thống làm ẩm và phun khí dung bị nhiễm khuẩn tạo điều kiện cho vi khuẩn vi hít trực tiếp vào đường hô hấp dưới gây viêm phổi bệnh viện, không phải gây nhiễm khuẩn da và mô mềm. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi bệnh viện."},{"number":26,"answer":"D","question":"Khi quyết định điều trị kháng sinh kinh nghiệm trong VPBV thì yếu tố nào là quan trọng nhất để đối phó với vi khuẩn kháng thuốc:","options":[{"label":"A","text":"Kết quả nuôi cấy trước đó ."},{"label":"B","text":"Sử dụng kháng sinh trước đó ."},{"label":"C","text":"Thời gian nằm trong bệnh viện (hay thở máy) ."},{"label":"D","text":"Tình trạng suy giảm miễn dịch và đặc điểm kháng thuốc thông thường của vi sinh gây bệnh tại cơ sở điều trị ."}],"explanation":"Mô hình dịch tễ vi khuẩn và đặc điểm nhạy cảm/kháng thuốc (antibiogram) tại chính khoa/bệnh viện đó là cơ sở quan trọng nhất để lựa chọn phác đồ kháng sinh kinh nghiệm phủ đúng tác nhân kháng thuốc. (2024), Bài Viêm phổi bệnh viện."},{"number":27,"answer":"C","question":"Về lâm sàng của viêm phổi bệnh viện, tính phổ biến của tác nhân vi sinh phụ thuộc vào các yếu tố, NGOẠI TRỪ:","options":[{"label":"A","text":"Tình trạng miễn dịch của người bệnh ."},{"label":"B","text":"Thời gian khởi phát ."},{"label":"C","text":"Các nguy cơ nhiễm khuẩn đặc biệt ."},{"label":"D","text":"Các yếu tố nguy cơ nhiễm vi khuẩn đa kháng ."}],"explanation":"Tác nhân vi sinh VPBV phụ thuộc vào thời gian khởi phát (sớm < 5 ngày vs muộn >= 5 ngày), tình trạng miễn dịch, tiền sử dùng kháng sinh và các yếu tố nguy cơ nhiễm vi khuẩn đa kháng (MDR). \"Nguy cơ nhiễm khuẩn đặc biệt\" là thuật ngữ không chuẩn hóa trong phân loại này. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi bệnh viện."},{"number":28,"answer":"C","question":"Các yếu tố nguy cơ viêm phổi hít là, NGOẠI TRỪ:","options":[{"label":"A","text":"Đặt nội khí quản ."},{"label":"B","text":"Dùng thuốc an thần liều cao ."},{"label":"C","text":"Thời gian điều trị nội trú kéo dài ."},{"label":"D","text":"Phẫu thuật ngực – bụng ."}],"explanation":"Rối loạn ý thức (an thần, hôn mê), đặt ống nội khí quản/sond dạ dày, bệnh lý thần kinh cơ, phẫu thuật ngực-bụng làm suy giảm phản xạ nuốt/bảo vệ đường thở là nguy cơ trực tiếp của viêm phổi hít. Thời gian nằm viện kéo dài là nguy cơ chung của VPBV do vi khuẩn đa kháng. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi bệnh viện & Áp xe phổi."},{"number":29,"answer":"C","question":"Vi khuẩn thường gặp trong viêm phổi thở máy xuất hiện muộn và kháng nhiều loại β-lactam là:","options":[{"label":"A","text":"Staphylococcus aureus ."},{"label":"B","text":"Streptococcus pneumoniae ."},{"label":"C","text":"Acinetobacter baumannii ."},{"label":"D","text":"Pseudomonas aeruginosa ."}],"explanation":"Acinetobacter baumannii là trực khuẩn Gram âm đa kháng nổi bật hàng đầu trong VAP khởi phát muộn tại các khoa hồi sức tích cực (ICU) ở Việt Nam, thường đề kháng với hầu hết các beta-lactam kể cả carbapenem. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi bệnh viện."},{"number":30,"answer":"A","question":"Phương pháp cấy định lượng chất tiết đường hô hấp dưới qua kỹ thuật nội soi phế quản với chất tiết nội khí quản yêu cầu có ngưỡng vi khuẩn là:","options":[{"label":"A","text":"> 1 x 10⁶ CFU/ml ."},{"label":"B","text":"> 1 x 10⁵ CFU/ml ."},{"label":"C","text":"> 1 x 10⁴ CFU/ml ."},{"label":"D","text":"> 1 x 10³ CFU/ml ."}],"explanation":"Ngưỡng chẩn đoán xác định nhiễm trùng hô hấp qua cấy định lượng chất tiết hút qua nội khí quản (ETA) là >= 10⁶ CFU/ml. (Bạch rửa phế quản phế nang BAL >= 10⁴ CFU/ml, Chải phế quản có bảo vệ PSB >= 10³ CFU/ml). Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi bệnh viện."},{"number":31,"answer":"A","question":"Trong viêm phổi bệnh viện, nếu không có sẵn nội soi phế quản, có thể lấy mẫu bệnh phẩm không qua nội soi hoặc phân lập vi khuẩn từ:","options":[{"label":"A","text":"Cấy máu ."},{"label":"B","text":"Cấy nước tiểu ."},{"label":"C","text":"Cấy dịch não tủy ."},{"label":"D","text":"Cấy dịch vết thương mô mềm ."}],"explanation":"Cấy máu là xét nghiệm hệ thống không xâm nhập cần thực hiện ở tất cả bệnh nhân nghi ngờ VPBV/VAP để tìm tác nhân vi khuẩn gây bệnh trong máu. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi bệnh viện."},{"number":32,"answer":"D","question":"Về hình ảnh học của HAP, hình ảnh tổn thương dạng nốt (kích thước từ vài mm đến vài cm), không đồng nhất, bờ mờ, không đều, có thể lan tỏa 2 bên kèm tràn dịch màng phổi, thường gặp do:","options":[{"label":"A","text":"Streptococcus pneumoniae ."},{"label":"B","text":"Pseudomonas aeruginosa ."},{"label":"C","text":"Acinetobacter baumannii ."},{"label":"D","text":"Staphylococcus aureus ."}],"explanation":"Tụ cầu vàng (Staphylococcus aureus) thường gây tổn thương phế quản-phổi hoại tử đa ổ, biểu hiện dạng nốt/đông đặc lan tỏa hai bên, dễ tạo hang, bóng khí và biến chứng tràn mủ màng phổi. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi bệnh viện."},{"number":33,"answer":"A","question":"Chẩn đoán Viêm phổi bệnh viện theo CDC, về triệu chứng hô hấp, chọn Câu sai:","options":[{"label":"A","text":"Mới xuất hiện hoặc xấu đi: ho, khó thở, nhịp tim nhanh ."},{"label":"B","text":"Tiếng ran hoặc tiếng thở phế quản ."},{"label":"C","text":"Xuất hiện kéo dài: đàm mủ, thay đổi màu đàm, tăng tiết đàm ."},{"label":"D","text":"Tình trạng oxy máu xấu đi, PaO₂/FiO₂ ≤240/cần tăng oxy/cần thở máy ."}],"explanation":"Tiêu chuẩn CDC về triệu chứng hô hấp gồm: ho mới/xấu đi, khó thở, thở nhanh (respiratory rate), đàm mủ mới/tăng tiết, nghe ran nổ/thở phế quản, suy giảm oxy máu. Nhịp tim nhanh (tachycardia) là triệu chứng toàn thân/mạch, không xếp vào tiêu chuẩn hô hấp đặc hiệu. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi bệnh viện."},{"number":34,"answer":"A","question":"Bệnh nhân nam, 72 tuổi, vào viện vì liệt ½ người (T), sau điều trị 5 ngày bệnh nhân có biểu hiện nhiễm trùng hô hấp dưới (nhiệt độ 39°C, đàm vàng, bạch cầu máu 14.500/mm3, PaO₂/FiO₂ = 300, Xquang ngực có thâm nhiễm lan tỏa 2 phổi) nghi ngờ viêm phổi bệnh viện, điểm CPIS của bệnh nhân là bao nhiêu:","options":[{"label":"A","text":"6 điểm ."},{"label":"B","text":"7 điểm ."},{"label":"C","text":"8 điểm ."},{"label":"D","text":"9 điểm ."}],"explanation":"Thang điểm CPIS (Clinical Pulmonary Infection Score): - Nhiệt độ 39°C -> 2 điểm - Bạch cầu 14.500/mm3 -> 1 điểm - Đàm đục/vàng mủ -> 2 điểm - PaO₂/FiO₂ = 300 (> 240 và không có ARDS) -> 0 điểm - X-quang thâm nhiễm lan tỏa/không khu trú -> 1 điểm - Cấy vi sinh chưa có -> 0 điểm. Tổng điểm CPIS = 2 + 1 + 2 + 0 + 1 = 6 điểm. (CPIS > 6 gợi ý cao VPBV). (2024), Bài Viêm phổi bệnh viện."},{"number":35,"answer":"B","question":"Bệnh nhân nam, 60 tuổi, vào viện vì gãy xương đùi sau tai nạn giao thông, được điều trị phẫu thuật. Sau 5 ngày điều trị, bệnh nhân tăng khó thở, thở 28 l/ph, thở khò khè, ho, đàm đục, sốt 38°C, mất nước (+), mạch 110 l/ph, Xquang ngực: tổn thương thâm nhiễm 1/3 diện tích một trường phổi (P). Đánh giá mức độ nặng viêm phổi bệnh viện của bệnh nhân:","options":[{"label":"A","text":"Nhẹ ."},{"label":"B","text":"Trung bình ."},{"label":"C","text":"Nặng ."},{"label":"D","text":"Chưa đánh giá được vì thiếu tiêu chuẩn ."}],"explanation":"Bệnh nhân chưa có các tiêu chuẩn VPBV nặng (như nhịp thở >= 30, mạch >= 120, sốt > 38.5°C, suy hô hấp cần thở máy, tụt huyết áp, tổn thương > 2/3 trường phổi) nhưng đã vượt qua mức nhẹ. Do đó phân loại mức độ Trung bình. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi bệnh viện."},{"number":36,"answer":"C","question":"Bệnh nhân nữ, 65 tuổi, vào viện vì đau ngực, được chẩn đoán nhồi máu cơ tim cấp. Sau 3 ngày điều trị, bệnh nhân tăng khó thở, thở khò khè, ho, đàm đục. Nên ưu tiên làm cận lâm sàng gì cho bệnh nhân:","options":[{"label":"A","text":"Xét nghiệm lại Troponin Tₕs ."},{"label":"B","text":"Xét nghiệm công thức máu, CRP, PCT. ."},{"label":"C","text":"Chụp Xquang ngực thẳng. ."},{"label":"D","text":"Chụp CT scan ngực (có cản quang). ."}],"explanation":"Ở bệnh nhân xuất hiện triệu chứng hô hấp mới sau 3 ngày nằm viện, X-quang ngực thẳng tại giường là phương tiện chẩn đoán hình ảnh đầu tay thiết yếu để tìm tổn thương thâm nhiễm mới và phân biệt với suy tim/phù phổi cấp. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi bệnh viện."},{"number":37,"answer":"A","question":"Nguyên tắc điều trị viêm phổi bệnh viện, chọn Câu sai:","options":[{"label":"A","text":"Sử dụng kháng sinh khởi đầu sớm, phổ rộng, theo tình trạng của bệnh nhân. ."},{"label":"B","text":"Liệu pháp kháng sinh cần được đánh giá mỗi 48-72 giờ điều trị. ."},{"label":"C","text":"Sử dụng kháng sinh theo kháng sinh đồ hoặc theo tác nhân nghi ngờ. ."},{"label":"D","text":"Cần xem xét các nguyên nhân khác hoặc biến chứng nếu lâm sàng không cải thiện. ."}],"explanation":"Kháng sinh phải khởi trị sớm, nhưng không phải bệnh nhân VPBV nào cũng mặc định dùng phổ rộng tối đa. Lựa chọn phổ rộng hay hẹp dựa trên mức độ nặng và sự có mặt của các yếu tố nguy cơ nhiễm vi khuẩn đa kháng (MDR). Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi bệnh viện."},{"number":38,"answer":"D","question":"Bệnh nhân nam, 67 tuổi, vào viện đợt cấp COPD, sau thở máy 3 ngày bệnh nhân có biểu hiện tăng nhiệt độ 39°C, đàm đục, thở 28 l/ph, mạch 110 l/ph, bạch cầu máu 15.000/mm3, CRP = 15 mg/dl, SpO₂= 88% (FiO₂: 40%), Xquang ngực có thâm nhiễm khu trú đáy phổi (P). Điều trị kháng sinh kinh nghiệm cho bệnh nhân:","options":[{"label":"A","text":"Amikacin 15-20 mg/kg IV + Vancomycin 15mg/kg IV q8-12h ."},{"label":"B","text":"Gentamicin 5-7 mg/kg IV + Linezolid 600mg IV q12h ."},{"label":"C","text":"Ceftriaxone 2g IV q24h + Linezolid 600mg IV q12h ."},{"label":"D","text":"Ceftazidime 2g IV q8h + Amikacin 15-20 mg/kg IV ."}],"explanation":"Bệnh nhân VAP trên nền COPD thở máy có nguy cơ cao nhiễm Pseudomonas aeruginosa và trực khuẩn Gram âm đa kháng. Phác đồ phối hợp Ceftazidime (Beta-lactam chống Pseudomonas) + Amikacin (Aminoglycoside) đáp ứng nguyên tắc phối hợp 2 kháng sinh chống P. aeruginosa. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi bệnh viện."},{"number":39,"answer":"B","question":"Khuyến cáo kháng sinh kinh nghiệm cho VAP, chọn Câu sai:","options":[{"label":"A","text":"Kháng sinh bao phủ S. aureus, P. aeruginosa và trực khuẩn gram âm. ."},{"label":"B","text":"Khóa chọn 2 kháng sinh chống P. aeruginosa khi cơ sở điều trị có tỷ lệ kháng thuốc > 10%. ."},{"label":"C","text":"Khuyến cáo sử dụng 1 kháng sinh chống P. aeruginosa nếu bệnh nhân không có yếu tố nguy cơ đa kháng và tỷ lệ kháng < 10%. ."},{"label":"D","text":"Khóa phối hợp Vancomycin hoặc Linezolid khi có nguy cơ nhiễm MRSA. ."}],"explanation":"Ngưỡng khuyến cáo phối hợp 2 kháng sinh chống P. aeruginosa là khi tỷ lệ đề kháng của P. aeruginosa tại đơn vị ICU > 15-20% (hoặc không rõ mô hình dịch tễ), không phải > 10%. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi bệnh viện."},{"number":40,"answer":"A","question":"Về kháng sinh kinh nghiệm trong viêm phổi bệnh viện theo phân nhóm: VP khởi phát muộn hoặc có yếu tố nguy cơ đa kháng, bất kỳ mức độ nặng, kháng sinh khuyến cáo ưu tiên là:","options":[{"label":"A","text":"Imipenem + Ciprofloxacin + Linezolid/Vancomycin ."},{"label":"B","text":"Meropenem + Ciprofloxacin + Linezolid/Vancomycin ."},{"label":"C","text":"Imipenem + Levofloxacin + Linezolid/Vancomycin ."},{"label":"D","text":"Ceftazidim + Ciprofloxacin + Linezolid/Vancomycin ."}],"explanation":"Phác đồ kinh nghiệm cho VPBV khởi phát muộn hoặc nguy cơ MDR bao gồm: 1 Beta-lactam chống Pseudomonas (Imipenem/Meropenem/Cefepime/Ceftazidime) + 1 Kháng sinh nhóm khác chống Pseudomonas (Ciprofloxacin/Levofloxacin/Aminoglycoside) + 1 Kháng sinh bao phủ MRSA (Vancomycin hoặc Linezolid). Phương án A thể hiện đầy đủ cấu trúc bộ 3 này. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Viêm phổi bệnh viện."},{"number":41,"answer":"A","question":"Yếu tố nguy cơ nào KHÔNG gây bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"Nhiễm trùng đường thở cấp ."},{"label":"B","text":"Các chất gây ô nhiễm khí thở ."},{"label":"C","text":"Thuốc lá ."},{"label":"D","text":"Bất thường về di truyền ."}],"explanation":"Thuốc lá, ô nhiễm môi trường/khói sinh khối và bất thường di truyền (thiếu hụt Alpha-1-antitrypsin) là các yếu tố nguy cơ hình thành BPTNMT. Nhiễm trùng đường thở cấp tính là yếu tố khởi phát đợt kịch phát, không phải nguyên nhân trực tiếp sinh bệnh BPTNMT mạn tính. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài BPTNMT."},{"number":42,"answer":"C","question":"Các rối loạn chủ yếu của bệnh phổi tắc nghẽn mạn tính, NGOẠI TRỪ:","options":[{"label":"A","text":"Sự phơi nhiễm lâu dài với khói thuốc lá ở những người nhạy cảm sẽ thúc đẩy quá trình viêm và huy động các tế bào miễn dịch vào trong đường thở và phế nang. ."},{"label":"B","text":"Các tế bào viêm phóng thích proteinases làm tổn thương cấu trúc ngoại bào nâng đỡ đường thở, mao mạch và lớp bề mặt trao đổi khí của phổi. ."},{"label":"C","text":"Phá hủy khoảng trao đổi khí dịch vách phế nang làm tăng diện tích trao đổi khí. ."},{"label":"D","text":"Tái cấu trúc đường thở nhỏ do quá trình xơ hóa. ."}],"explanation":"Phá hủy vách phế nang trong khí phế thũng làm suy giảm và mất đi diện tích bề mặt trao đổi khí, không phải \"làm tăng diện tích trao đổi khí\". Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài BPTNMT."},{"number":43,"answer":"D","question":"Quá trình viêm mạn tính đặc trưng bởi sự thâm nhiễm số lượng lớn các tế bào viêm, NGOẠI TRỪ:","options":[{"label":"A","text":"Bạch cầu đa nhân trung tính ."},{"label":"B","text":"Đại thực bào ."},{"label":"C","text":"Lympho TCD8+ ."},{"label":"D","text":"Bạch cầu ái kiềm ."}],"explanation":"Viêm mạn tính trong BPTNMT chủ yếu do thâm nhiễm Bạch cầu đa nhân trung tính (Neutrophils), Đại thực bào (Macrophages) và T-lymphocytes (đặc biệt CD8+). Bạch cầu ái kiềm (Basophils) không phải tế bào viêm ưu thế. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài BPTNMT."},{"number":44,"answer":"C","question":"Tác dụng của Antiproteinase trong bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"Giải phóng từ bạch cầu đa nhân ."},{"label":"B","text":"Giải phóng từ đại thực bào ."},{"label":"C","text":"Tác dụng bảo vệ đường hô hấp ."},{"label":"D","text":"Tác dụng giáng hoá protein của tổ chức gian bào ."}],"explanation":"Antiproteinase (như Alpha-1-antitrypsin, SLPI) có vai trò ức chế các enzyme proteinase (được tiết từ bạch cầu trung tính và đại thực bào), qua đó bảo vệ cấu trúc nhu mô và đường hô hấp khỏi sự thủy phân xơ đàn hồi. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài BPTNMT."},{"number":45,"answer":"D","question":"Tình trạng hẹp lòng đường thở trong COPD do nhiều tác động, NGOẠI TRỪ:","options":[{"label":"A","text":"Xơ hoá đường thở ."},{"label":"B","text":"Tăng ứ đọng đàm ."},{"label":"C","text":"Thâm nhiễm tế bào ."},{"label":"D","text":"Phá huỷ khoảng trao đổi khí ."}],"explanation":"Hẹp lòng đường thở nhỏ trong COPD do xơ hóa thành phế quản, tăng tiết và ứ đọng đàm nhầy, phù nề niêm mạc và thâm nhiễm tế bào viêm. Phá hủy khoảng trao đổi khí thuộc bệnh học khí phế thũng phế nang, không trực tiếp gây hẹp lòng phế quản. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài BPTNMT."},{"number":46,"answer":"C","question":"Hậu quả của việc giảm oxy và tăng CO₂ máu trong bệnh phổi tắc nghẽn mạn tính là do, NGOẠI TRỪ:","options":[{"label":"A","text":"Tắc nghẽn đường thở ."},{"label":"B","text":"Phá huỷ cấu trúc nhu mô phổi ."},{"label":"C","text":"Giảm kích thích trung tâm hô hấp ."},{"label":"D","text":"Bất thường cấu trúc mạch máu phổi ."}],"explanation":"Giảm PaO2 và tăng PaCO2 trong BPTNMT do bất tương hợp thông khí/tưới máu (V/Q), tắc nghẽn đường thở và phá hủy màng phế nang-mao mạch. Trung tâm hô hấp ở bệnh nhân COPD thường tăng hoạt động để duy trì thông khí phế nang, không phải giảm kích thích. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài BPTNMT."},{"number":47,"answer":"B","question":"Tình trạng tăng áp động mạch phổi ở bệnh phổi tắc nghẽn mạn tính xuất hiện khi giảm oxy máu:","options":[{"label":"A","text":"< 65mmHg ."},{"label":"B","text":"< 60mmHg ."},{"label":"C","text":"< 55mmHg ."},{"label":"D","text":"< 50mmHg ."}],"explanation":"Tăng áp động mạch phổi và tâm phế mạn thường phát triển ở giai đoạn nặng của BPTNMT khi tình trạng giảm oxy máu mạn tính diễn tiến nặng với PaO2 < 60 mmHg. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài BPTNMT."},{"number":48,"answer":"B","question":"Bệnh nhân bệnh phổi tắc nghẽn mạn tính, kết quả hô hấp ký sau test hồi phục phế quản FEV₁/FVC = 0,62 và FEV₁ 64%. Hãy kết luận giai đoạn bệnh:","options":[{"label":"A","text":"GOLD 1 ."},{"label":"B","text":"GOLD 2 ."},{"label":"C","text":"GOLD 3 ."},{"label":"D","text":"GOLD 4 ."}],"explanation":"FEV1/FVC < 0.70 xác nhận có tắc nghẽn cố định. Phân loại mức độ tắc nghẽn theo GOLD dựa trên % FEV1 dự đoán sau test giãn phế quản: - GOLD 1: FEV1 >= 80% - GOLD 2: 50% <= FEV1 < 80% (ở đây FEV1 = 64% thuộc GOLD 2 - Mức độ trung bình) - GOLD 3: 30% <= FEV1 < 50% - GOLD 4: FEV1 < 30%. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài BPTNMT."},{"number":49,"answer":"C","question":"Bệnh nhân nam, 60 tuổi, được chẩn đoán bệnh phổi tắc nghẽn mạn tính FEV₁ 78%, nhóm B. Đánh giá triệu chứng/nguy cơ đợt kịch phát của bệnh nhân này:","options":[{"label":"A","text":"Ít triệu chứng, nguy cơ thấp ."},{"label":"B","text":"Ít triệu chứng, nguy cơ cao ."},{"label":"C","text":"Nhiều triệu chứng, nguy cơ thấp ."},{"label":"D","text":"Nhiều triệu chứng, nguy cơ cao ."}],"explanation":"Theo bảng phân nhóm GOLD ABCD: - Nhóm A: Ít triệu chứng (mMRC 0-1, CAT < 10), nguy cơ đợt cấp thấp (0-1 đợt cấp không nhập viện). - Nhóm B: Nhiều triệu chứng (mMRC >= 2, CAT >= 10), nguy cơ đợt cấp thấp. - Nhóm C: Ít triệu chứng, nguy cơ đợt cấp cao (>= 2 đợt cấp hoặc >= 1 đợt cấp nhập viện). - Nhóm D: Nhiều triệu chứng, nguy cơ đợt cấp cao. Do đó Nhóm B tương ứng với \"Nhiều triệu chứng, nguy cơ thấp\". Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài BPTNMT."},{"number":50,"answer":"D","question":"Vi khuẩn gây bệnh phổ biến trong đợt cấp bệnh phổi tắc nghẽn mạn tính ngoại trú, NGOẠI TRỪ:","options":[{"label":"A","text":"Streptococcus pneumoniae ."},{"label":"B","text":"Mycoplasma catarrhalis ."},{"label":"C","text":"Haemophilus influenzae ."},{"label":"D","text":"Pseudomonas aeruginosa ."}],"explanation":"Ba vi khuẩn gây đợt cấp BPTNMT ngoại trú phổ biến nhất là Haemophilus influenzae, Streptococcus pneumoniae và Moraxella catarrhalis. Pseudomonas aeruginosa thường chỉ gặp ở bệnh nhân đợt cấp nặng, có bệnh cấu trúc phổi hoặc nằm viện/dùng kháng sinh thường xuyên. (2024), Bài BPTNMT."},{"number":51,"answer":"B","question":"Đợt cấp bệnh phổi tắc nghẽn mạn tính, NGOẠI TRỪ:","options":[{"label":"A","text":"Bệnh trở nên xấu đi vượt quá dao động hằng ngày ."},{"label":"B","text":"Khoảng 10% đợt cấp không xác định căn nguyên ."},{"label":"C","text":"Virus gây bệnh phổ biến là Coronavirus, Rhinovirus, Paramyxovirus ."},{"label":"D","text":"Ô nhiễm khí thở cũng là nguyên nhân gây bệnh ."}],"explanation":"Theo tài liệu giảng dạy, có khoảng 1/3 (xấp xỉ 30-35%) số trường hợp đợt cấp BPTNMT không tìm thấy căn nguyên rõ ràng, không phải chỉ 10%. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài BPTNMT."},{"number":52,"answer":"D","question":"Yếu tố nguy cơ nhiễm Pseudomonas spp (GOLD 2007) trong đợt cấp bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"Mới nhập viện trong vòng 30 ngày ."},{"label":"B","text":"Điều trị kháng sinh ≥ 2 đợt/năm ."},{"label":"C","text":"Bệnh nhân có kèm hen phế quản ."},{"label":"D","text":"Bệnh phổi tắc nghẽn mạn tính nặng ."}],"explanation":"Các yếu tố nguy cơ nhiễm P. aeruginosa trong đợt cấp COPD theo GOLD gồm: Mức độ tắc nghẽn nghiêm trọng (FEV1 < 50% dự đoán), nhập viện gần đây (< 90 ngày), dùng kháng sinh thường xuyên (>= 4 đợt/năm hoặc dùng kháng sinh trong 3 tháng qua), phân lập P. aeruginosa trước đó. BPTNMT giai đoạn nặng là yếu tố chính. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài BPTNMT."},{"number":53,"answer":"C","question":"Chọn lựa kháng sinh đầu tiên điều trị đợt cấp bệnh phổi tắc nghẽn mạn tính mức độ nhẹ:","options":[{"label":"A","text":"Fluoroquinolon ."},{"label":"B","text":"Fluoroquinolon + Cephalosporin ."},{"label":"C","text":"Betalactam ."},{"label":"D","text":"Betalactam/kháng betalactamase ."}],"explanation":"Đợt cấp BPTNMT mức độ nhẹ (không có yếu tố nguy cơ thất bại điều trị), kháng sinh đầu tay lựa chọn là Beta-lactam thông thường (như Amoxicillin) hoặc Macrolide/Tetracycline. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài BPTNMT."},{"number":54,"answer":"B","question":"Chọn lựa kháng sinh điều trị đợt cấp bệnh phổi tắc nghẽn mạn tính mức độ trung bình, không nguy cơ nhiễm trực khuẩn mủ xanh:","options":[{"label":"A","text":"Ertapenem + Fluoroquinolon ."},{"label":"B","text":"Betalactam/ kháng betalactamase + Fluoroquinolon ."},{"label":"C","text":"Ertapenem ."},{"label":"D","text":"Phối hợp Fluoroquinolon + Cephalosporin ."}],"explanation":"Với đợt cấp mức độ trung bình-nặng không có nguy cơ Pseudomonas, khuyến cáo sử dụng Beta-lactam/chất chế beta-lactamase (như Amoxicillin/clavulanate, Cefuroxime) hoặc Fluoroquinolone hô hấp đơn trị. Trong các lựa chọn, B chứa đúng nhóm thuốc ưu tiên. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài BPTNMT."},{"number":55,"answer":"B","question":"Liều Betalactam/kháng betalactamase trong điều trị đợt cấp bệnh phổi tắc nghẽn mạn tính liều tối thiểu là:","options":[{"label":"A","text":"2g/ngày ."},{"label":"B","text":"3g/ngày ."},{"label":"C","text":"4g/ngày ."},{"label":"D","text":"6g/ngày ."}],"explanation":"Liều Beta-lactam/chất chế beta-lactamase (như Amoxicillin/clavulanate hoặc Ampicillin/sulbactam) trong đợt cấp BPTNMT tối thiểu cần đạt khoảng 3g/ngày (ví dụ 1g x 3 lần/ngày) để đảm bảo nồng độ diệt khuẩn vượt MIC. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài BPTNMT."},{"number":56,"answer":"D","question":"Thuốc giãn phế quản thuộc nhóm kích thích beta 2 adrenergic trong xử trí đợt cấp bệnh phổi tắc nghẽn mạn tính, NGOẠI TRỪ:","options":[{"label":"A","text":"Salbutamol ."},{"label":"B","text":"Terbutalin ."},{"label":"C","text":"Bambuterol ."},{"label":"D","text":"Ipratropium ."}],"explanation":"Salbutamol, Terbutaline, Bambuterol là các thuốc đồng vận/kích thích thụ thể Beta-2 adrenergic. Ipratropium bromide thuộc nhóm kháng cholinergic tác dụng ngắn (SAMA). Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài BPTNMT."},{"number":57,"answer":"A","question":"Mục tiêu oxy cho bệnh nhân đợt cấp bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"88 – 92% ."},{"label":"B","text":"92 – 94% ."},{"label":"C","text":"94 – 96% ."},{"label":"D","text":"96 – 98% ."}],"explanation":"Liệu pháp oxy trong đợt cấp BPTNMT phải kiểm soát liều lượng với mục tiêu SpO2 đạt 88 - 92% nhằm cải thiện tình trạng giảm oxy máu mà không làm mất kích thích hô hấp do giảm O2, tránh gây tăng CO2 máu và toan hô hấp. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài BPTNMT."},{"number":58,"answer":"C","question":"Thông khí NIPPV trong đợt cấp bệnh phổi tắc nghẽn mạn tính nhằm các mục tiêu sau, NGOẠI TRỪ:","options":[{"label":"A","text":"Giảm CO₂ ."},{"label":"B","text":"Giảm tử vong trong thời gian nằm viện ."},{"label":"C","text":"Giảm thông khí phổi ."},{"label":"D","text":"Tránh đặt nội khí quản và thở máy can thiệp ."}],"explanation":"Thông khí nhân tạo không xâm nhập áp lực dương (NIPPV) giúp tăng thông khí phế nang, giảm PaCO2, giảm công thở, giảm tỷ lệ đặt nội khí quản và giảm tử vong. NIPPV không nhằm \"giảm thông khí phổi\". Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài BPTNMT."},{"number":59,"answer":"C","question":"Tiêu chuẩn ngưng theo dõi điều trị đợt cấp bệnh phổi tắc nghẽn mạn tính nội trú, NGOẠI TRỪ:","options":[{"label":"A","text":"Nhu cầu sử dụng beta 2 hít <6 lần/ngày ."},{"label":"B","text":"Có thể trở lại các sinh hoạt như trước đợt cấp ."},{"label":"C","text":"Khí máu động mạch trở về bình thường ."},{"label":"D","text":"Lâm sàng ổn định trong 24h ."}],"explanation":"Tiêu chuẩn xuất viện đợt cấp COPD gồm: nhu cầu dùng SABA < 6 lần/ngày, lâm sàng ổn định 12-24h, tự sinh hoạt/ăn ngủ được. Ở bệnh nhân COPD mạn tính, khí máu động mạch có thể có tăng PaCO2 mạn bù trừ, không bắt buộc khí máu phải trở về hoàn toàn \"bình thường\" như người khỏe mạnh. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài BPTNMT."},{"number":60,"answer":"C","question":"Chọn 1 Câu sai: Đánh giá tiến triển bệnh phổi tắc nghẽn mạn tính","options":[{"label":"A","text":"Cần theo dõi kết quả chức năng phổi hằng năm, đánh giá dung tích chức năng bằng nghiệm pháp đi bộ theo thời gian. ."},{"label":"B","text":"Bộ dụng bộ Câu hỏi trắc nghiệm đánh giá BPTNMT (CAT). ."},{"label":"C","text":"Đo độ bão hòa oxy trong khí máu động mạch lúc gắng sức để hỗ trợ oxy liệu pháp. ."},{"label":"D","text":"Ghi nhận tần suất, mức độ nặng, nguyên nhân của đợt cấp. ."}],"explanation":"Theo dõi tiến triển COPD gồm đo chức năng hô hấp hằng năm, test đi bộ 6 phút, bảng điểm CAT và theo dõi tần suất đợt cấp. \"Đo độ bão hòa oxy trong khí máu động mạch lúc gắng sức\" không phải chỉ số theo dõi tiến triển chuẩn theo hướng dẫn. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài BPTNMT."},{"number":61,"answer":"D","question":"Nguy cơ tràn khí màng phổi tăng đáng kể khi:","options":[{"label":"A","text":"Béo phì ."},{"label":"B","text":"Ăn mặn ."},{"label":"C","text":"Giới tính nữ ."},{"label":"D","text":"Hút thuốc lá ."}],"explanation":"Hút thuốc lá là yếu tố nguy cơ độc lập quan trọng nhất làm tăng nguy cơ tràn khí màng phổi tự phát (gấp khoảng 22 lần ở nam và 9 lần ở nữ) do gây viêm đường thở nhỏ và hình thành bóng khí dưới màng phổi. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn khí màng phổi."},{"number":62,"answer":"D","question":"Bệnh nhân tràn khí màng phổi/COPD thuộc phân loại tràn khí màng phổi nào:","options":[{"label":"A","text":"Tràn khí màng phổi do cơ học ."},{"label":"B","text":"Tràn khí màng phổi do chấn thương ."},{"label":"C","text":"Tràn khí màng phổi tự phát nguyên phát ."},{"label":"D","text":"Tràn khí màng phổi tự phát thứ phát ."}],"explanation":"Tràn khí màng phổi tự phát thứ phát (Secondary Spontaneous Pneumothorax - SSP) là tràn khí xảy ra trên bệnh nhân có bệnh lý nhu mô phổi nền từ trước (như COPD, lao phổi, giãn phế quản, xơ phổi). Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn khí màng phổi."},{"number":63,"answer":"A","question":"Về cơ chế bệnh sinh TKMP, cơ chế đề xuất vỡ phế nang tự phát gây tràn khí màng phổi là:","options":[{"label":"A","text":"Áp suất trong bao phế quản mạch máu liền kề vẫn thấp hơn so với trong phế nang căng phồng quá mức. ."},{"label":"B","text":"Áp suất trong bao phế quản mạch máu liền kề vẫn cao hơn so với trong phế nang căng phồng quá mức. ."},{"label":"C","text":"Áp suất trong bao phế quản mạch máu liền kề bằng với trong phế nang căng phồng quá mức. ."},{"label":"D","text":"Không liên quan về áp suất trong bao phế quản mạch máu và phế nang căng phồng quá mức. ."}],"explanation":"Khi phế nang bị căng phồng quá mức, áp suất trong phế nang tăng cao vượt trội so với áp suất thấp trong bao phế quản-mạch máu liền kề; sự chênh lệch áp suất này làm vỡ phế nang, khí bóc tách dọc theo bao mạch máu về rốn phổi và khoang màng phổi. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn khí màng phổi."},{"number":64,"answer":"B","question":"Về lâm sàng tràn khí màng phổi, chọn câu sai:","options":[{"label":"A","text":"Khó thở thường xuất hiện sau đau ngực tùy theo tốc độ thành lập khoang khí, ."},{"label":"B","text":"Bệnh khởi phát từ từ bằng đau ngực, tăng khi ho, hít sâu, có thể liên quan đến gắng sức. ."},{"label":"C","text":"Biểu hiện suy hô hấp mức độ từ nhẹ đến nặng, tụt huyết áp khi tràn khí màng phổi áp lực. ."},{"label":"D","text":"Tam chứng Galliard gồm giảm hay mất rung thanh, gõ vang, rì rào phế nang giảm hoặc mất. ."}],"explanation":"Tràn khí màng phổi điển hình khởi phát đột ngột (đột ngột đau ngực dữ dội kiểu màng phổi và khó thở), không phải khởi phát \"từ từ\". Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn khí màng phổi."},{"number":65,"answer":"C","question":"Khám thực thể bệnh nhân tràn khí màng phổi áp lực, chọn câu sai:","options":[{"label":"A","text":"Ảnh hưởng đến cung lượng tim, gây hạ huyết áp và thiếu oxy đe dọa tính mạng. ."},{"label":"B","text":"Bệnh nhân không có tiếng thở ở vùng bị ảnh hưởng, lệch khí quản sang một bên, nhịp tim nhanh và căng giãn tĩnh mạch. ."},{"label":"C","text":"Không có biểu hiện suy hô hấp mức độ từ nhẹ đến nặng do sự tích tụ dần không khí trong khoang màng phổi. ."},{"label":"D","text":"Bệnh nhân có thể ở tình trạng trụy mạch, ngừng tim, nếu không được cấp cứu kịp thời bệnh nhân có thể tử vong nhanh chóng. ."}],"explanation":"Tràn khí màng phổi áp lực là một cấp cứu nội khoa nguy kịch gây suy hô hấp nặng và sụp đổ tuần hoàn (chèn ép tĩnh mạch chủ, hạ huyết áp, trụy mạch). Phát biểu \"không có biểu hiện suy hô hấp\" là sai hoàn toàn. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn khí màng phổi."},{"number":66,"answer":"C","question":"Thường khám được tam chứng Galliard trong tràn khí màng phổi nếu (...). Điền vào chỗ trống:","options":[{"label":"A","text":"> 15% diện tích ở 1 bên phổi bị xẹp. ."},{"label":"B","text":"> 20% diện tích ở 1 bên phổi bị xẹp. ."},{"label":"C","text":"> 25% diện tích ở 1 bên phổi bị xẹp. ."},{"label":"D","text":"> 30% diện tích ở 1 bên phổi bị xẹp. ."}],"explanation":"Tam chứng Gailliard (Rung thanh giảm/mất, Gõ vang, Rì rào phế nang giảm/mất) thường phát hiện rõ trên lâm sàng khi thể tích/diện tích xẹp phổi > 25% nửa lồng ngực. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn khí màng phổi."},{"number":67,"answer":"B","question":"Đặc điểm hình ảnh Xquang ngực của tràn khí màng phổi, chọn câu sai:","options":[{"label":"A","text":"Đối với những trường hợp nghi ngờ tràn khí màng phổi nhưng trên phim thẳng không phát hiện được thì tiến hành chụp phim phổi nghiêng. ."},{"label":"B","text":"Không phụ thuộc mức độ tràn khí màng phổi nhiều hay ít mà trên phim X-quang có thể thấy phổi bên bệnh bị xẹp nhiều hay ít. ."},{"label":"C","text":"Trường hợp tràn khí màng phổi nhiều, nhu mô phổi co cụm lại về phía rốn phổi bên tràn khí. ."},{"label":"D","text":"Hình ảnh phổi tăng sáng, không có hình ảnh mạch máu, ở vùng ngoài thành ngực có thể thấy rõ bờ màng phổi tạng. ."}],"explanation":"Mức độ co cụm/xẹp phổi trên phim X-quang phụ thuộc trực tiếp vào lượng khí tràn trong khoang màng phổi (lượng khí càng nhiều thì nhu mô phổi càng bị đẩy xẹp nhiều về phía rốn phổi). Do đó phát biểu \"không phụ thuộc mức độ tràn khí\" là sai. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn khí màng phổi."},{"number":68,"answer":"A","question":"Hình ảnh Xquang tràn khí màng phổi tư thế nằm ngửa:","options":[{"label":"A","text":"Dấu hiệu khe sâu (deep sulcus sign) ."},{"label":"B","text":"Dấu hiệu Damoiseau ."},{"label":"C","text":"Dấu hiệu Hamman ."},{"label":"D","text":"Dấu hiệu Westermark ."}],"explanation":"Trên phim X-quang ngực nằm ngửa, khí đọng ở vùng trước-dưới khoang màng phổi tạo nên hình ảnh góc sườn hoành bên bệnh bị sáng rộng và sâu bất thường, gọi là \"Dấu hiệu khe sâu\" (Deep sulcus sign). Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn khí màng phổi."},{"number":69,"answer":"C","question":"Hình ảnh tràn khí màng phổi khu trú trên Xquang ngực cần phân biệt với:","options":[{"label":"A","text":"Khí phế thũng toàn thể ."},{"label":"B","text":"Áp xe phổi giai đoạn nung mủ hở ."},{"label":"C","text":"Kén phổi ."},{"label":"D","text":"Hang lao ."}],"explanation":"Tràn khí màng phổi khu trú (do dính màng phổi) tạo hình khoảng tăng sáng có thể nhầm lẫn với bóng khí/kén phổi (bullae/cyst). Chụp CT scan lồng ngực là phương tiện chẩn đoán phân biệt chính xác nhất. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn khí màng phổi."},{"number":70,"answer":"C","question":"Đặc điểm hình ảnh Xquang ngực của tràn khí màng phổi áp lực, chọn câu sai:","options":[{"label":"A","text":"Xương sườn nằm ngang ."},{"label":"B","text":"Trung thất bị đẩy lệch sang bên đối diện ."},{"label":"C","text":"Khoang gian sườn hẹp ."},{"label":"D","text":"Cơ hoành bị đẩy xuống thấp ."}],"explanation":"Trong tràn khí màng phổi áp lực, áp lực khí trong khoang màng phổi tăng cao làm giãn rộng các khoang gian sườn (không phải khoang gian sườn hẹp), xương sườn nằm ngang, vòm hoành hạ thấp và đẩy trung thất sang bên đối diện. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn khí màng phổi."},{"number":71,"answer":"D","question":"Nếu nghi ngờ bệnh nhân có bóng khí hoặc u nang, phân biệt với tràn khí màng phổi có dính màng phổi nên làm gì:","options":[{"label":"A","text":"Chụp Xquang ngực nghiêng ."},{"label":"B","text":"Siêu âm màng phổi ."},{"label":"C","text":"Đo chức năng hô hấp ."},{"label":"D","text":"Chụp CT scan ngực ."}],"explanation":"Chụp cắt lớp vi tính (CT scan) lồng ngực là tiêu chuẩn vàng giúp phân biệt rõ ràng giữa bóng khí/kén nhu mô phổi và tràn khí màng phổi khu trú do dính màng phổi. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn khí màng phổi."},{"number":72,"answer":"B","question":"Tràn dịch màng phổi có thể xảy ra đồng thời với tràn khí màng phổi trong khoảng bao nhiêu % trường hợp tràn khí màng phổi tự phát:","options":[{"label":"A","text":"10% đến 15% ."},{"label":"B","text":"20% đến 25% ."},{"label":"C","text":"30% đến 35% ."},{"label":"D","text":"40% me đến 45% ."}],"explanation":"Tràn dịch màng phổi phản ứng kèm theo gặp trong khoảng 20 - 25% các trường hợp tràn khí màng phổi tự phát. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn khí màng phổi."},{"number":73,"answer":"C","question":"Tràn máu màng phổi có thể xảy ra đồng thời với tràn khí màng phổi trong khoảng bao nhiêu % các trường hợp tràn khí màng phổi tự phát:","options":[{"label":"A","text":"1% đến 3% ."},{"label":"B","text":"1% đến 1,5% ."},{"label":"C","text":"2% đến 3% ."},{"label":"D","text":"2% đến 2,5% ."}],"explanation":"Tràn máu - tràn khí màng phổi tự phát (Hemopneumothorax) xảy ra do đứt đứt dây dính màng phổi có mạch máu, chiếm khoảng 2 - 3% các trường hợp tràn khí màng phổi tự phát. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn khí màng phổi."},{"number":74,"answer":"C","question":"Theo BTS, trên Xquang ngực, tràn khí màng phổi tự phát lượng ít khi đường kính khoang khí bao nhiêu:","options":[{"label":"A","text":"< 4cm ."},{"label":"B","text":"< 3cm ."},{"label":"C","text":"< 2cm ."},{"label":"D","text":"< 1,5cm ."}],"explanation":"Hướng dẫn Hiệp hội Lồng ngực Anh (BTS) quy ước: Tràn khí màng phổi lượng ít khi khoảng cách giữa bờ màng phổi tạng và thành ngực (bề dày khoang khí ở rãnh liên sườn ngang rốn phổi) < 2 cm. (>= 2 cm là lượng nhiều). Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn khí màng phổi."},{"number":75,"answer":"A","question":"Chẩn đoán phân biệt giữa tràn khí màng phổi khu trú và hang trong nhu mô phổi ở vùng tiếp giáp lồng ngực dựa vào: (1) Dấu hiệu J.Rémy, (2) Góc Bernou","options":[{"label":"A","text":"(1) đúng, (2) đúng ."},{"label":"B","text":"(1) đúng, (2) sai ."},{"label":"C","text":"(1) sai, (2) sai ."},{"label":"D","text":"(1) sai, (2) đúng ."}],"explanation":"Dấu hiệu J. Rémy và Góc Bernou (hoặc góc tiếp xúc với thành ngực) trên hình ảnh học là các dấu hiệu kinh điển giúp phân biệt tổn thương thuộc khoang màng phổi (tạo góc tù với thành ngực) và tổn thương hang/kén trong nhu mô phổi (tạo góc nhọn). Cả hai đều đúng. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn khí màng phổi."},{"number":76,"answer":"B","question":"Độ nhạy của siêu âm phổi trong phát hiện tràn khí màng phổi là:","options":[{"label":"A","text":"từ 70% đến 90% ."},{"label":"B","text":"từ 79% đến 95% ."},{"label":"C","text":"từ 98% đến 99% ."},{"label":"D","text":"từ 99% me đến 100% ."}],"explanation":"Siêu âm phổi có độ nhạy từ 79% đến 95% (và độ đặc hiệu 98-100%) trong chẩn đoán tràn khí màng phổi, vượt trội hơn so với X-quang ngực thẳng tư thế nằm. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn khí màng phổi."},{"number":77,"answer":"D","question":"Ưu điểm của siêu âm màng phổi trong tràn khí màng phổi (TKMP), chọn câu sai:","options":[{"label":"A","text":"Giúp chẩn đoán TKMP ẩn ."},{"label":"B","text":"Kích thước máy nhỏ, có tính di động ."},{"label":"C","text":"Thực hiện tại giường ."},{"label":"D","text":"Rẻ hơn Xquang ngực ."}],"explanation":"Các ưu điểm chính của siêu âm phổi được giáo trình nhấn mạnh gồm: phát hiện tràn khí ẩn (occult pneumothorax), máy nhỏ gọn di động, thực hiện ngay tại giường cấp cứu, không nhiễm xạ. \"Rẻ hơn X-quang ngực\" không phải ưu điểm chuẩn được nêu. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn khí màng phổi."},{"number":78,"answer":"C","question":"Điều trị bảo tồn nội khoa và theo dõi nội viện, chụp kiểm tra Xquang ngực thẳng mỗi ngày là hướng xử trí ở bệnh nhân tràn khí màng phổi như thế nào, chọn câu sai:","options":[{"label":"A","text":"Bệnh nhân không khó thở ."},{"label":"B","text":"Bệnh nhân huyết động ổn định ."},{"label":"C","text":"TKMP lượng nhiều ."},{"label":"D","text":"Kích thước khoang TKMP không tăng lên sau 6 – 8 giờ ."}],"explanation":"Điều trị bảo tồn (nghỉ ngơi, thở oxy) chỉ áp dụng cho tràn khí màng phổi tự phát lượng ít (< 2 cm hoặc < 15%), không khó thở, huyết động ổn định. Tràn khí lượng nhiều (>= 2 cm) là chỉ định chọc hút hoặc đặt ống dẫn lưu. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn khí màng phổi."},{"number":79,"answer":"A","question":"Với tràn khí màng phổi không biến chứng thì mỗi ngày màng phổi hấp thu được bao nhiêu thể tích khí:","options":[{"label":"A","text":"1% ."},{"label":"B","text":"1% - 3% ."},{"label":"C","text":"3% - 5% ."},{"label":"D","text":"< 5% ."}],"explanation":"Tốc độ tự tái hấp thu khí tự nhiên của khoang màng phổi ở người bệnh tràn khí không biến chứng là khoảng 1% đến 1.25% thể tích khoang khí mỗi 24 giờ (thở oxy liều cao có thể tăng tốc độ hấp thu lên gấp 4 lần). Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn khí màng phổi."},{"number":80,"answer":"D","question":"Nếu hết tràn khí màng phổi thì sau bao lâu nên rút kim/ống dẫn lưu khí:","options":[{"label":"A","text":"rút kim ngay ."},{"label":"B","text":"sau 6 giờ ."},{"label":"C","text":"sau 12 giờ ."},{"label":"D","text":"sau 24 giờ ."}],"explanation":"Sau khi phổi đã tái giãn nở hoàn toàn và không còn khí ra qua hệ thống dẫn lưu, ống/kim dẫn lưu cần được kẹp hoặc lưu theo dõi trong 24 giờ; nếu chụp X-quang kiểm tra phổi vẫn nở tốt mới tiến hành rút ống. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn khí màng phổi."},{"number":81,"answer":"D","question":"Nguyên nhân tràn dịch màng phổi dịch thấm, NGOẠI TRỪ:","options":[{"label":"A","text":"Suy tim sung huyết ."},{"label":"B","text":"Hội chứng thận hư ."},{"label":"C","text":"Tắc tĩnh mạch chủ trên ."},{"label":"D","text":"Hội chứng tăng ure máu ."}],"explanation":"Suy tim, hội chứng thận hư, xơ gan, tắc tĩnh mạch chủ trên gây tràn dịch màng phổi dịch thấm (Transudate). Hội chứng tăng ure máu (Uremia) gây viêm màng phổi tăng tính thấm, dẫn đến tràn dịch màng phổi dịch tiết (Exudate). Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn dịch màng phổi."},{"number":82,"answer":"A","question":"Tràn dịch màng phổi dịch tiết do nhiễm trùng chiếm khoảng:","options":[{"label":"A","text":"36-66% ."},{"label":"B","text":"10-50% ."},{"label":"C","text":"2-35% ."},{"label":"D","text":"4-20% ."}],"explanation":"Tràn dịch màng phổi cạnh viêm/nhiễm trùng hô hấp (Parapneumonic effusion) là nguyên nhân hàng đầu gây tràn dịch màng phổi dịch tiết, chiếm tỷ lệ khoảng 36 – 66% các trường hợp dịch tiết. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn dịch màng phổi."},{"number":83,"answer":"D","question":"Dịch màng phổi được thành lập từ các thay đổi sau, CHỌN CÂU SAI:","options":[{"label":"A","text":"Tăng áp lực thủy tĩnh mao mạch trong màng phổi: suy thất phải hoặc trái, hội chứng tĩnh mạch chủ trên ."},{"label":"B","text":"Tăng tính thấm của mao mạch màng phổi: viêm màng phổi ."},{"label":"C","text":"Giảm áp lực trong khoang màng phổi: xẹp phổi hoặc tăng độ đàn hồi của phổi ."},{"label":"D","text":"Giảm dịch kẽ trong phổi: suy thất trái, viêm phổi và thuyên tắc phổi ."}],"explanation":"Sự gia tăng hình thành dịch màng phổi xảy ra khi TĂNG dịch kẽ trong phổi (do suy tim trái, viêm phổi, thuyên tắc phổi) tràn qua màng phổi tạng vào khoang màng phổi. Phát biểu \"Giảm dịch kẽ\" là sai cơ chế. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn dịch màng phổi."},{"number":84,"answer":"D","question":"Ung thư màng phổi nguyên phát (Mésotheliome):","options":[{"label":"A","text":"Ít gặp hơn do di căn. ."},{"label":"B","text":"Thường gặp ở dạng màng, u hơn là dạng tràn dịch. ."},{"label":"C","text":"Liên quan trực tiếp đến Amiante. ."},{"label":"D","text":"A và C đúng. ."}],"explanation":"U trung biểu mô màng phổi nguyên phát (Mesothelioma) rất hiếm gặp (ít hơn nhiều so với ung thư di căn màng phổi) và có mối liên quan dịch tễ trực tiếp với tiền sử tiếp xúc bụi amiăng (asbestos). Do đó cả A và C đúng. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn dịch màng phổi."},{"number":85,"answer":"C","question":"Dịch màng phổi do Lao KHÔNG CÓ đặc điểm sau:","options":[{"label":"A","text":"Thường có màu vàng chanh hơn là mủ, ."},{"label":"B","text":"Tái lập nhanh do liên quan đến phản ứng miễn dịch quá đáng. ."},{"label":"C","text":"Rất giàu trực khuẩn lao trong dịch. ."},{"label":"D","text":"Dịch có thể hết cả khi không điều trị. ."}],"explanation":"Tràn dịch màng phổi do lao chủ yếu là phản ứng quá mẫn muộn tế bào đối với protein trực khuẩn lao. Số lượng trực khuẩn Mycobacterium tuberculosis trong dịch màng phổi rất ít (soi tìm AFB dịch màng phổi có tỷ lệ dương tính rất thấp < 20-30%). Mô tả \"Rất giàu trực khuẩn lao\" là sai. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn dịch màng phổi."},{"number":86,"answer":"B","question":"Để xác định tràn dịch màng phổi thể khu trú cần dựa vào:","options":[{"label":"A","text":"Tiền sử, bệnh sử ."},{"label":"B","text":"Phim XQuang ngực ."},{"label":"C","text":"Triệu chứng cơ năng là chính ."},{"label":"D","text":"Triệu chứng thực thể là chính ."}],"explanation":"Tràn dịch màng phổi khu trú (do dính màng phổi) không có hình ảnh đường cong Damoiseau điển hình trên lâm sàng mà tạo các hình mờ đặc biệt trên chẩn đoán hình ảnh (X-quang ngực thẳng/nghiêng hoặc siêu âm/CT ngực). Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn dịch màng phổi."},{"number":87,"answer":"B","question":"Glucose trong dịch màng phổi rất thấp thường gặp trong:","options":[{"label":"A","text":"Ung thư màng phổi ."},{"label":"B","text":"Viêm mủ màng phổi ."},{"label":"C","text":"Lao màng phổi ."},{"label":"D","text":"Suy tim, suy thận ."}],"explanation":"Glucose dịch màng phổi giảm rất thấp (< 40 mg/dL hoặc rất gần 0) điển hình gặp trong Viêm mủ màng phổi (Empyema) và Viêm màng phổi do Viêm khớp dạng thấp do sự tiêu thụ đường mạnh mẽ của bạch cầu trung tính và vi khuẩn. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn dịch màng phổi."},{"number":88,"answer":"D","question":"Đặc điểm hình ảnh Xquang ngực trong tràn dịch màng phổi tự do lượng trung bình, chọn câu sai:","options":[{"label":"A","text":"Hình mờ đồng nhất ."},{"label":"B","text":"Xóa góc sườn hoành ."},{"label":"C","text":"Đường cong Damoiseau ."},{"label":"D","text":"Hình ảnh mờ góc sườn hoành, đậm, không đồng nhất, có giới hạn trên là đường cong lõm, cao ở thành ngực và thấp dần khi đi vào trung thất. ."}],"explanation":"Tràn dịch màng phổi tự do tạo hình mờ ĐỒNG NHẤT (không phải \"không đồng nhất\") ở vùng thấp, xóa góc sườn hoành với giới hạn trên là đường cong Damoiseau (đường cong lõm lên trên, cao ở phía thành ngực và thấp dần về phía rốn phổi/trung thất). Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn dịch màng phổi."},{"number":89,"answer":"B","question":"Về đặc điểm siêu âm màng phổi trong tràn dịch màng phổi, chọn Câu sai:","options":[{"label":"A","text":"Giúp phát hiện tràn dịch khu trú, phân biệt tràn dịch với dày dính màng phổi và hướng dẫn chọc dò màng phổi trong những trường hợp khó. ."},{"label":"B","text":"Có thể ước tính lượng dịch có thể rút ra được bằng cách lấy khoảng cách lớn nhất giữa lá tạng và lá thành (đo ở mặt cắt ngang) nhân với 10. ."},{"label":"C","text":"Đo thể tích dịch màng phổi bằng siêu âm được cho là chính xác hơn phương pháp đo bằng X quang tư thế nằm. ."},{"label":"D","text":"Với siêu âm, thể tích dịch màng phổi được thấy là tương quan với độ tách biệt của 2 lá màng phổi. ."}],"explanation":"Công thức ước tính thể tích dịch màng phổi trên siêu âm (theo Balik): Thể tích dịch (mL) = Khoảng cách lớn nhất giữa lá thành và lá tạng (mm) x 20 (không phải nhân với 10). Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn dịch màng phổi."},{"number":90,"answer":"D","question":"Trong sơ đồ tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light, sau khi thực hiện chọc dịch màng phổi chẩn đoán thì kết luận dịch tiết khi đáp ứng tiêu chuẩn nào sau đây:","options":[{"label":"A","text":"LDH dịch màng phổi /huyết thanh > 0,5 ."},{"label":"B","text":"LDH dịch màng phổi > 1/3 giới hạn bình thường trên của LDH huyết thanh ."},{"label":"C","text":"LDH dịch màng phổi > 400 UI/L giá trị bình thường của LDH huyết thanh ."},{"label":"D","text":"Protein dịch màng phổi /huyết thanh > 0,5 ."}],"explanation":"Tiêu chuẩn Light chẩn đoán Dịch tiết khi thỏa mãn ÍT NHẤT 1 trong 3 tiêu chí: 1. Protein dịch màng phổi / Protein huyết thanh > 0.5 2. LDH dịch màng phổi / LDH huyết thanh > 0.6 (phương án A ghi > 0.5 là sai) 3. LDH dịch màng phổi > 2/3 giới hạn trên của LDH huyết thanh bình thường (phương án B ghi > 1/3 là sai). Chỉ có phương án D ghi đúng \"Protein dịch màng phổi / huyết thanh > 0,5\". Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn dịch màng phổi."},{"number":91,"answer":"C","question":"Trong sơ đồ tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light, sau khi thực hiện chọc dịch màng phổi chẩn đoán với kết luận dịch tiết thì bác sĩ làm gì tiếp theo:","options":[{"label":"A","text":"Điều trị suy tim, xơ gan, bệnh thận ."},{"label":"B","text":"Không làm gì thêm để chẩn đoán ."},{"label":"C","text":"Tiến hành các kỹ thuật chẩn đoán sâu hơn ."},{"label":"D","text":"Nội soi màng phổi hoặc sinh thiết màng phổi ."}],"explanation":"Khi xác định là dịch tiết (Exudate), bước tiếp theo trong sơ đồ Light là tiến hành các kỹ thuật xét nghiệm chuyên sâu hơn (định lượng glucose, amylase, tế bào học, cấy vi sinh, ADA, tìm lao) để tìm nguyên nhân nguyên phát. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn dịch màng phổi."},{"number":92,"answer":"B","question":"Trong sơ đồ tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light, sau khi thực hiện chọc dịch màng phổi chẩn đoán với kết luận dịch tiết có tăng amylase thì bác sĩ cần xem xét các khả năng sau, NGOẠI TRỪ:","options":[{"label":"A","text":"Rách thực quản ."},{"label":"B","text":"Nhiễm vi khuẩn ."},{"label":"C","text":"Tràn dịch màng phổi trong viêm tụy ."},{"label":"D","text":"Bệnh lý ác tính ."}],"explanation":"Amylase dịch màng phổi tăng gợi ý 3 nhóm nguyên nhân chính: Bệnh lý tuyến tụy (viêm tụy cấp/mạn, kén giả tụy), Vỡ/thủng thực quản (amylase nguồn gốc nước bọt) và Ung thư/bệnh lý ác tính. Nhiễm vi khuẩn thông thường không gây tăng amylase dịch màng phổi. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn dịch màng phổi."},{"number":93,"answer":"D","question":"Trong sơ đồ tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light, sau khi thực hiện chọc dịch màng phổi chẩn đoán với kết luận dịch tiết và tiến hành các kỹ thuật chẩn đoán sâu hơn nhưng bác sĩ vẫn không có chẩn đoán thì bác sĩ cần quyết định sao:","options":[{"label":"A","text":"Tiếp tục tiến hành các kỹ thuật chẩn đoán ."},{"label":"B","text":"Thực hiện chọc dịch màng phổi chẩn đoán lại ."},{"label":"C","text":"Xét nghiệm dịch màng phổi tìm lao ."},{"label":"D","text":"Xem xét thuyên tắc phổi ."}],"explanation":"Trong thuật toán tiếp cận tràn dịch màng phổi dịch tiết chưa rõ nguyên nhân sau các xét nghiệm cơ bản, bước tiếp theo là xem xét Thuyên tắc phổi (chụp CT xoắn ốc mạch máu phổi hoặc xạ hình thông khí-tưới máu). Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn dịch màng phổi."},{"number":94,"answer":"C","question":"Trong sơ đồ tiếp cận tràn dịch màng phổi (TDMP) theo tiêu chuẩn Light, sau khi theo dõi người bệnh không cải thiện triệu chứng TDMP thì bác sĩ cần làm gì tiếp theo:","options":[{"label":"A","text":"Tiếp tục tiến hành lại các kỹ thuật chẩn đoán TDMP ."},{"label":"B","text":"Xét nghiệm dịch màng phổi tìm lao ."},{"label":"C","text":"Xem xét soi màng phổi hoặc sinh thiết màng phổi ."},{"label":"D","text":"Điều trị thuyên tắc phổi ."}],"explanation":"Nếu dịch màng phổi kéo dài không cải thiện và chưa có chẩn đoán xác định sau các bước tiếp cận ban đầu, chỉ định tiếp theo là Nội soi màng phổi hoặc Sinh thiết màng phổi (sinh thiết mù hoặc qua nội soi) để lấy mô bệnh học chẩn đoán lao/ung thư. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn dịch màng phổi."},{"number":95,"answer":"C","question":"Trong tràn dịch màng phổi, đặc điểm chẩn đoán tế bào học, chọn Câu sai:","options":[{"label":"A","text":"Đòi hỏi người đọc tiêu bản phải có kinh nghiệm vì tế bào màng phổi có thể chuyển dạng tạo hình ảnh giống ác tính. ."},{"label":"B","text":"Sự hiện diện tế bào bất thường trong dịch màng phổi có khả năng chẩn đoán thấp do phụ thuộc mức độ lan rộng và loại tế bào ung thư. ."},{"label":"C","text":"Kỹ thuật khối tế bào (cell block) không làm tăng khả năng chẩn đoán nguyên nhân ác tính. ."},{"label":"D","text":"Mọi bệnh nhân tràn dịch màng phổi dịch tiết nên được xét nghiệm tế bào học dịch màng phổi. ."}],"explanation":"Kỹ thuật khối tế bào (Cell block) làm tăng đáng kể độ nhạy chẩn đoán ung thư màng phổi so với phết tế bào thông thường (nghiền đọng tế bào và thực hiện hóa mô miễn dịch). Do đó khẳng định \"không làm tăng khả năng chẩn đoán\" là sai. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn dịch màng phổi."},{"number":96,"answer":"D","question":"Đối với tràn dịch màng phổi dịch tiết, trường hợp nghi ngờ lao và ung thư màng phổi, cần chẩn đoán mô bệnh học thông qua kỹ thuật nào:","options":[{"label":"A","text":"Sinh thiết màng phổi mù ."},{"label":"B","text":"Nội soi màng phổi ."},{"label":"C","text":"(A), (B) sai. ."},{"label":"D","text":"(A), (B) đúng ."}],"explanation":"Chẩn đoán mô bệnh học màng phổi có thể thực hiện qua Sinh thiết màng phổi kim mù (cho độ nhạy cao trong lao > 70-80%) hoặc Nội soi màng phổi quan sát trực tiếp và sinh thiết (độ nhạy rất cao > 90-95% cho cả lao và ung thư). Cả A và B đều đúng. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn dịch màng phổi."},{"number":97,"answer":"A","question":"Bệnh nhân xơ gan, đã loại trừ viêm phổi nếu nuôi cấy dịch màng phổi dương tính vi khuẩn và có số lượng bạch cầu trung tính >250 tế bào/mm³ hoặc nuôi cấy âm tính và số lượng bạch cầu trung tính >500 tế bào/mm³ thì nghĩ đến vấn đề gì:","options":[{"label":"A","text":"Viêm màng phổi do vi khuẩn. ."},{"label":"B","text":"Viêm màng phổi phản ứng. ."},{"label":"C","text":"Tràn dịch màng phổi cận viêm. ."},{"label":"D","text":"Tràn dịch màng phổi dịch thấm ."}],"explanation":"Ở bệnh nhân xơ gan cổ trướng có tràn dịch màng phổi, tiêu chuẩn cấy dịch dương tính + Neutrophil > 250/mm3 hoặc cấy âm tính + Neutrophil > 500/mm3 (sau khi trừ xuất huyết) là tiêu chuẩn chẩn đoán Viêm màng phổi do vi khuẩn tự phát (Spontaneous Bacterial Empyema/Pleuritis). Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn dịch màng phổi."},{"number":98,"answer":"B","question":"Tràn dịch màng phổi do lao có cơ chế: (1) trực khuẩn lao xâm nhập vào khoang màng phổi bằng đường máu hoặc đường bạch huyết gây kích thích miễn dịch trung gian tế bào, (2) các ổ hoặc hang có bã đậu nằm dưới màng phổi vỡ vào khoang màng phổi gây ra mủ màng phổi do lao.","options":[{"label":"A","text":"(1) đúng, (2) sai ."},{"label":"B","text":"(1) đúng, (2) đúng ."},{"label":"C","text":"(1) sai, (2) đúng ."},{"label":"D","text":"(1) sai, (2) sai ."}],"explanation":"Tràn dịch màng phổi do lao có 2 cơ chế chính: (1) Trực khuẩn lao đến màng phổi qua đường máu/bạch huyết gây phản ứng dị ứng đáp ứng miễn dịch trung gian tế bào (thường gặp nhất gây tràn dịch dịch tiết), (2) Ổ hoại tử bã đậu dưới màng phổi vỡ trực tiếp vào khoang màng phổi gây mủ màng phổi do lao. Cả hai cơ chế đều đúng. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn dịch màng phổi."},{"number":99,"answer":"B","question":"Tính chất tràn dịch màng phổi cạnh viêm:","options":[{"label":"A","text":"Số lượng tế bào từ 500 – 100 tế bào/mm³ với lympho > 70%, tế bào biểu mô < 5% ."},{"label":"B","text":"Cấy dịch màng phổi có thể dương tính ."},{"label":"C","text":"Dịch tiết, ADA ở ngưỡng chẩn đoán từ 40 – 60 UI/L ."},{"label":"D","text":"Xét nghiệm mô bệnh học có giá trị quyết định chẩn đoán ."}],"explanation":"Tràn dịch màng phổi cạnh viêm có biến chứng/mủ màng phổi thì xét nghiệm cấy dịch màng phổi có thể dương tính với vi khuẩn gây bệnh. Ưu thế Lympho > 70%, ADA 40-60 UI/L và mô bệnh học quyết định là đặc điểm của Lao màng phổi. Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn dịch màng phổi."},{"number":100,"answer":"D","question":"Trong sơ đồ tiếp cận điều trị tràn dịch màng phổi do ung thư, sau khi đánh giá bệnh nhân có khả năng sống hơn 1 tuần thì cần làm gì tiếp theo:","options":[{"label":"A","text":"Gây dày dính màng phổi ."},{"label":"B","text":"Tìm nguyên nhân khác gây khó thở ."},{"label":"C","text":"Điều trị giảm nhẹ ."},{"label":"D","text":"Đặt catheter đường hầm màng phổi ."}],"explanation":"Trong sơ đồ quản lý tràn dịch màng phổi ác tính, nếu phổi không thể tái giãn nở (trapped lung) và tiên lượng sống > 1 tuần, lựa chọn tối ưu để giải soát khó thở lâu dài là Đặt catheter đường hầm màng phổi (Indwelling Pleural Catheter - IPC). Nguồn tham khảo: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ (2024), Bài Tràn dịch màng phổi."}]},{"name":"2025_1_Đề thi môn hô hấp năm","questions":[{"number":1,"question":"Tại Việt Nam, năm 2012, tỷ lệ mắc hen ở người lớn là:","options":[{"label":"A","text":"4.1%"},{"label":"B","text":"4,2%"},{"label":"C","text":"4.3%"},{"label":"D","text":"4.4%"}],"answer":"B","explanation":"Theo nghiên cứu cắt ngang năm 2012 công bố trong Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, tỷ lệ mắc hen phế quản ở người lớn tại Việt Nam là 4,1%."},{"number":2,"question":"Đặc điểm bệnh hen phế quản, NGOẠI TRỪ:","options":[{"label":"A","text":"Viêm mạn tính đường thở"},{"label":"B","text":"Cơn hen không thể hồi phục tự nhiên"},{"label":"C","text":"Giới hạn luồng khí thở ra dao động"},{"label":"D","text":"Các cơn hen xảy ra với mức độ khác nhau"}],"answer":"B","explanation":"Hen phế quản là bệnh đa cơ chế, đặc trưng bởi tình trạng viêm mạn tính đường thở và sự dao động về giới hạn luồng khí thở ra. Các cơn hen xảy ra với mức độ khác nhau và có thể hồi phục tự nhiên hoặc sau điều trị. Do đó B là phát biểu sai/ngoại trừ. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Hen phế quản)."},{"number":3,"question":"Tình trạng viêm đường thở trong hen:","options":[{"label":"A","text":"Tồn tại dai dẳng ngay cả khi không có triệu chứng"},{"label":"B","text":"Chỉ ảnh hưởng đến các đường thở nhỏ"},{"label":"C","text":"Hen càng nặng thì mức độ viêm càng nhiều"},{"label":"D","text":"Chỉ tồn tại trong cơn hen cấp"}],"answer":"A","explanation":"Tình trạng viêm đường thở trong hen phế quản tồn tại dai dẳng ngay cả khi người bệnh không có triệu chứng lâm sàng. Mối liên quan giữa độ nặng của hen và mức độ viêm không rõ ràng và tình trạng viêm ảnh hưởng đến toàn bộ đường thở. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Hen phế quản)."},{"number":4,"question":"Trong hen phế quản, quá trình viêm đường thở thường bắt đầu ở:","options":[{"label":"A","text":"Tế bào đài"},{"label":"B","text":"Tế bào cơ trơn"},{"label":"C","text":"Tuyến dưới niêm"},{"label":"D","text":"Tế bào biểu mô"}],"answer":"D","explanation":"Lớp tế bào biểu mô đường thở đóng vai trò khởi phát và có liên quan chặt chẽ với sinh bệnh học hen. Khi bị kích thích bởi virus, chất ô nhiễm hoặc dị nguyên, tế bào biểu mô giải phóng các chất trung gian hóa học làm tập trung và hoạt hóa các tế bào viêm. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":5,"question":"Trong hen phế quản không do dị ứng, việc kích thích các tế bào biểu mô có thể do, NGOẠI TRỪ:","options":[{"label":"A","text":"Dị nguyên"},{"label":"B","text":"Nhiễm virus"},{"label":"C","text":"Nhiễm vi khuẩn"},{"label":"D","text":"Do tiếp xúc với chất độc hại"}],"answer":"A","explanation":"Ở thể hen không do dị ứng, việc kích thích tế bào biểu mô đường thở thường do nhiễm virus, vi khuẩn hoặc phơi nhiễm chất độc hại môi trường; dị nguyên là yếu tố kích thích thuộc cơ chế dị ứng. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":6,"question":"Tế bào viêm trong đường thở ở bệnh hen, NGOẠI TRỪ:","options":[{"label":"A","text":"Bạch cầu ái toan"},{"label":"B","text":"Bạch cầu đa nhân trung tính"},{"label":"C","text":"Bạch cầu lympho B"},{"label":"D","text":"Bạch cầu ái kiềm"}],"answer":"C","explanation":"Các tế bào tham gia chính vào phản ứng viêm đường thở trong hen gồm tế bào mast, bạch cầu ái toan, bạch cầu đa nhân trung tính, đại thực bào, tế bào đuôi gai và bạch cầu lympho T (Th2/TCD8+). Lympho B tạo antibody IgE ở cơ quan bạch huyết chứ không phải tế bào viêm đường thở điển hình trong danh sách này. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":7,"question":"Vai trò của bạch cầu ái toan trong cơ chế bệnh sinh bệnh hen:","options":[{"label":"A","text":"Phóng thích các chất trung gian gây co thắt phế quản như Histamin, prostaglandin D2"},{"label":"B","text":"Phóng thích protein cơ bản gây phá hủy tế bào biểu mô đường thở"},{"label":"C","text":"Phóng thích các cytokine đặc hiệu"},{"label":"D","text":"Trình diện kháng nguyên"}],"answer":"B","explanation":"Bạch cầu ái toan gia tăng trên đường thở ở hầu hết bệnh nhân hen và phóng thích các protein hạt, đặc biệt là protein cơ bản (MBP - major basic protein), gây tổn thương và bong tróc tế bào biểu mô đường thở. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":8,"question":"Các chất trung gian chính gây viêm trong hen, NGOẠI TRỪ:","options":[{"label":"A","text":"Chemokines"},{"label":"B","text":"Cysteinyl leukotrienes"},{"label":"C","text":"IgA"},{"label":"D","text":"Cytokines"}],"answer":"C","explanation":"Các chất trung gian chính gây viêm trong sinh bệnh học hen bao gồm chemokines, cysteinyl leukotrienes, cytokines, histamine, NO, IgE và prostaglandin D2. Kháng thể IgA không thuộc nhóm các chất trung gian gây viêm này. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":9,"question":"Chất quyết định mức độ nặng trong hen:","options":[{"label":"A","text":"Chemokines"},{"label":"B","text":"Cysteinyl leukotrienes"},{"label":"C","text":"Cytokines"},{"label":"D","text":"Histamine"}],"answer":"C","explanation":"Cytokines (như IL-4, IL-5, IL-13, TNF-alpha) do tế bào lympho T và các tế bào cấu trúc tiết ra tác động trực tiếp duy trì đáp ứng viêm mạn tính và là các chất chính quyết định mức độ nặng của hen phế quản. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":10,"question":"Lâm sàng bệnh hen phế quản có hơn 1 triệu chứng đặc trưng như ho, khó thở, nặng ngực và:","options":[{"label":"A","text":"Khạc đàm"},{"label":"B","text":"Sốt"},{"label":"C","text":"Khò khè"},{"label":"D","text":"Đánh trống ngực"}],"answer":"C","explanation":"Bốn triệu chứng hô hấp đặc trưng của bệnh hen phế quản là ho, khò khè, khó thở và nặng ngực. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, GINA 2023)."},{"number":11,"question":"Gợi ý hen phế quản khi dao động PEF trong ngày:","options":[{"label":"A","text":">5% trong 1-2 tuần"},{"label":"B","text":">10% trong 1-2 tuần"},{"label":"C","text":">15% trong 1-2 tuần"},{"label":"D","text":">20% trong 1-2 tuần"}],"answer":"B","explanation":"Bằng chứng về giới hạn luồng khí dao động gợi ý chẩn đoán hen ở người lớn khi mức dao động PEF trung bình ngày > 10% (đo 2 lần/ngày) trong 1–2 tuần. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Hen phế quản, Bảng 2.1)."},{"number":12,"question":"Gợi ý hen phế quản khi PEF sau 4 tuần điều trị ICS cải thiện:","options":[{"label":"A","text":"5%"},{"label":"B","text":"10%"},{"label":"C","text":"15%"},{"label":"D","text":"20%"}],"answer":"D","explanation":"Tiêu chuẩn củng cố chẩn đoán hen khi chức năng hô hấp cải thiện rõ sau điều trị kháng viêm: FEV1 tăng hơn 12% và 200 mL hoặc PEF tăng > 20% so với ban đầu sau 4 tuần điều trị với ICS ngoài đợt nhiễm trùng hô hấp. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bảng 2.1)."},{"number":13,"question":"Xét nghiệm dấu ấn viêm đường thở trong hen phế quản giúp:","options":[{"label":"A","text":"Đánh giá kiểm soát"},{"label":"B","text":"Chẩn đoán xác định"},{"label":"C","text":"Chẩn đoán bậc"},{"label":"D","text":"Chẩn đoán phân biệt"}],"answer":"A","explanation":"Các dấu ấn viêm đường thở như đo nồng độ FeNO (phân suất NO khí thở ra) hay đếm tế bào bạch cầu ái toan trong đàm không dùng để chẩn đoán xác định hen mà vai trò chủ yếu nằm ở việc đánh giá mức độ kiểm soát hen và theo dõi đáp ứng điều trị với ICS. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":14,"question":"Nhóm bệnh có tắc nghẽn luồng khí cần chẩn đoán phân biệt với hen, NGOẠI TRỪ:","options":[{"label":"A","text":"Bệnh phổi tắc nghẽn mạn tính"},{"label":"B","text":"Giãn phế quản"},{"label":"C","text":"Dị vật đường thở"},{"label":"D","text":"Bệnh phổi mô kẽ"}],"answer":"D","explanation":"Các bệnh lý gây tắc nghẽn luồng khí cần chẩn đoán phân biệt với hen gồm BPTNMT, giãn phế quản, dị vật hít, hẹp đường thở lớn... Trong khi đó, bệnh phổi mô kẽ (ILD) đặc trưng bởi rối loạn thông khí hạn chế chứ không phải rối loạn tắc nghẽn. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":15,"question":"Cơn hen phế quản biểu hiện, NGOẠI TRỪ:","options":[{"label":"A","text":"Tăng triệu chứng khó thở, khò khè, đau ngực, ho"},{"label":"B","text":"Giảm chức năng phổi"},{"label":"C","text":"Cơn thay đổi điều trị so với thường ngày"},{"label":"D","text":"Cơn hen phế quản sẽ diễn tiến nặng hơn ở những trường hợp chưa được chẩn đoán trước"}],"answer":"D","explanation":"Cơn hen phế quản (đợt cấp) là những đợt tăng triệu chứng khó thở, ho, khò khè hay đau ngực kèm suy giảm chức năng phổi so với thường ngày và cần thay đổi điều trị. Diễn tiến đợt cấp phụ thuộc mức độ nặng và đáp ứng điều trị chứ không mặc nhiên diễn tiến nặng hơn ở trường hợp chưa chẩn đoán trước. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Hen phế quản)."},{"number":16,"question":"Cận lâm sàng thực hiện ở bệnh nhân có cơn hen cấp giáp, NGOẠI TRỪ:","options":[{"label":"A","text":"Chẩn đoán xác định"},{"label":"B","text":"Đánh giá mức độ cơn hen"},{"label":"C","text":"Chẩn đoán phân biệt"},{"label":"D","text":"Xác định biến chứng"}],"answer":"A","explanation":"Khi bệnh nhân vào cơn hen cấp, các thăm dò cận lâm sàng (như SpO2, khí máu, X-quang) tập trung đánh giá mức độ nặng của cơn, chẩn đoán phân biệt và phát hiện biến chứng (tràn khí màng phổi...); việc chẩn đoán xác định hen bằng hô hấp ký không thực hiện ngay trong lúc cấp cứu do bệnh nhân không thể thực hiện nghiệm pháp gắng sức. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":17,"question":"Bệnh nhân nữ, 50 tuổi, tiền sử hen phế quản, vào viện vì tăng khó thở. Tình trạng nhập viện: Tỉnh táo, nói được câu ngắn, M 100 lần/phút, co kéo cơ hô hấp phụ. Chẩn đoán mức độ cơn hen:","options":[{"label":"A","text":"Nhẹ"},{"label":"B","text":"Trung bình"},{"label":"C","text":"Nặng"},{"label":"D","text":"Nguy kịch"}],"answer":"B","explanation":"Đối chiếu Bảng 2.8 phân độ nặng cơn hen: bệnh nhân nói được cụm từ/câu ngắn, thích ngồi, nhịp tim 100–120 lần/phút, có co kéo nhẹ cơ hô hấp phụ phù hợp với cơn hen phế quản mức độ trung bình. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":18,"question":"Yếu tố nguy cơ của cơn hen, NGOẠI TRỪ:","options":[{"label":"A","text":"Hen không kiểm soát"},{"label":"B","text":"Sử dụng nhiều thuốc SABA cắt cơn"},{"label":"C","text":"Sử dụng ICS theo bậc"},{"label":"D","text":"Vấn đề tâm lý, xã hội"}],"answer":"C","explanation":"Hen không kiểm soát, lạm dụng SABA và các vấn đề tâm lý xã hội là yếu tố nguy cơ dẫn đến đợt cấp. Việc tuân thủ điều trị ICS đúng bậc là yếu tố bảo vệ giúp kiểm soát hen và giảm nguy cơ xuất hiện cơn hen cấp. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":19,"question":"Yếu tố nguy cơ tử vong do cơn hen:","options":[{"label":"A","text":"Nhập viện vì cơn hen trong năm qua"},{"label":"B","text":"Phơi nhiễm khói thuốc, dị nguyên"},{"label":"C","text":"Sử dụng ICS không đủ"},{"label":"D","text":"Có thể liên quan đến kỹ thuật hít thuố
