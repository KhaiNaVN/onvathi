c"}],"answer":"A","explanation":"Giáo trình liệt kê tiền sử từng nhập viện hoặc vào phòng cấp cứu vì cơn hen trong 12 tháng qua là một trong những yếu tố nguy cơ hàng đầu dự đoán đợt cấp nặng và tử vong liên quan đến hen. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":20,"question":"Nguyên tắc chung xử trí cơn hen nặng:","options":[{"label":"A","text":"Xử trí thuốc trước, thủ thuật cấp cứu sau"},{"label":"B","text":"Thủ thuật cấp cứu trước, xử trí thuốc sau"},{"label":"C","text":"Chỉ xử trí thuốc"},{"label":"D","text":"Xử trí theo kinh nghiệm của bác sĩ"}],"answer":"A","explanation":"Nguyên tắc chung xử trí cơn hen phế quản cấp trong bệnh viện: đối với Cơn nặng - xử trí thuốc trước, thủ thuật cấp cứu sau; đối với Cơn nguy kịch - tiến hành thủ thuật cấp cứu trước, xử trí thuốc sau. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 8.5.1)."},{"number":21,"question":"Nguyên tắc chung xử trí cơn hen phế quản cấp là:","options":[{"label":"A","text":"Xử trí tại nhà trước rồi nhập viện"},{"label":"B","text":"Đưa ngay đến bệnh viện tỉnh"},{"label":"C","text":"Tìm trạm y tế gần nhà để xử trí"},{"label":"D","text":"Xử trí tại nhà sau đó đánh giá kế hoạch hành động tiếp theo"}],"answer":"D","explanation":"Bệnh nhân cần xử trí ban đầu ngay tại nhà theo Kế hoạch hành động hen đã được hướng dẫn (tăng tần suất SABA/ICS-Formoterol), sau đó đánh giá mức độ đáp ứng để quyết định các bước tiếp theo hoặc tiếp cận cơ sở y tế. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":22,"question":"Bệnh nhân nữ, 40 tuổi, tiền sử hen phế quản, vào viện vì tăng khó thở. Tình trạng nhập viện: Tỉnh táo, nói được nguyên câu, M 88 lần/phút, không co kéo cơ hô hấp phụ. Xử trí ban đầu cơn hen cấp mức độ nhẹ nào không phù hợp:","options":[{"label":"A","text":"SABA 4-10 nhát MDI qua spacer, lặp lại mỗi 20 phút trong 1h"},{"label":"B","text":"Prednisolone 1mg/Kg/ngày, uống"},{"label":"C","text":"Oxy đảm bảo SaO2 >94%"},{"label":"D","text":"Xem xét Magnesium tĩnh mạch"}],"answer":"D","explanation":"Bệnh nhân có cơn hen cấp mức độ nhẹ. Magnesium sulfate tĩnh mạch chỉ được xem xét ở những trường hợp cơn hen cấp mức độ nặng hoặc không đáp ứng với điều trị ban đầu sau 1 giờ, không chỉ định cho cơn hen nhẹ. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":23,"question":"Theophylline trong điều trị cơn hen phế quản cấp:","options":[{"label":"A","text":"Hiệu quả giãn phế quản như thuốc nhóm kích thích Beta 2"},{"label":"B","text":"Liều 2g, 1 ống pha trong 100ml dung dịch nước muối đẳng trương truyền trong một giờ"},{"label":"C","text":"Có thể truyền duy trì nhưng không quá 20mg/kg/ngày"},{"label":"D","text":"Nên định lượng theophyllin huyết thanh"}],"answer":"D","explanation":"Methylxanthine (Theophylline/Diaphyllin) hiện không được khuyến cáo thường quy do hiệu quả giãn phế quản kém hơn SABA và độc tính cao; nếu sử dụng bắt buộc phải theo dõi sát lâm sàng và tốt nhất là định lượng nồng độ theophylline huyết thanh. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":24,"question":"Sử dụng corticosteroid bắt đầu trị cơn hen cấp, NGOẠI TRỪ:","options":[{"label":"A","text":"Kết hợp liều cao ICS và salbutamol cho hiệu quả giãn phế quản tốt hơn salbutamol đơn thuần"},{"label":"B","text":"Hiệu quả phòng cơn cấp tái phát của ICS là thấp hơn so với corticosteroid uống"},{"label":"C","text":"Bệnh nhân ra khỏi phòng cấp cứu kết hợp corticosteroid uống với ICS sẽ có tỷ lệ cơn tái phát thấp hơn corticosteroid uống đơn thuần"},{"label":"D","text":"Liều cao ICS làm giảm được tái phát tương đương với 40mg prednisolone"}],"answer":"B","explanation":"Các nghiên cứu chứng minh hiệu quả phòng ngừa đợt cấp tái phát của ICS liều cao tương đương với corticosteroid đường uống (như Prednisolone 40mg), chứ không thấp hơn. Do đó phát biểu B là phát biểu sai. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":25,"question":"Đánh giá một trường hợp cơn hen ra viện, NGOẠI TRỪ:","options":[{"label":"A","text":"Các triệu chứng cải thiện với SABA"},{"label":"B","text":"PEF cải thiện và >20% giá trị dự đoán"},{"label":"C","text":"SaO2 >90% (khí phòng)"},{"label":"D","text":"Bệnh nhân đã được chuyển thuốc đường uống, hít"}],"answer":"B","explanation":"Tiêu chuẩn ra viện sau cơn hen cấp yêu cầu lâm sàng ổn định, các triệu chứng cải thiện không cần dùng SABA thường xuyên, và PEF cải thiện rõ rệt (thường phải đạt > 60–80% giá trị dự đoán hoặc giá trị tốt nhất của bệnh nhân) chứ không chỉ dừng ở mức > 20%. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Sơ đồ 2.5)."},{"number":26,"question":"Nghiên cứu dịch tễ học tại Việt Nam (2011) cho thấy, tỉ lệ mắc bệnh chung của bệnh phổi tắc nghẽn mạn tính ở nam giới là:","options":[{"label":"A","text":"7,1%"},{"label":"B","text":"4,2%"},{"label":"C","text":"4,1%"},{"label":"D","text":"1,9%"}],"answer":"A","explanation":"Theo nghiên cứu dịch tễ học tại Việt Nam công bố trong Giáo trình Hô hấp Sau đại học, tỷ lệ mắc BPTNMT chung ở người lớn là 4,2%, trong đó ở nam giới là 7,1% và nữ giới là 1,9%. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài BPTNMT, Mục 2)."},{"number":27,"question":"Yếu tố nguy cơ nào KHÔNG gây bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"Các chất gây ô nhiễm khí thở"},{"label":"B","text":"Thuốc lá"},{"label":"C","text":"Bất thường về di truyền"},{"label":"D","text":"Nhiễm trùng đường thở cấp tính"}],"answer":"D","explanation":"Yếu tố nguy cơ gây BPTNMT bao gồm thuốc lá, phơi nhiễm nhiên liệu sinh khối, ô nhiễm môi trường và yếu tố di truyền (thiếu alpha-1 antitrypsin). Nhiễm trùng đường thở cấp tính là yếu tố khởi phát đợt cấp chứ không phải nguyên nhân gây ra BPTNMT. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":28,"question":"Triệu chứng đường thở cấp tính KHÔNG phù hợp với bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"Triệu chứng hô hấp và giới hạn luồng khí thở dai dẳng"},{"label":"B","text":"Bất thường ở đường dẫn khí hoặc phế nang"},{"label":"C","text":"Thể lâm sàng bao gồm viêm phế quản mạn và khí phế thũng"},{"label":"D","text":"Được chẩn đoán xác định bằng hô hấp ký"}],"answer":"C","explanation":"Theo định nghĩa GOLD hiện đại, BPTNMT được đặc trưng bởi triệu chứng hô hấp mạn tính và giới hạn luồng khí cố định/dai dẳng, không còn phân loại đơn thuần thành 2 thể lâm sàng tách biệt là viêm phế quản mạn và khí phế thũng như trước đây. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài BPTNMT)."},{"number":29,"question":"Các rối loạn chủ yếu của bệnh phổi tắc nghẽn mạn tính, NGOẠI TRỪ:","options":[{"label":"A","text":"Sự phơi nhiễm lâu dài với khói thuốc lá ở những người nhạy cảm sẽ thúc đẩy quá trình viêm và huy động các tế bào miễn dịch vào trong đường thở và phế nang."},{"label":"B","text":"Các tế bào viêm phóng thích anti-proteases làm tổn thương cấu trúc ngoại bào nâng đỡ đường thở, mao mạch và lớp bề mặt trao đổi khí của phổi."},{"label":"C","text":"Sự chết của các tế bào cấu trúc dẫn đến mất tính đàn nở của đường thở nhỏ, cắt xén mạch máu và phá hủy phế nang."},{"label":"D","text":"Quá trình sửa chữa bất thường của elastin và các thành phần cấu trúc ngoại bào khác góp phần làm giãn nở khoảng khí và khí phế thũng."}],"answer":"B","explanation":"Trong cơ chế bệnh sinh BPTNMT, các tế bào viêm phóng thích proteinases (chứ không phải anti-proteases) gây phá hủy cấu trúc ma trận ngoại bào. Anti-proteases là chất bảo vệ phổi khỏi sự thủy phân protein. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 4.1)."},{"number":30,"question":"Vai trò của đại thực bào trong cơ chế bệnh sinh bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"Tiết ra Neutrophil elastase, Neutrophil cathepsin G và Neutrophil proteinase-3"},{"label":"B","text":"Giải phóng các chất oxy hóa, oxit nito, yếu tố hoại tử u (TNF- α), IL-8, LTB-4"},{"label":"C","text":"Giải phóng perforin, granzyme B và TNF-α"},{"label":"D","text":"Tiết ra các anti-proteinase"}],"answer":"B","explanation":"Đại thực bào phế nang khi bị kích thích bởi khói thuốc lá sẽ giải phóng các chất trung gian gây viêm quan trọng như các chất oxy hóa, nitric oxide, TNF-alpha, IL-8 và LTB-4 giúp thu hút bạch cầu trung tính và duy trì đáp ứng viêm. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":31,"question":"Phát biểu đúng về enzyme ức chế proteinase trong cơ chế bệnh sinh của bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"Giải phóng từ bạch cầu đa nhân"},{"label":"B","text":"Giải phóng từ đại thực bào"},{"label":"C","text":"Tác dụng giáng hoá protein của tổ chức gian bào"},{"label":"D","text":"Có tác dụng bảo vệ đường hô hấp"}],"answer":"D","explanation":"Enzyme ức chế proteinase (như Alpha-1 antitrypsin, SLPI) có vai trò đối kháng với hoạt tính thủy phân của proteinase, từ đó có tác dụng bảo vệ cấu trúc nhu mô và đường hô hấp. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":32,"question":"Tình trạng hẹp lòng đường thở trong COPD do nhiều tác động, NGOẠI TRỪ:","options":[{"label":"A","text":"Xơ hoá đường thở"},{"label":"B","text":"Tăng ứ đọng đàm"},{"label":"C","text":"Phá huỷ khoảng trao đổi khí"},{"label":"D","text":"Thâm nhiễm tế bào"}],"answer":"C","explanation":"Tình trạng hẹp lòng đường thở nhỏ trong BPTNMT do xơ hóa quanh phế quản, tăng tiết và ứ đọng đờm nhầy, phù nề niêm mạc và thâm nhiễm tế bào viêm. Phá hủy khoảng trao đổi khí (phế nang) là cơ chế gây khí phế thũng chứ không trực tiếp gây hẹp lòng đường thở. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 4.2)."},{"number":33,"question":"Hậu quả của việc giảm oxy và tăng CO2 máu trong bệnh phổi tắc nghẽn mạn tính là do, NGOẠI TRỪ:","options":[{"label":"A","text":"Tắc nghẽn đường thở"},{"label":"B","text":"Phá hủy nhu mô"},{"label":"C","text":"Bất thường mạch máu phổi"},{"label":"D","text":"Giảm kích thích trung tâm hô hấp"}],"answer":"D","explanation":"Bất thường trao đổi khí (giảm O2 và tăng CO2) ở bệnh nhân BPTNMT là hậu quả của tắc nghẽn đường thở, phá hủy nhu mô phổi và bất thường mạch máu phổi gây mất cân bằng thông khí/tưới máu (V/Q). Trung tâm hô hấp ở bệnh nhân BPTNMT thường phải tăng hoạt động để duy trì thông khí. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 4.2)."},{"number":34,"question":"Tình trạng tăng áp động mạch phổi ở bệnh phổi tắc nghẽn mạn tính xuất hiện khi giảm oxy máu:","options":[{"label":"A","text":"< 80mmHg"},{"label":"B","text":"< 60mmHg"},{"label":"C","text":"< 55mmHg"},{"label":"D","text":"< 50mmHg"}],"answer":"B","explanation":"Tăng áp động mạch phổi phát triển ở giai đoạn nặng của bệnh BPTNMT khi có tình trạng giảm oxy máu nặng dai dẳng (PaO2 < 60 mmHg), dẫn đến co mạch phổi mạn tính và tái cấu trúc thành mạch. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 4.2)."},{"number":35,"question":"Phân loại mMRC = 3 điểm là bệnh nhân khó thở khi:","options":[{"label":"A","text":"Gắng sức nặng"},{"label":"B","text":"Đi lại nhanh trên mặt bằng"},{"label":"C","text":"Khó thở ngay trong các động tác sinh hoạt nhẹ"},{"label":"D","text":"Đi lại trong khoảng 100m"}],"answer":"D","explanation":"Theo thang điểm mMRC: Độ 3 là bệnh nhân phải dừng lại để thở sau khi đi bộ khoảng 100 m hoặc sau vài phút trên đường bằng. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 7.3.2)."},{"number":36,"question":"Bệnh nhân bệnh phổi tắc nghẽn mạn tính, kết quả hô hấp ký sau test hồi phục phế quản FEV1/FVC = 0,62 và FEV1 84%. Hãy kết luận giai đoạn bệnh:","options":[{"label":"A","text":"GOLD 1"},{"label":"B","text":"GOLD 2"},{"label":"C","text":"GOLD 3"},{"label":"D","text":"GOLD 4"}],"answer":"A","explanation":"Chỉ số FEV1/FVC = 0,62 (< 0,70) xác nhận có tắc nghẽn luồng khí cố định. FEV1 = 84% giá trị dự đoán (FEV1 >= 80%) xếp vào mức độ tắc nghẽn nhẹ - GOLD 1. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Sơ đồ 1.1)."},{"number":37,"question":"Bệnh nhân nam, 60 tuổi, được chẩn đoán bệnh phổi tắc nghẽn mạn tính FEV1 78%, nhóm A. Đánh giá triệu chứng/nguy cơ đợt kịch phát của bệnh nhân này:","options":[{"label":"A","text":"Ít triệu chứng, nguy cơ thấp"},{"label":"B","text":"Ít triệu chứng, nguy cơ cao"},{"label":"C","text":"Nhiều triệu chứng, nguy cơ thấp"},{"label":"D","text":"Nhiều triệu chứng, nguy cơ cao"}],"answer":"A","explanation":"Theo phân nhóm GOLD 2023 (phân nhóm ABE), Nhóm A đại diện cho bệnh nhân có ít triệu chứng (mMRC 0-1 hoặc CAT < 10) và nguy cơ đợt cấp thấp (0 hoặc 1 đợt cấp trung bình trong năm trước, không nhập viện). (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Sơ đồ 1.1)."},{"number":38,"question":"Vi khuẩn gây bệnh phổ biến trong đợt cấp bệnh phổi tắc nghẽn mạn tính, NGOẠI TRỪ:","options":[{"label":"A","text":"S. pneumoniae"},{"label":"B","text":"M. catarrhalis"},{"label":"C","text":"H. influenzae"},{"label":"D","text":"Trực khuẩn gram âm"}],"answer":"D","explanation":"Ba vi khuẩn gây bệnh phổ biến nhất trong đợt cấp BPTNMT thông thường là Haemophilus influenzae, Streptococcus pneumoniae và Moraxella catarrhalis. Trực khuẩn Gram âm (như Pseudomonas aeruginosa) chủ yếu gặp ở bệnh nhân nặng, FEV1 thấp hoặc có nguy cơ đặc biệt. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":39,"question":"Đợt cấp bệnh phổi tắc nghẽn mạn tính, NGOẠI TRỪ:","options":[{"label":"A","text":"Bệnh trở nên xấu đi vượt quá dao động hằng ngày"},{"label":"B","text":"Virus gây bệnh phổ biến là Coronavirus, Rhinovirus, Paramyxovirus"},{"label":"C","text":"Khoảng 10% đợt cấp không xác định căn nguyên"},{"label":"D","text":"Ô nhiễm khí thở cũng là nguyên nhân gây bệnh"}],"answer":"C","explanation":"Giáo trình nêu rõ khoảng 1/3 (tương đương ~30%) các trường hợp đợt cấp BPTNMT không thể xác định được nguyên nhân vi sinh hay môi trường cụ thể. Do đó con số \"10%\" ở câu C là sai/ngoại trừ. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":40,"question":"Yếu tố dự đoán nguy cơ nhiễm khuẩn trong đợt cấp bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"Bệnh phổi tắc nghẽn mạn tính giai đoạn I"},{"label":"B","text":"Có đàm mủ"},{"label":"C","text":"Tần suất đợt cấp ≥ 2 lần trong năm trước"},{"label":"D","text":"Sử dụng kháng sinh trong 6 tháng gần đây"}],"answer":"B","explanation":"Sự xuất hiện của đờm mủ (hoặc tăng độ mủ của đờm) là dấu hiệu lâm sàng tin cậy nhất dự đoán sự hiện diện của vi khuẩn và là tiêu chuẩn chính để chỉ định điều trị kháng sinh trong đợt cấp BPTNMT. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 9.3.5)."},{"number":41,"question":"Yếu tố nguy cơ nhiễm Pseudomonas spp (GOLD 2007) trong đợt cấp bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"Bệnh phổi tắc nghẽn mạn tính mức độ nặng"},{"label":"B","text":"Mới nhập viện trong vòng 30 ngày"},{"label":"C","text":"Điều trị kháng sinh ≥ 2 đợt/năm"},{"label":"D","text":"Bệnh nhân có kèm hen phế quản"}],"answer":"A","explanation":"Theo các tiêu chuẩn phân loại nguy cơ (GOLD), bệnh nhân BPTNMT mức độ nặng (FEV1 < 50% dự đoán), có tiền sử phân lập P. aeruginosa hoặc đợt cấp phải thông khí nhân tạo là yếu tố nguy cơ nhiễm Pseudomonas spp. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 9.3.5)."},{"number":42,"question":"Chọn lựa kháng sinh đầu tiên điều trị đợt cấp bệnh phổi tắc nghẽn mạn tính mức độ nhẹ:","options":[{"label":"A","text":"Betalactam"},{"label":"B","text":"Betalactam/kháng betalactamase"},{"label":"C","text":"Fluoroquinolon"},{"label":"D","text":"Phối hợp fluoroquinolon + Cephalosporin"}],"answer":"A","explanation":"Theo ngân hàng câu hỏi và hướng dẫn điều trị đợt cấp BPTNMT mức độ nhẹ (ngoại trú, không có yếu tố nguy cơ kết cục xấu), lựa chọn kháng sinh kinh nghiệm ban đầu là Betalactam thông thường (như Amoxicillin) hoặc Macrolid/Tetracyclin. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":43,"question":"Chọn lựa kháng sinh điều trị đợt cấp bệnh phổi tắc nghẽn mạn tính mức độ trung bình, không nguy cơ nhiễm trực khuẩn mủ xanh:","options":[{"label":"A","text":"Ertapenem + Fluoroquinolon"},{"label":"B","text":"Betalactam/ kháng betalactamase + Fluoroquinolon"},{"label":"C","text":"Ertapenem"},{"label":"D","text":"Phối hợp Fluoroquinolon + Cephalosporin"}],"answer":"B","explanation":"Đợt cấp mức độ trung bình không có nguy cơ Pseudomonas ưu tiên sử dụng nhóm Betalactam kết hợp chất ức chế Beta-lactamase (như Amoxicillin-clavulanate, Ampicillin-sulbactam) hoặc Fluoroquinolone hô hấp. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 9.3.5)."},{"number":44,"question":"Chọn lựa kháng sinh điều trị đợt cấp bệnh phổi tắc nghẽn mạn tính mức độ trung bình có nguy cơ nhiễm trực khuẩn mủ xanh:","options":[{"label":"A","text":"Ertapenem"},{"label":"B","text":"Moxifloxacin"},{"label":"C","text":"Amoxicillin/acid clavulanic"},{"label":"D","text":"Piperacillin-tazobactam"}],"answer":"D","explanation":"Khi có yếu tố nguy cơ nhiễm Pseudomonas aeruginosa, bắt buộc chọn kháng sinh có phổ kháng trực khuẩn mủ xanh như Piperacillin-tazobactam, Cefepime, Ceftazidime hoặc Ciprofloxacin/Levofloxacin. Piperacillin-tazobactam là đáp án chính xác trong các lựa chọn. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":45,"question":"Liều Betalactam/kháng betalactamase trong điều trị đợt cấp bệnh phổi tắc nghẽn mạn tính liều tối thiểu là:","options":[{"label":"A","text":"2g/ngày"},{"label":"B","text":"3g/ngày"},{"label":"C","text":"4g/ngày"},{"label":"D","text":"6g/ngày"}],"answer":"B","explanation":"Theo ngân hàng câu hỏi của bộ môn Nội, liều tối thiểu khuyến cáo cho nhóm Betalactam/chất ức chế beta-lactamase đường uống/tiêm trong đợt cấp BPTNMT là 3g/ngày (ví dụ Amoxicillin/clavulanate 1g x 3 lần/ngày). (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":46,"question":"Thuốc giãn phế quản thuộc nhóm kích thích beta 2 adrenergic trong xử trí đợt cấp bệnh phổi tắc nghẽn mạn tính, NGOẠI TRỪ:","options":[{"label":"A","text":"Salbutamol"},{"label":"B","text":"Terbutalin"},{"label":"C","text":"Ipratropium"},{"label":"D","text":"Bambuterol"}],"answer":"C","explanation":"Salbutamol, Terbutalin và Bambuterol là các thuốc thuộc nhóm đồng vận/kích thích thụ thể beta-2 adrenergic. Ipratropium bromide thuộc nhóm thuốc kháng cholinergic (SAMA). (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":47,"question":"Mục tiêu oxy cho bệnh nhân đợt cấp bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"88 – 92%"},{"label":"B","text":"92 – 94%"},{"label":"C","text":"94 – 96%"},{"label":"D","text":"96 – 98%"}],"answer":"A","explanation":"Khởi đầu oxy liệu pháp cho bệnh nhân đợt cấp BPTNMT nhằm duy trì mục tiêu SpO2 trong khoảng 88 – 92% để cải thiện tình trạng thiếu oxy máu mà không làm tăng nguy cơ ức chế trung tâm hô hấp gây tăng CO2 máu nặng. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 9.3.6)."},{"number":48,"question":"Thông khí NIPPV trong đợt cấp bệnh phổi tắc nghẽn mạn tính nhằm các mục tiêu sau, NGOẠI TRỪ:","options":[{"label":"A","text":"Giảm CO2"},{"label":"B","text":"Giảm thông khí phổi"},{"label":"C","text":"Giảm tử vong trong thời gian nằm viện"},{"label":"D","text":"Tránh đặt nội khí quản và thở máy can thiệp"}],"answer":"B","explanation":"Thở máy không xâm nhập (NIPPV) giúp tăng thông khí phế nang, cải thiện toan hô hấp, giảm PaCO2, giảm công thở, tránh đặt nội khí quản và giảm tử vong. Phát biểu \"Giảm thông khí phổi\" trái ngược hoàn toàn với mục đích điều trị. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 9.3.6)."},{"number":49,"question":"Tiêu chuẩn ngưng theo dõi điều trị đợt cấp bệnh phổi tắc nghẽn mạn tính nội trú, NGOẠI TRỪ:","options":[{"label":"A","text":"Nhu cầu sử dụng beta 2 hít <6 lần/ngày"},{"label":"B","text":"Có thể trở lại các sinh hoạt như trước đợt cấp"},{"label":"C","text":"Lâm sàng ổn định trong 24h"},{"label":"D","text":"Khí máu động mạch trở về bình thường"}],"answer":"D","explanation":"Tiêu chuẩn xuất viện gồm nhu cầu SABA < 6 lần/ngày, sinh hoạt trở lại bình thường, lâm sàng và khí máu ổn định trong 12–24h. Bệnh nhân BPTNMT mạn tính thường có bất thường khí máu nền (như tăng CO2 mạn), không bắt buộc khí máu phải trở về hoàn toàn \"bình thường\" như người khỏe mạnh. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 9.3.7)."},{"number":50,"question":"Chọn 1 Câu sai: Đánh giá tiến triển bệnh phổi tắc nghẽn mạn tính","options":[{"label":"A","text":"Cần theo dõi kết quả chức năng phổi hằng năm, đánh giá dung tích chức năng bằng nghiệm pháp đi bộ theo thời gian."},{"label":"B","text":"Đo độ bão hoà oxy trong khí máu động mạch lúc gắng sức để hỗ trợ oxy liệu pháp."},{"label":"C","text":"Sử dụng bộ Câu hỏi trắc nghiệm đánh giá BPTNMT (CAT)."},{"label":"D","text":"Ghi nhận tần suất, mức độ nặng, nguyên nhân của đợt cấp."}],"answer":"B","explanation":"Trong theo dõi tiến triển BPTNMT, đánh giá mức độ bão hòa oxy được thực hiện bằng đo SpO2 ngoaị vi lúc nghỉ (và khí máu động mạch lúc nghỉ nếu SpO2 < 92%) để chỉ định oxy liệu pháp dài hạn tại nhà, chứ không đo độ bão hòa oxy trong khí máu động mạch lúc gắng sức. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 11)."},{"number":51,"question":"Nguy cơ tràn khí màng phổi tăng đáng kể khi:","options":[{"label":"A","text":"Béo phì"},{"label":"B","text":"Hút thuốc lá"},{"label":"C","text":"Ăn mặn"},{"label":"D","text":"Giới tính nữ"}],"answer":"B","explanation":"Hút thuốc lá là yếu tố nguy cơ môi trường quan trọng nhất làm tăng nguy cơ tràn khí màng phổi tự phát nguyên phát (tăng nguy cơ gấp 22 lần ở nam và 9 lần ở nữ). (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn khí màng phổi)."},{"number":52,"question":"Bệnh nhân tràn khí màng phổi/COPD thuộc phân loại tràn khí màng phổi nào:","options":[{"label":"A","text":"Tràn khí màng phổi tự phát nguyên phát"},{"label":"B","text":"Tràn khí màng phổi tự phát thứ phát"},{"label":"C","text":"Tràn khí màng phổi do cơ học"},{"label":"D","text":"Tràn khí màng phổi do chấn thương"}],"answer":"B","explanation":"Tràn khí màng phổi tự phát thứ phát là tình trạng tràn khí xảy ra trên bệnh nhân đã có sẵn bệnh lý nhu mô phổi nền, phổ biến nhất là BPTNMT (COPD)/khí phế thũng. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 3.1)."},{"number":53,"question":"Về cơ chế bệnh sinh TKMP, cơ chế đề xuất vỡ phế nang tự phát gây tràn khí màng phổi là:","options":[{"label":"A","text":"Áp suất trong bao phế quản mạch máu liền kề vẫn cao hơn so với trong phế nang căng phồng quá mức."},{"label":"B","text":"Áp suất trong bao phế quản mạch máu liền kề vẫn thấp hơn so với trong phế nang căng phồng quá mức."},{"label":"C","text":"Áp suất trong bao phế quản mạch máu liền kề bằng với trong phế nang căng phồng quá mức."},{"label":"D","text":"Không liên quan về áp suất trong bao phế quản mạch máu và phế nang căng phồng quá mức."}],"answer":"B","explanation":"Cơ chế đề xuất sự hình thành TKMP do vỡ phế nang là do áp suất trong phế nang căng phồng quá mức cao hơn áp suất trong vùng bao phế quản-mạch máu lân cận (hay áp suất trong bao phế quản mạch máu thấp hơn), làm khí xé rách nhu mô bóc tách vào mô kẽ rồi vỡ vào khoang màng phổi. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn khí màng phổi)."},{"number":54,"question":"Các bệnh di truyền liên quan đến tràn khí màng phổi bao gồm, ngoại trừ:","options":[{"label":"A","text":"Hội chứng Marfan"},{"label":"B","text":"Hội chứng Cushing"},{"label":"C","text":"Hội chứng Ehlers-Danlos"},{"label":"D","text":"Thiếu α-antitrypsin"}],"answer":"B","explanation":"Bệnh di truyền liên quan đến tràn khí màng phổi tự phát bao gồm hội chứng Marfan, hội chứng Ehlers-Danlos, xơ nang (CF) và thiếu alpha-1 antitrypsin. Hội chứng Cushing là bệnh lý nội tiết, không phải bệnh di truyền gây TKMP. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":55,"question":"Về lâm sàng tràn khí màng phổi, chọn câu sai:","options":[{"label":"A","text":"Bệnh khởi phát từ từ bằng đau ngực, tăng khi ho, hít sâu, có thể liên quan đến gắng sức."},{"label":"B","text":"Khó thở thường xuất hiện sau đau ngực tùy theo tốc độ thành lập khoang khí."},{"label":"C","text":"Biểu hiện suy hô hấp mức độ từ nhẹ đến nặng, tụt huyết áp khi tràn khí màng phổi áp lực."},{"label":"D","text":"Tam chứng Galliard gồm giảm hay mất rung thanh, gõ vang, rì rào phế nang giảm hoặc mất."}],"answer":"A","explanation":"Tràn khí màng phổi điển hình khởi phát một cách đột ngột bằng cơn đau ngực dữ dội (đau xé ngực, như dao đâm) kèm khó thở cấp, chứ không phải khởi phát từ từ. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 5.1)."},{"number":56,"question":"Triệu chứng cơ năng quan trọng nhất gợi ý tràn khí màng phổi là:","options":[{"label":"A","text":"Tụt huyết áp đột ngột"},{"label":"B","text":"Cơn khó thở vào đột ngột kèm tím"},{"label":"C","text":"Đau vùng sau xương ức lan lên vai trái và trong cánh tay trái"},{"label":"D","text":"Cơn đau ngực đột ngột sau gắng sức kèm khó thở cấp"}],"answer":"D","explanation":"Bộ ba triệu chứng cơ năng điển hình của tràn khí màng phổi xuất hiện đột ngột, trong đó triệu chứng quan trọng và gợi ý nhất là cơn đau ngực đột ngột kèm theo khó thở cấp tính. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 5.1)."},{"number":57,"question":"Biểu hiện triệu chứng không phổ biến của tràn khí màng phổi là:","options":[{"label":"A","text":"Ho đàm"},{"label":"B","text":"Đau ngực"},{"label":"C","text":"Khó thở"},{"label":"D","text":"Ho khan"}],"answer":"A","explanation":"Đau ngực đột ngột, khó thở và ho khan là các triệu chứng cơ năng chính của tràn khí màng phổi. Ho khạc đờm mủ không phải là triệu chứng của tràn khí màng phổi đơn thuần (trừ khi có nhiễm trùng hô hấp phối hợp). (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":58,"question":"Khám thực thể bệnh nhân tràn khí màng phổi áp lực, chọn câu sai:","options":[{"label":"A","text":"Không có biểu hiện suy hô hấp mức độ từ nhẹ đến nặng do sự tích tụ dần không khí trong khoang màng phổi."},{"label":"B","text":"Ảnh hưởng đến cung lượng tim, gây hạ huyết áp và thiếu oxy đe dọa tính mạng."},{"label":"C","text":"Bệnh nhân không có tiếng thở ở vùng bị ảnh hưởng, lệch khí quản sang một bên, nhịp tim nhanh và căng giãn tĩnh mạch."},{"label":"D","text":"Bệnh nhân có thể ở tình trạng trụy mạch, ngừng tim, nếu không được cấp cứu kịp thời bệnh nhân có thể tử vong nhanh chóng."}],"answer":"A","explanation":"Tràn khí màng phổi áp lực là tình trạng cấp cứu nguy kịch gây chèn ép trung thất, hạ huyết áp, suy hô hấp nặng và đe dọa tính mạng. Do đó phát biểu A \"Không có biểu hiện suy hô hấp\" là hoàn toàn sai. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 5.1)."},{"number":59,"question":"Thường khám được tam chứng Galliard trong tràn khí màng phổi nếu (...). Điền vào chỗ trống:","options":[{"label":"A","text":"> 15% diện tích ở 1 bên phổi bị xẹp."},{"label":"B","text":"> 20% diện tích ở 1 bên phổi bị xẹp."},{"label":"C","text":"> 25% diện tích ở 1 bên phổi bị xẹp."},{"label":"D","text":"> 30% diện tích ở 1 bên phổi bị xẹp."}],"answer":"C","explanation":"Tam chứng Gailliard (giảm/mất rung thanh, gõ vang, giảm/mất rì rào phế nang) thường khám thấy rõ trên lâm sàng khi lượng khí tràn làm xẹp > 25% diện tích của một bên phổi. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 5.1)."},{"number":60,"question":"Đặc điểm hình ảnh Xquang ngực của tràn khí màng phổi, chọn câu sai:","options":[{"label":"A","text":"Không phụ thuộc mức độ tràn khí màng phổi nhiều hay ít mà trên phim X-quang có thể thấy phổi bên bệnh bị xẹp nhiều hay ít."},{"label":"B","text":"Đối với những trường hợp nghi ngờ tràn khí màng phổi nhưng trên phim thẳng không phát hiện được thì tiến hành chụp phim phổi nghiêng."},{"label":"C","text":"Trường hợp tràn khí màng phổi nhiều, nhu mô phổi co cụm lại về phía rốn phổi bên tràn khí."},{"label":"D","text":"Hình ảnh phổi tăng sáng, không có hình ảnh mạch máu, ở vùng ngoài thành ngực có thể thấy rõ bờ màng phổi tạng."}],"answer":"A","explanation":"Mức độ co cụm/xẹp của nhu mô phổi trên X-quang phụ thuộc trực tiếp vào thể tích/mức độ tràn khí màng phổi nhiều hay ít. Do đó phát biểu \"Không phụ thuộc mức độ tràn khí...\" ở câu A là sai. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 6.1)."},{"number":61,"question":"Đặc điểm hình ảnh Xquang ngực điển hình của tràn khí màng phổi, chọn câu sai:","options":[{"label":"A","text":"Hội chứng khí phế thũng"},{"label":"B","text":"Không có hình ảnh mạch máu"},{"label":"C","text":"Thấy rõ bờ màng phổi tạng"},{"label":"D","text":"Nhu mô phổi thu nhỏ về rốn phổi"}],"answer":"A","explanation":"Hình ảnh X-quang điển hình của tràn khí màng phổi là vùng tăng sáng quá mức không có vân mạch máu, thấy đường màng phổi tạng mảnh tách khỏi thành ngực và nhu mô phổi co về rốn phổi. \"Hội chứng khí phế thũng\" là tổn thương nhu mô phổi mạn tính, không phải đặc điểm hình ảnh X-quang điển hình của tràn khí màng phổi. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":62,"question":"Hình ảnh tràn khí màng phổi khu trú trên Xquang ngực cần phân biệt với:","options":[{"label":"A","text":"Khí phế thũng toàn thể"},{"label":"B","text":"Áp xe phổi giai đoạn nung mủ hở"},{"label":"C","text":"Hang lao"},{"label":"D","text":"Kén phổi"}],"answer":"D","explanation":"Tràn khí màng phổi khu trú trên phim X-quang ngực cần được phân biệt chủ yếu với bóng khí phế thũng lớn (bullae) hoặc kén/nang phổi thành mỏng. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 6.1)."},{"number":63,"question":"Đặc điểm hình ảnh Xquang ngực của tràn khí màng phổi áp lực, chọn câu sai:","options":[{"label":"A","text":"Khoang gian sườn hẹp"},{"label":"B","text":"Xương sườn nằm ngang"},{"label":"C","text":"Trung thất bị đẩy lệch sang bên đối diện"},{"label":"D","text":"Cơ hoành bị đẩy xuống thấp"}],"answer":"A","explanation":"Tràn khí màng phổi áp lực làm gia tăng áp lực lớn trong khoang màng phổi khiến khoang gian sườn bên bệnh giãn rộng và các xương sườn nằm ngang, chứ không phải khoang gian sườn hẹp. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 6.1)."},{"number":64,"question":"Nếu nghi ngờ bệnh nhân có bóng khí hoặc u nang, phân biệt với tràn khí màng phổi có dính màng phổi nên làm gì:","options":[{"label":"A","text":"Chụp Xquang ngực nghiêng"},{"label":"B","text":"Chụp CT scan ngực"},{"label":"C","text":"Siêu âm màng phổi"},{"label":"D","text":"Đo chức năng hô hấp"}],"answer":"B","explanation":"Chụp cắt lớp vi tính (CT scan) lồng ngực là phương tiện chẩn đoán hình ảnh chính xác nhất giúp phân biệt tràn khí màng phổi (kể cả thể khu trú hoặc dính) với bóng khí hoặc nang phổi thành mỏng. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 6.2)."},{"number":65,"question":"Tràn dịch màng phổi có thể xảy ra đồng thời với tràn khí màng phổi trong (...) trường hợp tràn khí màng phổi tự phát. Điền vào chỗ trống:","options":[{"label":"A","text":"10% đến 15%"},{"label":"B","text":"20% đến 25%"},{"label":"C","text":"30% đến 35%"},{"label":"D","text":"40% đến 45%"}],"answer":"B","explanation":"Theo thống kê trong giáo trình, tràn dịch màng phổi phối hợp xuất hiện trong khoảng 20% đến 25% các trường hợp tràn khí màng phổi tự phát. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn khí màng phổi)."},{"number":66,"question":"Tràn máu màng phổi xảy ra đồng thời với tràn khí màng phổi trong (...) các trường hợp tràn khí màng phổi tự phát. Điền vào chỗ trống:","options":[{"label":"A","text":"1% đến 3%"},{"label":"B","text":"2% đến 3%"},{"label":"C","text":"2% đến 2,5%"},{"label":"D","text":"1% đến 1,5%"}],"answer":"B","explanation":"Tràn máu - tràn khí màng phổi tự phát do rách các dây dính màng phổi đứt mạch máu xảy ra trong khoảng 2% đến 3% các trường hợp tràn khí màng phổi tự phát. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":67,"question":"Theo BTS, trên Xquang ngực, tràn khí màng phổi tự phát lượng ít khi đường kính khoang khí bao nhiêu:","options":[{"label":"A","text":"< 1 cm"},{"label":"B","text":"< 2 cm"},{"label":"C","text":"< 3 cm"},{"label":"D","text":"< 4 cm"}],"answer":"B","explanation":"Theo hướng dẫn của Hiệp hội Lồng ngực Anh (BTS), tràn khí màng phổi tự phát lượng ít được xác định trên X-quang ngực thẳng khi khoảng cách giữa bờ màng phổi tạng và thành ngực (độ dày khoang khí) < 2 cm ở ngang mức rốn phổi. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 9.1)."},{"number":68,"question":"Chẩn đoán phân biệt giữa tràn khí màng phổi khu trú và hang trong nhu mô phổi ở vùng tiếp giáp lồng ngực dựa vào: (1) Dấu hiệu J.Rémy (2) Góc Bernou","options":[{"label":"A","text":"(1) đúng, (2) đúng"},{"label":"B","text":"(1) đúng, (2) sai"},{"label":"C","text":"(1) sai, (2) đúng"},{"label":"D","text":"(1) sai, (2) sai"}],"answer":"A","explanation":"Trên chẩn đoán hình ảnh, việc phân biệt tổn thương thuộc khoang màng phổi (tràn khí khu trú) hay thuộc nhu mô phổi (hang/áp-xe) sát thành ngực dựa trên dấu hiệu J. Rémy và góc tiếp xúc với thành ngực (góc Bernou). Cả (1) và (2) đều đúng. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":69,"question":"Độ nhạy của siêu âm phổi trong phát hiện tràn khí màng phổi là:","options":[{"label":"A","text":"từ 70% đến 90%"},{"label":"B","text":"từ 98% đến 99%"},{"label":"C","text":"từ 79% đến 95%"},{"label":"D","text":"từ 99% đến 100%"}],"answer":"C","explanation":"Siêu âm phổi có độ nhạy cao trong phát hiện tràn khí màng phổi, dao động từ 79% đến 95% (vượt trội hơn X-quang ngực thẳng tại giường) khi so sánh với CT ngực. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 6.3)."},{"number":70,"question":"Ưu điểm của siêu âm màng phổi trong tràn khí màng phổi (TKMP), chọn câu sai:","options":[{"label":"A","text":"Rẻ hơn Xquang ngực"},{"label":"B","text":"Giúp chẩn đoán TKMP ẩn"},{"label":"C","text":"Kích thước máy nhỏ, có tính di động"},{"label":"D","text":"Thực hiện tại giường"}],"answer":"A","explanation":"Ưu điểm của siêu âm màng phổi là thực hiện tại giường, máy nhỏ di động, không nhiễm xạ và phát hiện được tràn khí màng phổi ẩn trên X-quang. Giáo trình không đề cập ưu điểm siêu âm \"rẻ hơn X-quang ngực\". (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 6.3)."},{"number":71,"question":"Điều trị bảo tồn nội khoa và theo dõi nội viện, chụp kiểm tra Xquang ngực thẳng mỗi ngày là hướng xử trí ở bệnh nhân tràn khí màng phổi như thế nào, chọn câu sai:","options":[{"label":"A","text":"TKMP lượng nhiều"},{"label":"B","text":"Bệnh nhân không khó thở"},{"label":"C","text":"Bệnh nhân huyết động ổn định"},{"label":"D","text":"Kích thước khoang TKMP không tăng lên sau 6 – 8 giờ"}],"answer":"A","explanation":"Điều trị bảo tồn nội khoa chỉ áp dụng cho tràn khí màng phổi lượng ít (< 2 cm), bệnh nhân hoàn toàn không khó thở, huyết động ổn định và không tăng thêm sau 6-8h theo dõi. TKMP lượng nhiều bắt buộc phải can thiệp hút hoặc đặt dẫn lưu. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 9)."},{"number":72,"question":"Với tràn khí màng phổi không biến chứng thì mỗi ngày màng phổi hấp thu được bao nhiêu thể tích khí:","options":[{"label":"A","text":"< 5%"},{"label":"B","text":"1%"},{"label":"C","text":"1% - 3%"},{"label":"D","text":"3% - 5%"}],"answer":"B","explanation":"Ở bệnh nhân tràn khí màng phổi tự phát không có biến chứng điều trị bảo tồn, tốc độ tự tái hấp thu khí của màng phổi trung bình khoảng 1% đến 1,25% thể tích khoang khí mỗi 24 giờ. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 9)."},{"number":73,"question":"Bệnh nhân tràn khí màng phổi áp lực, cần xử trí ngay:","options":[{"label":"A","text":"chụp Xquang ngực tại giường"},{"label":"B","text":"thở oxy liều cao"},{"label":"C","text":"chọc hút màng phổi khẩn cấp"},{"label":"D","text":"siêu âm màng phổi tại giường"}],"answer":"C","explanation":"Tràn khí màng phổi áp lực là tình trạng cấp cứu đe dọa tính mạng. Bác sĩ phải thực hiện chọc hút giải áp khẩn cấp bằng kim ngay lập tức dựa trên chẩn đoán lâm sàng, không được trì hoãn để chờ chụp X-quang ngực. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 9.1)."},{"number":74,"question":"Nếu hết tràn khí màng phổi thì sau bao lâu nên rút kim dẫn lưu khí:","options":[{"label":"A","text":"rút kim ngay"},{"label":"B","text":"sau 6 giờ"},{"label":"C","text":"sau 12 giờ"},{"label":"D","text":"sau 24 giờ"}],"answer":"D","explanation":"Sau khi theo dõi phổi đã giãn nở hoàn toàn và không còn khí ra qua ống dẫn lưu, cần kẹp/lưu ống thêm 24 giờ để theo dõi và chụp lại X-quang kiểm tra trước khi quyết định rút ống dẫn lưu. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 9.3)."},{"number":75,"question":"Dẫn lưu tràn khí màng phổi bằng cách: (1) đặt ống dẫn lưu khoang màng phổi (2) nội soi màng phổi","options":[{"label":"A","text":"(1) đúng, (2) sai"},{"label":"B","text":"(1) sai, (2) đúng"},{"label":"C","text":"(1) đúng, (2) đúng"},{"label":"D","text":"(1) sai, (2) sai"}],"answer":"A","explanation":"Dẫn lưu tràn khí màng phổi thông thường được thực hiện bằng kỹ thuật mở màng phổi tối thiểu đặt ống dẫn lưu khoang màng phổi (1). Nội soi màng phổi (2) là phẫu thuật/thủ thuật can thiệp để xử lý bóng khí hoặc gây dính, không phải phương pháp dẫn lưu khí đơn thuần. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":76,"question":"Nguyên nhân tràn dịch màng phổi dịch thấm, NGOẠI TRỪ:","options":[{"label":"A","text":"Suy tim sung huyết"},{"label":"B","text":"Hội chứng tăng ure máu"},{"label":"C","text":"Hội chứng thận hư"},{"label":"D","text":"Tắc tĩnh mạch chủ trên"}],"answer":"B","explanation":"Tràn dịch màng phổi dịch thấm do suy tim sung huyết, hội chứng thận hư, xơ gan, tắc tĩnh mạch chủ trên. Hội chứng tăng ure máu (uremic pleuritis) gây tổn thương viêm niêm mạc tạo dịch tiết. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn dịch màng phổi)."},{"number":77,"question":"Tràn dịch màng phổi dịch tiết do nhiễm trùng chiếm khoảng:","options":[{"label":"A","text":"2-35%"},{"label":"B","text":"10-50%"},{"label":"C","text":"36-66%"},{"label":"D","text":"4-20%"}],"answer":"C","explanation":"Trong các nguyên nhân gây tràn dịch màng phổi dịch tiết, nhiễm trùng/viêm phổi (tràn dịch cận viêm) chiếm tỷ lệ cao nhất, khoảng 36% đến 66%. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 2)."},{"number":78,"question":"Dịch màng phổi được thành lập từ các thay đổi sau, CHỌN CÂU SAI:","options":[{"label":"A","text":"Giảm dịch kẽ trong phổi: suy thất trái, viêm phổi và thuyên tắc phổi"},{"label":"B","text":"Tăng áp lực thủy tĩnh mao mạch trong màng phổi: suy thất phải hoặc trái, hội chứng tĩnh mạch chủ trên"},{"label":"C","text":"Tăng tính thấm của mao mạch màng phổi: viêm màng phổi"},{"label":"D","text":"Giảm áp lực trong khoang màng phổi: xẹp phổi hoặc tăng độ đàn hồi của phổi"}],"answer":"A","explanation":"Suy thất trái, viêm phổi và thuyên tắc phổi gây TĂNG dịch kẽ trong phổi, từ đó dịch thoát qua lá tạng vào khoang màng phổi. Phát biểu \"Giảm dịch kẽ trong phổi\" ở câu A là sai. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 4)."},{"number":79,"question":"Ung thư màng phổi nguyên phát (Mésotheliome):","options":[{"label":"A","text":"Ít gặp hơn do di căn."},{"label":"B","text":"Thường gặp ở dạng màng, u hơn là dạng tràn dịch."},{"label":"C","text":"Liên quan trực tiếp đến Amiante."},{"label":"D","text":"A và C đúng."}],"answer":"D","explanation":"U trung biểu mô màng phổi nguyên phát (Mesothelioma) rất hiếm gặp so với tổn thương ung thư di căn màng phổi (A đúng) và có liên quan sinh bệnh học trực tiếp đến phơi nhiễm bụi amiăng (asbestos) (C đúng). Do đó D (A và C đúng) là đáp án chính xác. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":80,"question":"Dịch màng phổi do Lao KHÔNG CÓ đặc điểm sau:","options":[{"label":"A","text":"Thường có màu vàng chanh hơn là mủ."},{"label":"B","text":"Tái lập nhanh do liên quan đến phản ứng miễn dịch quá đáng."},{"label":"C","text":"Dịch có thể hết cả khi không điều trị."},{"label":"D","text":"Rất giàu trực khuẩn lao trong dịch."}],"answer":"D","explanation":"Tràn dịch màng phổi do lao là phản ứng quá mẫn muộn đối với vi khuẩn lao, dịch màng phổi thường là dịch tiết màu vàng chanh và rất NGHÈO vi khuẩn lao (soi AFB trực tiếp dương tính < 10%). Phát biểu \"Rất giàu trực khuẩn lao\" là sai. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 6.3)."},{"number":81,"question":"Đặc điểm hình ảnh XQ ngực của tràn dịch màng phổi, NGOẠI TRỪ:","options":[{"label":"A","text":"Mờ đồng nhất"},{"label":"B","text":"Mất góc sườn hoành"},{"label":"C","text":"Đường cong Damoiseau"},{"label":"D","text":"Phế quản hơi"}],"answer":"D","explanation":"Hình ảnh X-quang ngực đặc trưng của tràn dịch màng phổi tự do là đám mờ đồng nhất ở đáy phổi, làm tù/mất góc sườn hoành và có giới hạn trên là đường cong lõm Damoiseau. \"Hình ảnh phế quản hơi\" (air bronchogram) là dấu hiệu của hội chứng đông đặc nhu mô phổi. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 6.1)."},{"number":82,"question":"Triệu chứng cơ năng sau đây có giá trị chẩn đoán tràn dịch màng phổi:","options":[{"label":"A","text":"Đau vùng sau xương ức lan lên vai trái"},{"label":"B","text":"Ho và khạc nhiều đàm loãng"},{"label":"C","text":"Ho khi thay đổi tư thế"},{"label":"D","text":"Khó thở từng cơn khi nghiêng bên tràn dịch"}],"answer":"C","explanation":"Trong các triệu chứng cơ năng, ho xuất hiện hoặc tăng lên khi bệnh nhân thay đổi tư thế (do sự di chuyển của dịch màng phổi kích thích các thụ thể cảm giác) là dấu hiệu gợi ý có giá trị chẩn đoán tràn dịch màng phổi. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Bài Tràn dịch màng phổi)."},{"number":83,"question":"Để xác định tràn dịch màng phổi thể khu trú cần dựa vào:","options":[{"label":"A","text":"Tiền sử, bệnh sử"},{"label":"B","text":"Triệu chứng cơ năng là chính"},{"label":"C","text":"Triệu chứng thực thể là chính"},{"label":"D","text":"Phim XQ ngực"}],"answer":"D","explanation":"Tràn dịch màng phổi thể khu trú thường khó phát hiện bằng khám thực thể lâm sàng và bắt buộc phải xác định dựa trên chẩn đoán hình ảnh, trước hết là phim X-quang ngực (thẳng, nghiêng) hoặc siêu âm/CT ngực. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":84,"question":"Glucose trong dịch màng phổi rất thấp thường gặp trong:","options":[{"label":"A","text":"Ung thư màng phổi"},{"label":"B","text":"Lao màng phổi"},{"label":"C","text":"Viêm mủ màng phổi"},{"label":"D","text":"Suy tim, suy thận"}],"answer":"C","explanation":"Nồng độ Glucose dịch màng phổi giảm rất thấp (< 40 mg/dL hoặc gần bằng 0) thường gặp nhất trong viêm mủ màng phổi (empyema) và viêm màng phổi do thấp (rheumatoid pleuritis) do sự tiêu thụ glucose mạnh mẽ của vi khuẩn và bạch cầu. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 6.2)."},{"number":85,"question":"Về đặc điểm Xquang ngực thẳng trong tràn dịch màng phổi, chọn Câu sai:","options":[{"label":"A","text":"Tràn dịch màng phổi lượng nhiều có thể làm di lệch vị trí trung thất sang đối diện."},{"label":"B","text":"Với bất kỳ một Xquang ngực bất thường, nên xem xét có tràn dịch màng phổi hay không."},{"label":"C","text":"Dịch màng phổi tự do trong khoang màng phổi phân bố theo chiều trọng lực; khi bệnh nhân ở tư thế đứng, thì dịch này đọng ở khe sườn hoành sau."},{"label":"D","text":"Hình ảnh mờ góc sườn hoành, đậm, không đồng nhất, có giới hạn trên là đường cong lõm, cao ở thành ngực và thấp dần khi đi vào trung thất."}],"answer":"D","explanation":"Mô tả đúng của tràn dịch màng phổi tự do trên X-quang ngực thẳng là hình mờ ĐẬM, ĐỒNG NHẤT. Mô tả \"không đồng nhất\" ở câu D là phát biểu sai. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 6.1.1)."},{"number":86,"question":"Về đặc điểm siêu âm màng phổi trong tràn dịch màng phổi, chọn Câu sai:","options":[{"label":"A","text":"Giúp phát hiện tràn dịch khu trú, phân biệt tràn dịch với dày dính màng phổi và hướng dẫn chọc dò màng phổi trong những trường hợp khó."},{"label":"B","text":"Có thể ước tính lượng dịch có thể rút ra được bằng cách lấy khoảng cách lớn nhất giữa lá tạng và lá thành (đo ở mặt cắt ngang) nhân với 10."},{"label":"C","text":"Đo thể tích dịch màng phổi bằng siêu âm được cho là chính xác hơn phương pháp đo bằng X quang tư thế nằm."},{"label":"D","text":"Với siêu âm, thể tích dịch màng phổi được thấy là tương quan với độ tách biệt của 2 lá màng phổi."}],"answer":"B","explanation":"Giáo trình quy định công thức ước tính thể tích dịch màng phổi qua siêu âm là lấy khoảng cách tách biệt lớn nhất giữa 2 lá màng phổi (mm) nhân với 20 (chứ không phải nhân với 10). Do đó B là câu sai. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":87,"question":"Trong tràn dịch màng phổi, độ dầy dịch màng phổi bao nhiêu trên hình ảnh học thì có thể chọc dò dịch màng phổi:","options":[{"label":"A","text":"> 10 mm"},{"label":"B","text":"> 15 mm"},{"label":"C","text":"> 20 mm"},{"label":"D","text":"> 25 mm"}],"answer":"A","explanation":"Chọc dò màng phổi chẩn đoán nên được thực hiện ở bệnh nhân có tràn dịch màng phổi tự do với bề dày lớp dịch > 10 mm trên phim chụp tư thế nằm nghiêng hoặc trên siêu âm/CT ngực. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 6.2)."},{"number":88,"question":"Có thể chẩn đoán nhầm dịch thấm thành dịch tiết trong tràn dịch màng phổi trong khoảng bao nhiêu phần trăm trường hợp:","options":[{"label":"A","text":"15%"},{"label":"B","text":"25%"},{"label":"C","text":"35%"},{"label":"D","text":"45%"}],"answer":"B","explanation":"Tiêu chuẩn Light có độ nhạy rất cao nhưng có thể xếp nhầm khoảng 25% các trường hợp tràn dịch màng phổi dịch thấm (đặc biệt ở bệnh nhân suy tim đã dùng thuốc lợi tiểu) thành dịch tiết. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":89,"question":"Trong sơ đồ tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light, sau khi thực hiện chọc dịch màng phổi chẩn đoán thì kết luận dịch tiết khi đáp ứng tiêu chuẩn nào sau đây:","options":[{"label":"A","text":"Protein dịch màng phổi /huyết thanh > 0,5"},{"label":"B","text":"LDH dịch màng phổi /huyết thanh > 0,5"},{"label":"C","text":"LDH dịch màng phổi > 1/3 giới hạn bình thường trên của LDH huyết thanh"},{"label":"D","text":"LDH dịch màng phổi > 400 UI/L giá trị bình thường của LDH huyết thanh"}],"answer":"A","explanation":"Ba tiêu chuẩn Light để xác định dịch tiết: (1) Protein dịch màng phổi/Protein huyết thanh > 0,5; (2) LDH dịch màng phổi/LDH huyết thanh > 0,6; (3) LDH dịch màng phổi > 2/3 giới hạn bình thường trên của LDH huyết thanh. Do đó chỉ có đáp án A là đúng tiêu chuẩn. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 6.2, Sơ đồ 10.1)."},{"number":90,"question":"Trong sơ đồ tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light, sau khi thực hiện chọc dịch màng phổi chẩn đoán với kết luận dịch thấm thì bác sĩ làm gì tiếp theo:","options":[{"label":"A","text":"Tiến hành các kỹ thuật chẩn đoán sâu hơn"},{"label":"B","text":"Điều trị suy tim, xơ gan, bệnh thận"},{"label":"C","text":"Định lượng glucose, amylase dịch màng phổi"},{"label":"D","text":"Xét nghiệm dịch màng phổi tìm lao"}],"answer":"B","explanation":"Khi dịch màng phổi thỏa tiêu chuẩn dịch thấm, hướng tiếp cận tiếp theo là điều trị các bệnh lý nguyên nhân toàn thân phổ biến gây ra dịch thấm như suy tim, xơ gan, hội chứng thận hư mà chưa cần làm các xét nghiệm xâm lấn sâu trên màng phổi. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Sơ đồ 10.1)."},{"number":91,"question":"Trong sơ đồ tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light, sau khi thực hiện chọc dịch màng phổi chẩn đoán với kết luận dịch tiết thì bác sĩ làm gì tiếp theo:","options":[{"label":"A","text":"Tiến hành các kỹ thuật chẩn đoán sâu hơn"},{"label":"B","text":"Điều trị suy tim, xơ gan, bệnh thận"},{"label":"C","text":"Không làm gì thêm để chẩn đoán"},{"label":"D","text":"Nội soi màng phổi hoặc sinh thiết màng phổi"}],"answer":"A","explanation":"Theo sơ đồ tiếp cận Light, khi dịch màng phổi thỏa tiêu chuẩn dịch tiết, bước tiếp theo là tiến hành các kỹ thuật chẩn đoán sâu hơn trên dịch màng phổi (định lượng Glucose, Amylase, đếm công thức tế bào, cấy/nhuộm vi khuẩn, tế bào học ung thư, ADA/xét nghiệm lao). (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Sơ đồ 10.1)."},{"number":92,"question":"Trong sơ đồ tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light, sau khi thực hiện chọc dịch màng phổi chẩn đoán với kết luận dịch tiết có tăng amylase thì bác sĩ cần xem xét các khả năng sau, NGOẠI TRỪ:","options":[{"label":"A","text":"Rách thực quản"},{"label":"B","text":"Tràn dịch màng phổi trong viêm tụy"},{"label":"C","text":"Bệnh lý ác tính"},{"label":"D","text":"Nhiễm vi khuẩn"}],"answer":"D","explanation":"Amylase dịch màng phổi tăng cao xuất hiện trong 3 bệnh cảnh chính: (1) Rách/thủng thực quản (amylase từ nước bọt), (2) Bệnh lý tuyến tụy (viêm tụy, nang giả tụy), và (3) Bệnh lý ung thư/ác tính. Nhiễm vi khuẩn không nằm trong các nguyên nhân gây tăng amylase dịch màng phổi. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Sơ đồ 10.1)."},{"number":93,"question":"Trong sơ đồ tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light, sau khi thực hiện chọc dịch màng phổi chẩn đoán với kết luận dịch tiết và tiến hành các kỹ thuật chẩn đoán sâu hơn nhưng bác sĩ vẫn không có chẩn đoán thì bác sĩ cần quyết định sao:","options":[{"label":"A","text":"Tiếp tục tiến hành các kỹ thuật chẩn đoán"},{"label":"B","text":"Thực hiện chọc dịch màng phổi chẩn đoán lại"},{"label":"C","text":"Xem xét thuyên tắc phổi"},{"label":"D","text":"Xét nghiệm dịch màng phổi tìm lao"}],"answer":"C","explanation":"Theo sơ đồ tiếp cận của Light, nếu dịch màng phổi là dịch tiết nhưng các xét nghiệm tế bào, vi sinh và sinh hóa thông thường chưa xác định được nguyên nhân, bác sĩ cần xem xét khả năng Thuyên tắc phổi (chụp CT mạch máu phổi xoắn ốc hoặc xạ hình tưới máu phổi). (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Sơ đồ 10.1)."},{"number":94,"question":"Trong sơ đồ tiếp cận tràn dịch màng phổi (TDMP) theo tiêu chuẩn Light, sau khi theo dõi người bệnh không cải thiện triệu chứng TDMP thì bác sĩ cần làm gì tiếp theo:","options":[{"label":"A","text":"Tiếp tục tiến hành lại các kỹ thuật chẩn đoán TDMP"},{"label":"B","text":"Xem xét soi màng phổi hoặc sinh thiết màng phổi"},{"label":"C","text":"Xét nghiệm dịch màng phổi tìm lao"},{"label":"D","text":"Điều trị thuyên tắc phổi"}],"answer":"B","explanation":"Nếu theo dõi lâm sàng triệu chứng tràn dịch màng phổi không cải thiện và chưa có chẩn đoán xác định sau các bước tiếp cận ban đầu, bước tiếp theo được chỉ định là xem xét Soi màng phổi hoặc Sinh thiết màng phổi (sinh thiết màng phổi mù hoặc qua nội soi) để làm mô bệnh học. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Sơ đồ 10.1)."},{"number":95,"question":"Trong tràn dịch màng phổi, đặc điểm chẩn đoán tế bào học, chọn Câu sai:","options":[{"label":"A","text":"Kỹ thuật khối tế bào (cell block) không làm tăng khả năng chẩn đoán nguyên nhân ác tính."},{"label":"B","text":"Đòi hỏi người đọc tiêu bản phải có kinh nghiệm vì tế bào màng phổi có thể chuyển dạng tạo hình ảnh giống ác tính."},{"label":"C","text":"Sự hiện diện tế bào bất thường trong dịch màng phổi có khả năng chẩn đoán thấp do phụ thuộc mức độ lan rộng và loại tế bào ung thư."},{"label":"D","text":"Mọi bệnh nhân tràn dịch màng phổi dịch tiết nên được xét nghiệm tế bào học dịch màng phổi."}],"answer":"A","explanation":"Kỹ thuật đúc khối tế bào (cell block) kết hợp với nhuộm hóa mô miễn dịch giúp LÀM TĂNG đáng kể tỷ lệ chẩn đoán xác định các nguyên nhân ung thư/ác tính từ dịch màng phổi. Phát biểu ở câu A là hoàn toàn sai. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 6.2)."},{"number":96,"question":"Đối với tràn dịch màng phổi dịch tiết, trường hợp nghi ngờ lao và ung thư màng phổi, cần chẩn đoán mô bệnh học thông qua kỹ thuật nào:","options":[{"label":"A","text":"Sinh thiết màng phổi mù"},{"label":"B","text":"Nội soi màng phổi"},{"label":"C","text":"(A), (B) đúng"},{"label":"D","text":"(A), (B) sai"}],"answer":"C","explanation":"Khi nghi ngờ tổn thương lao màng phổi hoặc ung thư màng phổi mà xét nghiệm dịch chưa khẳng định được, việc chẩn đoán mô bệnh học được thực hiện qua Sinh thiết màng phổi mù (kim Cope/Abrams) hoặc Sinh thiết qua nội soi màng phổi. Cả A và B đều đúng. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 6.3)."},{"number":97,"question":"Bệnh nhân xơ gan, đã loại trừ viêm phổi nếu nuôi cấy dịch màng phổi dương tính vi khuẩn và có số lượng bạch cầu trung tính >250 tế bào/mm3 hoặc nuôi cấy âm tính và số lượng bạch cầu trung tính >500 tế bào/mm3 thì nghĩ đến vấn đề gì:","options":[{"label":"A","text":"Viêm màng phổi phản ứng."},{"label":"B","text":"Viêm màng phổi do vi khuẩn."},{"label":"C","text":"Tràn dịch màng phổi cận viêm."},{"label":"D","text":"Tràn dịch màng phổi dịch thấm"}],"answer":"B","explanation":"Ở bệnh nhân xơ gan có tràn dịch màng phổi (dịch thấm) đã loại trừ viêm phổi nhu mô, nếu dịch màng phổi có bạch cầu trung tính (PMN) > 250/mm3 kèm cấy dương tính hoặc PMN > 500/mm3 cấy âm tính thì được chẩn đoán là Viêm màng phổi do vi khuẩn tự phát (Spontaneous Bacterial Empyema / Bacterial Pleuritis). (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Mục 7.1.2.2)."},{"number":98,"question":"Tràn dịch màng phổi do lao có cơ chế: (1) trực khuẩn lao xâm nhập vào khoang màng phổi bằng đường máu hoặc đường bạch huyết gây kích thích miễn dịch trung gian tế bào. (2) các ổ hoặc hang có bã đậu nằm dưới màng phổi vỡ vào khoang màng phổi gây ra mủ màng phổi do lao.","options":[{"label":"A","text":"(1) đúng, (2) sai"},{"label":"B","text":"(1) sai, (2) đúng"},{"label":"C","text":"(1) đúng, (2) đúng"},{"label":"D","text":"(1) sai, (2) sai"}],"answer":"C","explanation":"Bệnh sinh tràn dịch màng phổi do lao bao gồm hai cơ chế chính: (1) Vi khuẩn lao theo đường máu/bạch huyết tới màng phổi gây đáp ứng miễn dịch quá mẫn muộn tế bào, và (2) Ổ hoại tử bã đậu dưới màng phổi vỡ trực tiếp vào khoang màng phổi gây viêm/mủ màng phổi do lao. Cả (1) và (2) đều đúng. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":99,"question":"Tính chất tràn dịch màng phổi cạnh viêm:","options":[{"label":"A","text":"Số lượng tế bào từ 500 – 100 tế bào/mm3 với lympho >70%, tế bào biểu mô <5%"},{"label":"B","text":"Dịch tiết, ADA ở ngưỡng chẩn đoán từ 40 – 60 UI/L"},{"label":"C","text":"Xét nghiệm mô bệnh học có giá trị quyết định chẩn đoán"},{"label":"D","text":"Cấy dịch màng phổi có thể dương tính"}],"answer":"D","explanation":"Tràn dịch màng phổi cận viêm (parapneumonic effusion) có bản chất là dịch tiết hình thành do phản ứng viêm phổi lân cận; trong giai đoạn muộn hoặc có biến chứng mủ màng phổi, cấy dịch màng phổi tìm vi khuẩn có thể cho kết quả dương tính. (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ)."},{"number":100,"question":"Trong sơ đồ tiếp cận điều trị tràn dịch màng phổi do ung thư, sau khi đánh giá bệnh nhân có khả năng sống hơn 1 tuần thì cần làm gì tiếp theo:","options":[{"label":"A","text":"Đặt catheter đường hầm màng phổi"},{"label":"B","text":"Gây dày dính màng phổi"},{"label":"C","text":"Tìm nguyên nhân khác gây khó thở"},{"label":"D","text":"Điều trị giảm nhẹ"}],"answer":"A","explanation":"Theo sơ đồ tiếp cận điều trị tràn dịch màng phổi do ung thư: sau chọc tháo dịch nếu khó thở cải thiện nhưng phổi không tái dãn nở hoàn toàn và thời gian sống dự kiến > 1 tuần, phương pháp được cân nhắc lựa chọn là Đặt catheter màng phổi có đường hầm (IPC - Indwelling Pleural Catheter). (Nguồn: Giáo trình Hô hấp Sau đại học - ĐH Y Dược Cần Thơ, Sơ đồ trang 212)."}]},{"name":"2026 Long An","questions":[{"number":1,"answer":"A","question":"Nghiên cứu dịch tễ học tại Việt Nam (2011) cho thấy, tỉ lệ mắc bệnh chung của bệnh phổi tắc nghẽn mạn tính ở nam giới là:","options":[{"label":"A","text":"7,1% ."},{"label":"B","text":"4,2% ."},{"label":"C","text":"4,1% ."},{"label":"D","text":"1,9% ."}],"explanation":"Theo Giáo trình Hô hấp Sau đại học - ĐHYD Cần Thơ (Bài BPTNMT, mục Dịch tễ học): Nghiên cứu dịch tễ tại Việt Nam cho thấy tỷ lệ mắc BPTNMT chung là 4,2%, trong đó ở nam giới là 7,1% và ở nữ giới là 1,9%."},{"number":2,"answer":"D","question":"Yếu tố nguy cơ nào KHÔNG gây bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"Các chất gây ô nhiễm khí thở ."},{"label":"B","text":"Thuốc lá ."},{"label":"C","text":"Bất thường về di truyền ."},{"label":"D","text":"Nhiễm trùng đường thở cấp tính ."}],"explanation":"Các yếu tố nguy cơ nguyên phát gây BPTNMT gồm hút thuốc lá (hàng đầu), ô nhiễm không khí/bụi nghề nghiệp và thiếu hụt di truyền Alpha-1-Antitrypsin. Nhiễm trùng đường thở cấp tính không phải là nguyên nhân trực tiếp gây bệnh BPTNMT mà là yếu tố kích phát các đợt cấp của bệnh."},{"number":3,"answer":"C","question":"Phát biểu nào sau đây KHÔNG phù hợp với bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"Triệu chứng hô hấp và giới hạn luồng khí thở dai dẳng ."},{"label":"B","text":"Bất thường ở đường dẫn khí hoặc phế nang ."},{"label":"C","text":"Thể lâm sàng bao gồm viêm phế quản mạn và khí phế thũng ."},{"label":"D","text":"Được chẩn đoán xác định bằng hô hấp ký ."}],"explanation":"Theo hướng dẫn GOLD mới nhất và Giáo trình Hô hấp Cần Thơ, BPTNMT được định nghĩa là bệnh đặc trưng bởi các triệu chứng hô hấp mạn tính và sự giới hạn luồng khí thở dai dẳng do bất thường đường dẫn khí và/hoặc phế nang. Thuật ngữ \"viêm phế quản mạn\" và \"khí phế thũng\" hiện không còn được dùng làm các thể lâm sàng để định nghĩa BPTNMT."},{"number":4,"answer":"B","question":"Các rối loạn chủ yếu của bệnh phổi tắc nghẽn mạn tính, NGOẠI TRỪ:","options":[{"label":"A","text":"Sự phơi nhiễm lâu dài với khói thuốc lá ở những người nhạy cảm sẽ thúc đẩy quá trình viêm và huy động các tế bào miễn dịch vào trong đường thở và phế nang. ."},{"label":"B","text":"Các tế bào viêm phóng thích anti-proteases làm tổn thương cấu trúc ngoại bào nâng đỡ đường thở, mao mạch và lớp bề mặt trao đổi khí của phổi. ."},{"label":"C","text":"Sự chết của các tế bào cấu trúc dẫn đến mất tính dãn nở của đường thở nhỏ, cắt xén mạch máu và phá huỷ phế nang. ."},{"label":"D","text":"Quá trình sửa chữa bất thường của elastin và các thành phần cấu trúc ngoại bào khác góp phần làm giãn nở khoang khí và khí phế thũng. ."}],"explanation":"Trong BPTNMT, các tế bào viêm phóng thích các proteinase (enzym tiêu hủy protein như elastase, matrix metalloproteinase), làm mất cân bằng giữa proteinase và anti-proteinase (chất ức chế proteases), từ đó phá hủy cấu trúc ngoại bào. Do đó phát biểu B nói \"phóng thích anti-proteases làm tổn thương\" là không đúng."},{"number":5,"answer":"B","question":"Vai trò của đại thực bào trong cơ chế bệnh sinh bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"Tiết ra Neutrophil elastase, Neutrophil cathepsin G và Neutrophil proteinase-3 ."},{"label":"B","text":"Giải phóng các chất oxy hoá, oxit nito, yếu tố hoại tử u (TNF- α), IL-8, LTB-4 ."},{"label":"C","text":"Giải phóng perforin, granzym B và TNF-α ."},{"label":"D","text":"Tiết ra các anti -proteinase ."}],"explanation":"Theo Giáo trình Hô hấp SĐH CTUMP: Đại thực bào có vai trò cộng hưởng trong quá trình viêm bằng cách giải phóng các chất oxy hóa, oxit nitơ, yếu tố hoại tử u (TNF-alpha), IL-8, LTB-4 thúc đẩy quá trình viêm do bạch cầu đa nhân trung tính. (Lựa chọn A là của bạch cầu trung tính; C là của TCD8+)."},{"number":6,"answer":"D","question":"Phát biểu đúng về enzyme ức chế proteinase trong cơ chế bệnh sinh của bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"Giải phóng từ bạch cầu đa nhân ."},{"label":"B","text":"Giải phóng từ đại thực bào ."},{"label":"C","text":"Tác dụng giáng hoá protein của tổ chức gian bào ."},{"label":"D","text":"Có tác dụng bảo vệ đường hô hấp ."}],"explanation":"Enzym ức chế proteinase (anti-proteinase bao gồm alpha-1-antitrypsin, alpha-2-macroglobulin) có vai trò bảo vệ đường hô hấp nhờ ức chế các enzym tiêu hủy protein (proteinase). Trong BPTNMT có tình trạng mất cân bằng do proteinase tăng và anti-proteinase bị suy giảm."},{"number":7,"answer":"C","question":"Tình trạng hẹp lòng đường thở trong COPD do nhiều tác động, NGOẠI TRỪ:","options":[{"label":"A","text":"Xơ hoá đường thở ."},{"label":"B","text":"Tăng ứ đọng đàm ."},{"label":"C","text":"Phá huỷ khoảng trao đổi khí ."},{"label":"D","text":"Thâm nhiễm tế bào ."}],"explanation":"Phá hủy khoảng trao đổi khí (phế nang) là cơ chế gây khí phế thũng và giảm diện tích khuếch tán khí, không phải là cơ chế trực tiếp làm hẹp lòng đường dẫn khí nhỏ (vốn do xơ hóa, thâm nhiễm tế bào viêm, co thắt cơ trơn và tăng tiết đờm nhầy)."},{"number":8,"answer":"D","question":"Hậu quả của việc giảm oxy và tăng CO₂ máu trong bệnh phổi tắc nghẽn mạn tính là do, NGOẠI TRỪ:","options":[{"label":"A","text":"Tắc nghẽn đường thở ."},{"label":"B","text":"Phá huỷ nhu mô ."},{"label":"C","text":"Bất thường mạch máu phổi ."},{"label":"D","text":"Giảm kích thích trung tâm hô hấp ."}],"explanation":"Giáo trình Hô hấp chỉ rõ: Để duy trì mức thông khí phế nang trước các thay đổi bất lợi về cơ học hô hấp, trung tâm hô hấp phải TĂNG hoạt động ở hầu hết các bệnh nhân (dù có ứ đọng CO2 hay không), không phải giảm kích thích."},{"number":9,"answer":"B","question":"Tình trạng tăng áp động mạch phổi ở bệnh phổi tắc nghẽn mạn tính xuất hiện khi giảm oxy máu:","options":[{"label":"A","text":"< 80mmHg ."},{"label":"B","text":"< 60mmHg ."},{"label":"C","text":"< 55mmHg ."},{"label":"D","text":"< 50mmHg ."}],"explanation":"Theo Giáo trình Hô hấp CTUMP: Tăng áp động mạch phổi phát triển ở giai đoạn nặng của BPTNMT khi tình trạng giảm oxy máu nặng < 60 mmHg, lâu dần tiến triển đến tâm phế mạn."},{"number":10,"answer":"D","question":"Phân loại mMRC = 3 điểm là bệnh nhân khó thở khi:","options":[{"label":"A","text":"Gắng sức nặng ."},{"label":"B","text":"Đi lại nhanh trên mặt bằng ."},{"label":"C","text":"Khó thở ngay trong các động tác sinh hoạt nhẹ ."},{"label":"D","text":"Đi lại trong khoảng 100m. ."}],"explanation":"Thang điểm mMRC: 0 = Khó thở khi gắng sức mạnh; 1 = Khó thở khi đi nhanh hoặc lên dốc nhẹ; 2 = Đi chậm hơn người cùng tuổi hoặc phải dừng lại thở khi đi trên mặt bằng; 3 = Phải dừng lại để thở khi đi bộ khoảng 100m hoặc sau vài phút; 4 = Khó thở nhiều khi thay quần áo/không thể rời khỏi nhà."},{"number":11,"answer":"A","question":"Bệnh nhân bệnh phổi tắc nghẽn mạn tính, kết quả hô hấp ký sau test hồi phục phế quản FEV₁/FVC = 0,62 và FEV₁ 84%. Hãy kết luận giai đoạn bệnh:","options":[{"label":"A","text":"GOLD 1 ."},{"label":"B","text":"GOLD 2 ."},{"label":"C","text":"GOLD 3 ."},{"label":"D","text":"GOLD 4 ."}],"explanation":"Chỉ số FEV1/FVC = 0,62 (< 0,70) xác định có rối loạn thông khí tắc nghẽn cố định. Với FEV1 = 84% (>= 80% giá trị dự đoán), bệnh nhân được phân loại mức độ tắc nghẽn GOLD 1 (mức độ nhẹ)."},{"number":12,"answer":"A","question":"Bệnh nhân nam, 60 tuổi, được chẩn đoán bệnh phổi tắc nghẽn mạn tính FEV₁ 78%, nhóm A. Đánh giá triệu chứng/nguy cơ đợt kịch phát của bệnh nhân này:","options":[{"label":"A","text":"Ít triệu chứng, nguy cơ thấp ."},{"label":"B","text":"Ít triệu chứng, nguy cơ cao ."},{"label":"C","text":"Nhiều triệu chứng, nguy cơ thấp ."},{"label":"D","text":"Nhiều triệu chứng, nguy cơ cao ."}],"explanation":"Theo GOLD: Nhóm A bao gồm các bệnh nhân có ít triệu chứng (mMRC 0-1 hoặc CAT < 10) và nguy cơ đợt cấp thấp (0 hoặc 1 đợt cấp trung bình trong năm qua, không phải nhập viện)."},{"number":13,"answer":"D","question":"Vi khuẩn gây bệnh phổi phổ biến trong đợt cấp bệnh phổi tắc nghẽn mạn tính, NGOẠI TRỪ:","options":[{"label":"A","text":"S. pneumoniae ."},{"label":"B","text":"M. catarrhalis ."},{"label":"C","text":"H. influenzae ."},{"label":"D","text":"Trực khuẩn gram âm ."}],"explanation":"Ba tác nhân vi khuẩn phổ biến nhất gây đợt cấp BPTNMT cộng đồng là Haemophilus influenzae, Streptococcus pneumoniae và Moraxella catarrhalis. Các trực khuẩn Gram âm (như P. aeruginosa, Enterobacteriaceae) chỉ gặp ở nhóm bệnh nhân nặng hoặc có yếu tố nguy cơ đặc biệt."},{"number":14,"answer":"C","question":"Đợt cấp bệnh phổi tắc nghẽn mạn tính, NGOẠI TRỪ:","options":[{"label":"A","text":"Bệnh trở nên xấu đi vượt quá dao động hàng ngày ."},{"label":"B","text":"Virus gây bệnh phổ biến là Coronavirus, Rhinovirus, Paramyxovirus ."},{"label":"C","text":"Khoảng 10% đợt cấp không xác định căn nguyên ."},{"label":"D","text":"Ô nhiễm khí thở cũng là nguyên nhân gây bệnh ."}],"explanation":"Theo Giáo trình Hô hấp SĐH: Khoảng 20 - 30% các đợt cấp BPTNMT không thể xác định được nguyên nhân vi sinh hay môi trường cụ thể, không phải 10%."},{"number":15,"answer":"B","question":"Yếu tố dự đoán nguy cơ nhiễm khuẩn trong đợt cấp bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"Bệnh phổi tắc nghẽn mạn tính giai đoạn I ."},{"label":"B","text":"Có đàm mủ ."},{"label":"C","text":"Tần suất đợt cấp ≥ 2 lần trong năm trước ."},{"label":"D","text":"Sử dụng kháng sinh trong 6 tháng gần đây ."}],"explanation":"Dấu hiệu khạc đờm mủ (hoặc sự thay đổi màu sắc đờm sang dạng mủ) là yếu tố dự đoán nhiễm khuẩn đáng tin cậy nhất trong đợt cấp BPTNMT (Tiêu chuẩn Anthonisen) và là chỉ định bắt buộc dùng kháng sinh."},{"number":16,"answer":"A","question":"Yếu tố nguy cơ nhiễm Pseudomonas spp (GOLD 2007) trong đợt cấp bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"Bệnh phổi tắc nghẽn mạn tính mức độ nặng ."},{"label":"B","text":"Mới nhập viện trong vòng 30 ngày ."},{"label":"C","text":"Điều trị kháng sinh ≥ 2 đợt/ năm ."},{"label":"D","text":"Bệnh nhân có kèm hen phế quản ."}],"explanation":"Các yếu tố nguy cơ nhiễm Pseudomonas aeruginosa trong đợt cấp BPTNMT theo GOLD bao gồm: BPTNMT mức độ rất nặng (FEV1 < 30% hoặc < 50%), từng phân lập được P. aeruginosa, sử dụng kháng sinh thường xuyên (>= 4 đợt/năm) hoặc sử dụng corticoid toàn thân kéo dài."},{"number":17,"answer":"A","question":"Chọn lựa kháng sinh đầu tiên điều trị đợt cấp bệnh phổi tắc nghẽn mạn tính mức độ nhẹ:","options":[{"label":"A","text":"Betalactam ."},{"label":"B","text":"Betalactam/kháng betalactamase ."},{"label":"C","text":"Fluoroquinolon ."},{"label":"D","text":"Phối hợp fluoroquinolon + Cephalosporin ."}],"explanation":"Đợt cấp BPTNMT mức độ nhẹ không có yếu tố nguy cơ thất bại điều trị thường khởi đầu bằng các kháng sinh thông thường như Betalactam đơn thuần (Amoxicillin), Macrolide hoặc Trimethoprim/sulfamethoxazole."},{"number":18,"answer":"C","question":"Chọn lựa kháng sinh điều trị đợt cấp bệnh phổi tắc nghẽn mạn tính mức độ trung bình, không nguy cơ nhiễm trực khuẩn mủ xanh:","options":[{"label":"A","text":"Ertapenem + Fluoroquinolon ."},{"label":"B","text":"Betalactam/ kháng betalactamase + Fluoroquinolon ."},{"label":"C","text":"Ertapenem ."},{"label":"D","text":"Phối hợp Fluoroquinolon + Cephalosporin ."}],"explanation":"Theo phác đồ điều trị đợt cấp BPTNMT (SĐH CTUMP), ở bệnh nhân đợt cấp mức độ trung bình/nặng không có nguy cơ nhiễm P. aeruginosa nhưng có nguy cơ vi khuẩn sinh ESBL hoặc thất bại kháng sinh ban đầu, Ertapenem đơn trị liệu là một lựa chọn phù hợp."},{"number":19,"answer":"D","question":"Chọn lựa kháng sinh điều trị đợt cấp bệnh phổi tắc nghẽn mạn tính có nguy cơ nhiễm trực khuẩn mủ xanh:","options":[{"label":"A","text":"Ertapenem ."},{"label":"B","text":"Moxifloxacin ."},{"label":"C","text":"Amoxicillin/acid clavunalic ."},{"label":"D","text":"Piperacillin-tazobactam ."}],"explanation":"Piperacillin-tazobactam có phổ kháng khuẩn mạnh trên Pseudomonas aeruginosa. Ngược lại, Ertapenem, Moxifloxacin và Amoxicillin/clavulanic acid không có tác dụng trên P. aeruginosa."},{"number":20,"answer":"B","question":"Liều Betalactam/kháng betalactamase trong điều trị đợt cấp bệnh phổi tắc nghẽn mạn tính liều tối thiểu là:","options":[{"label":"A","text":"2g/ ngày ."},{"label":"B","text":"3g/ ngày ."},{"label":"C","text":"4g/ ngày ."},{"label":"D","text":"6g/ ngày ."}],"explanation":"Khuyến cáo điều trị đợt cấp BPTNMT sử dụng Amoxicillin/clavulanate với liều tối thiểu 3g/ngày (ví dụ 1g x 3 lần/ngày) để đảm bảo nồng độ ức chế tối thiểu đối với các vi khuẩn giảm nhạy cảm."},{"number":21,"answer":"C","question":"Thuốc giãn phế quản thuộc nhóm kích thích beta 2 adrenergic trong xử trí đợt cấp bệnh phổi tắc nghẽn mạn tính, NGOẠI TRỪ:","options":[{"label":"A","text":"Salbutamol ."},{"label":"B","text":"Terbutalin ."},{"label":"C","text":"Ipratropium ."},{"label":"D","text":"Bambuterol ."}],"explanation":"Ipratropium bromide thuộc nhóm thuốc kháng cholinergic tác dụng ngắn (SAMA), không phải nhóm kích thích thụ thể beta-2 adrenergic (SABA/LABA)."},{"number":22,"answer":"A","question":"Mục tiêu oxy cho bệnh nhân đợt cấp bệnh phổi tắc nghẽn mạn tính:","options":[{"label":"A","text":"88 – 92% ."},{"label":"B","text":"92– 94% ."},{"label":"C","text":"94– 96% ."},{"label":"D","text":"96– 98% ."}],"explanation":"Liệu pháp oxy trong đợt cấp BPTNMT cần có kiểm soát nhằm đạt mục tiêu SpO2 từ 88% - 92% để tránh nguy cơ làm giảm thông khí phế nang do mất trung khu kích thích thiếu oxy gây tăng CO2 máu nặng."},{"number":23,"answer":"B","question":"Thông khí NIPPV trong đợt cấp bệnh phổi tắc nghẽn mạn tính nhằm các mục tiêu sau, NGOẠI TRỪ:","options":[{"label":"A","text":"Giảm CO₂ ."},{"label":"B","text":"Giảm thông khí phổi ."},{"label":"C","text":"Giảm tử vong trong thời gian nằm viện ."},{"label":"D","text":"Tránh đặt nội khí quản và thở máy can thiệp ."}],"explanation":"Thở máy không xâm lấn (NIPPV) giúp TĂNG thông khí phế nang, giảm công thở, đào thải CO2, giảm tỷ lệ tử vong và tránh được đặt nội khí quản thở máy xâm lấn."},{"number":24,"answer":"D","question":"Tiêu chuẩn ngưng theo dõi điều trị đợt cấp bệnh phổi tắc nghẽn mạn tính nội trú, NGOẠI TRỪ:","options":[{"label":"A","text":"Nhu cầu sử dụng beta 2 hít <6 lần/ngày ."},{"label":"B","text":"Có thể trở lại các sinh hoạt như trước đợt cấp ."},{"label":"C","text":"Lâm sàng ổn định trong 24h ."},{"label":"D","text":"Khí máu động mạch trở về bình thường ."}],"explanation":"Ở bệnh nhân BPTNMT mạn tính nặng, khí máu động mạch có thể duy trì tình trạng tăng CO2 mạn tính bù trừ, không bắt buộc trở về chỉ số bình thường tuyệt đối của người khỏe mạnh. Các tiêu chuẩn A, B, C và lâm sàng/khí máu ổn định trong 12-24h là các chỉ số chính xác để xem xét xuất viện."},{"number":25,"answer":"B","question":"Chọn 1 Câu sai: Đánh giá tiến triển bệnh phổi tắc nghẽn mạn tính","options":[{"label":"A","text":"Cần theo dõi kết quả chức năng phổi hàng năm, đánh giá dung tích chức năng bằng nghiệm pháp đi bộ theo thời gian. ."},{"label":"B","text":"Đo độ bão hoả oxy trong khí máu động mạch lúc gắng sức để hỗ trợ oxy liệu pháp. ."},{"label":"C","text":"Sử dụng bộ Câu hỏi trắc nghiệm đánh giá BPTNMT (CAT). ."},{"label":"D","text":"Ghi nhận tần suất, mức độ nặng, nguyên nhân của đợt cấp. ."}],"explanation":"Chỉ định liệu pháp oxy dài hạn tại nhà dựa trên đo độ bão hòa oxy và khí máu động mạch LÚC NGHỈ (PaO2 <= 55 mmHg hoặc SpO2 <= 88%)."},{"number":26,"answer":"A","question":"Trong viêm phổi thuỳ, theo mô tả của Laennec, giai đoạn sung huyết là:","options":[{"label":"A","text":"Các mao mạch thành phế nang giãn ra, hồng cầu, bạch cầu và fibrin thoát vào lòng phế nang ."},{"label":"B","text":"Tổ chức phổi bị tổn thương có màu đỏ sẫm và chắc như gan, trong tổ chức này có thể xuất huyết ."},{"label":"C","text":"Thương tổn phổi có màu nâu xám chứa hồng cầu, bạch cầu, vi khuẩn và tổ chức hoại tử ."},{"label":"D","text":"Phế nang còn ít dịch loãng, có ít bạch cầu ."}],"explanation":"Theo giải phẫu bệnh viêm phổi thùy cổ điển: Giai đoạn sung huyết (24h đầu) đặc trưng bởi các mao mạch phế nang giãn rộng, xung huyết, dịch tiết rỉ viêm cùng hồng cầu, bạch cầu bắt đầu tràn vào lòng phế nang. (Lựa chọn B là gan hóa đỏ, C là gan hóa xám, D là giai đoạn tiêu tan)."},{"number":27,"answer":"C","question":"Tỉ lệ KHÔNG xác định được tác nhân gây bệnh viêm phổi cộng đồng là:","options":[{"label":"A","text":"< 5% ."},{"label":"B","text":"20-30% ."},{"label":"C","text":"50% ."},{"label":"D","text":"> 60% ."}],"explanation":"Theo Giáo trình Hô hấp: Trong thực hành lâm sàng viêm phổi cộng đồng, có tới khoảng 50% các trường hợp không thể xác định được vi khuẩn/virus gây bệnh dù đã làm xét nghiệm vi sinh."},{"number":28,"answer":"C","question":"Thuật ngữ Viêm phổi cộng đồng, Viêm phổi bệnh viện, Viêm phổi liên quan tới chăm sóc y tế, Viêm phổi thở máy là để:","options":[{"label":"A","text":"Chỉ tình trạng nặng hay nhẹ của viêm phổi ."},{"label":"B","text":"Chỉ điều kiện y tế chăm sóc đặc biệt ."},{"label":"C","text":"Để định hướng tác nhân vi sinh gây bệnh ."},{"label":"D","text":"Để phân loại bệnh học viêm phổi ."}],"explanation":"Việc phân loại viêm phổi theo hoàn cảnh xuất hiện (cộng đồng, bệnh viện, thở máy) giúp bác sĩ dự đoán các nhóm tác nhân vi sinh gây bệnh phổ biến và mức độ kháng thuốc để đưa ra phác đồ điều trị kháng sinh kinh nghiệm ban đầu phù hợp."},{"number":29,"answer":"D","question":"Chọn 1 Câu đúng trong những Câu trả lời sau đây: Tiếng ran nổ khi nghe phổi có thể hiểu là:","options":[{"label":"A","text":"Viêm phổi ."},{"label":"B","text":"Phù phổi ."},{"label":"C","text":"Có dịch tiết bất thường trong lòng phế nang ."},{"label":"D","text":"Cả ba câu trên đều đúng ."}],"explanation":"Ran nổ sinh ra khi các phế nang chứa dịch bất thường (dịch tiết viêm trong viêm phổi, dịch thấm trong phù phổi) bị bóc tách ra ở cuối thì hít vào. Do đó cả 3 đáp án A, B, C đều đúng."},{"number":30,"answer":"A","question":"Chọn 1 Câu sai trong những trả lời sau đây: Chẩn đoán và đánh giá viêm phổi ở cộng đồng","options":[{"label":"A","text":"Cần xét nghiệm công thức máu và Xquang ngực thẳng cho tất cả các trường hợp chẩn đoán viêm phổi ở cộng đồng ."},{"label":"B","text":"Xquang ngực là cần thiết khi chẩn đoán viêm phổi ở cộng đồng ."},{"label":"C","text":"Trên người trẻ tiền sử khỏe mạnh, với bệnh cảnh nhiễm trùng hô hấp cấp tính có triệu chứng thực thể phổi có thể chẩn đoán viêm phổi không cần chụp Xquang ngực nếu điều trị ngoại bệnh viện. ."},{"label":"D","text":"Không cần xét nghiệm ure máu cho tất cả các trường hợp chẩn đoán viêm phổi ở cộng đồng. ."}],"explanation":"Trong điều kiện điều trị ngoại trú ở người trẻ tuổi khỏe mạnh không có dấu hiệu nặng, việc chẩn đoán có thể dựa vào lâm sàng mà không nhất thiết phải bắt buộc làm công thức máu hay X-quang cho tất cả mọi trường hợp."},{"number":31,"answer":"B","question":"Tác nhân nào sau đây KHÔNG phải là nguyên nhân gây viêm phổi cộng đồng:","options":[{"label":"A","text":"Streptococcus pneumoniae ."},{"label":"B","text":"Mycobacterium tuberculosis ."},{"label":"C","text":"Haemophilus influenzae ."},{"label":"D","text":"Klebsiella pneumonia ."}],"explanation":"Mycobacterium tuberculosis gây bệnh Lao phổi (một bệnh nhiễm trùng mạn tính đặc hiệu), không xếp vào định nghĩa Viêm phổi cộng đồng cấp tính do vi khuẩn thông thường."},{"number":32,"answer":"D","question":"Các yếu tố nguy cơ nhiễm P.aeruginosa đề kháng kháng sinh ở bệnh nhân viêm phổi cộng đồng bao gồm:","options":[{"label":"A","text":"Tiền sử đã nhiễm tụ cầu kháng Methicilline ."},{"label":"B","text":"Tiền sử đã nhiễm phế cầu kháng Penicilline ."},{"label":"C","text":"Nhiễm trùng đa tái diễn ."},{"label":"D","text":"Có bệnh cấu trúc phổi ."}],"explanation":"Người bệnh có bệnh lý cấu trúc phổi mạn tính (như giãn phế quản, BPTNMT nặng, xơ nang) là yếu tố nguy cơ hàng đầu nhiễm Pseudomonas aeruginosa kháng thuốc."},{"number":33,"answer":"C","question":"Khi sử dụng CRB-65 để phân tầng nguy cơ viêm phổi cộng đồng, bao nhiêu điểm thì phân loại mức độ nguy cơ nặng:","options":[{"label":"A","text":"1 ."},{"label":"B","text":"2 ."},{"label":"C","text":"3 ."},{"label":"D","text":"4 ."}],"explanation":"Thang điểm CRB-65: 0 điểm = Nguy cơ thấp (điều trị ngoại trú); 1-2 điểm = Nguy cơ trung bình (cân nhắc nhập viện); 3-4 điểm = Nguy cơ nặng (bắt buộc nhập viện cấp cứu/ICU)."},{"number":34,"answer":"D","question":"Về tiêu chuẩn phân loại mức độ viêm phổi cộng đồng (theo ATS). CHỌN CÂU SAI:","options":[{"label":"A","text":"Nhịp thở ≥ 30 lần/min ."},{"label":"B","text":"Lú lẫn/mất phương hướng ."},{"label":"C","text":"BUN ≥ 20 mg/dL ."},{"label":"D","text":"Tỉ số PaO₂/FiO₂ ≤ 200 ."}],"explanation":"Tiêu chuẩn phụ đánh giá VPCĐ nặng theo ATS/IDSA bao gồm: Nhịp thở >= 30 lần/phút, Lú lẫn/mất phương hướng, BUN >= 20 mg/dL (7 mmol/L), và PaO2/FiO2 <= 250 (không phải <= 200)."},{"number":35,"answer":"A","question":"Bảng điểm PSI trong phân tầng nguy cơ viêm phổi cộng đồng, yếu tố “suy tim sung huyết” bao nhiêu điểm:","options":[{"label":"A","text":"10 điểm ."},{"label":"B","text":"15 điểm ."},{"label":"C","text":"20 điểm ."},{"label":"D","text":"30 điểm ."}],"explanation":"Bảng điểm PSI (Fine): Ung thư (+30 điểm), Bệnh gan (+20 điểm), Suy tim sung huyết (+10 điểm), Bệnh mạch máu não (+10 điểm), Bệnh thận (+10 điểm)."},{"number":36,"answer":"C","question":"Tác nhân vi sinh không điển hình trong bệnh viêm phổi. CHỌN CÂU SAI:","options":[{"label":"A","text":"Mycoplasma pneumoniae ."},{"label":"B","text":"Chlamydia pneumoniae ."},{"label":"C","text":"Haemophilus influenzae ."},{"label":"D","text":"Legionella pneumophila ."}],"explanation":"H. influenzae là vi khuẩn Gram âm điển hình. Các tác nhân không điển hình phổ biến gồm Mycoplasma pneumoniae, Chlamydia pneumoniae và Legionella pneumophila."},{"number":37,"answer":"D","question":"Các yếu tố nguy cơ nhiễm S. aureus kháng methicillin, chọn Câu sai:","options":[{"label":"A","text":"Viêm phổi nặng, bao gồm sốc nhiễm trùng và đòi hỏi thông khí cơ học ."},{"label":"B","text":"Viêm phổi hoại tử hoặc tạo hang và biến chứng mủ màng phổi ."},{"label":"C","text":"Sống trong môi trường đông đúc ."},{"label":"D","text":"Sau cảm cúm 1 tháng ."}],"explanation":"Viêm phổi do Tụ cầu vàng (CA-MRSA) thường xuất hiện rất sớm ngay trong hoặc sau đợt nhiễm cúm cấp tính (vài ngày đến 1-2 tuần sau cúm), không phải sau 1 tháng."},{"number":38,"answer":"B","question":"Nguy cơ nhiễm pneumococcus kháng penicillin và kháng thuốc ở bệnh nhân viêm phổi cộng đồng:","options":[{"label":"A","text":"Có bệnh lý cấu trúc phổi ."},{"label":"B","text":"Điều trị kháng sinh phổ rộng trên 7 ngày trong tháng trước ."},{"label":"C","text":"Nghiện rượu ."},{"label":"D","text":"Suy dinh dưỡng ."}],"explanation":"Sử dụng kháng sinh phổ rộng (đặc biệt là betalactam) trong thời gian gần đây (1-3 tháng trước) là yếu tố nguy cơ hàng đầu dẫn đến nhiễm phế cầu (S. pneumoniae) kháng Penicillin và đa kháng thuốc."},{"number":39,"answer":"D","question":"Giai đoạn điển hình của viêm phổi thuỳ có đặc điểm:","options":[{"label":"A","text":"Hội chứng nhiễm trùng giảm dần ."},{"label":"B","text":"Triệu chứng cơ năng không điển hình ."},{"label":"C","text":"Thường có tràn dịch màng phổi đi kèm ."},{"label":"D","text":"Phát hiện hội chứng đông đặc ."}],"explanation":"Trong giai đoạn toàn phát/điển hình của viêm phổi thùy, thăm khám thực thể phổi phát hiện đầy đủ các triệu chứng của Hội chứng đông đặc nhu mô phổi (Rung thanh tăng, gõ đục, rì rào phế nang giảm hoặc tiếng thổi ống/ran nổ)."},{"number":40,"answer":"C","question":"Chọn đáp án đúng: “Viêm phổi là tình trạng ..(1).. của ..(2).. bao gồm viêm phế nang, ống và túi phế nang, tiểu phế quản tận hoặc viêm tổ chức kẽ của phổi.","options":[{"label":"A","text":"(1) viêm, (2) cấu trúc phổi ."},{"label":"B","text":"(1) nhiễm trùng, (2) cấu trúc phổi ."},{"label":"C","text":"(1) viêm, (2) nhu mô phổi ."},{"label":"D","text":"(1) nhiễm trùng, (2) nhu mô phổi ."}],"explanation":"Định nghĩa chuẩn: Viêm phổi là tình trạng viêm cấp tính của nhu mô phổi bao gồm phế nang, ống và túi phế nang, tiểu phế quản tận hoặc tổ chức kẽ của phổi."},{"number":41,"answer":"B","question":"Chọn 1 Câu đúng trong những Câu trả lời sau đây: Thuật ngữ điều trị kháng sinh kinh nghiệm dùng để chỉ:","options":[{"label":"A","text":"Điều trị kháng sinh theo kinh nghiệm của thầy thuốc lâm sàng ."},{"label":"B","text":"Điều trị kháng sinh theo khuyến cáo dựa trên bằng chứng y học ."},{"label":"C","text":"Điều trị kháng sinh không dựa trên xét nghiệm vi sinh ."},{"label":"D","text":"Điều
